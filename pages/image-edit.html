<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片处理工具</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}html,body{width:100vw;height:100vh;overflow:hidden;background:#e9edf2;font-family:system-ui,-apple-system,sans-serif}
    .app-card{width:100%;height:100%;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);display:flex;flex-direction:column;padding:1rem 1.5rem 1.5rem}
    .header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.2rem;flex-shrink:0}
    h1{font-size:1.5rem;font-weight:600;color:#1e293b}h1 span{background:linear-gradient(135deg,#4f46e5,#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
    .standalone-btn{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:.4rem .8rem;font-size:.8rem;font-weight:500;color:#475569;cursor:pointer}
    .subhead{color:#475569;margin-bottom:1rem;font-size:.85rem;border-left:4px solid #a78bfa;padding-left:.8rem;flex-shrink:0}
    .editor-grid{display:grid;grid-template-columns:1fr 380px;gap:1.5rem;flex:1;min-height:0}
    .left-panel{display:flex;flex-direction:column;min-height:0}
    .preview-panel{background:#ffffffd9;border-radius:1rem;padding:.8rem;display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
    
    /* 画布自适应，消除两侧留白 */
    .canvas-wrapper{background-color:#f1f5f9;background-image:linear-gradient(45deg,#e2e8f0 25%,transparent 25%),linear-gradient(-45deg,#e2e8f0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e2e8f0 75%),linear-gradient(-45deg,transparent 75%,#e2e8f0 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0px;border-radius:.75rem;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative;border:2px dashed #cbd5e1;margin-bottom:.5rem;flex:1;min-height:0;cursor:pointer}
    #fileInput{display:none}
    /* 使用 width:100%; height:100%; object-fit:contain 确保画布撑满且比例正确 */
    #imageCanvas{width:100%;height:100%;object-fit:contain;display:block;cursor:default;border:0;padding:0;margin:0}
    
    .canvas-wrapper.mode-crop #imageCanvas{cursor:crosshair}
    .canvas-wrapper.mode-sticker #imageCanvas{cursor:grab}
    .canvas-wrapper.mode-sticker #imageCanvas:active{cursor:grabbing}
    .canvas-wrapper.mode-adjust #imageCanvas{cursor:grab}
    .canvas-wrapper.mode-adjust #imageCanvas:active{cursor:grabbing}
    .sticker-controls{position:fixed;display:none;gap:6px;z-index:9999;transform:translate(10px,-50%)}
    .sticker-ctrl-btn{height:26px;border-radius:13px;background:#4f46e5;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 8px;font-size:12px;font-weight:bold;white-space:nowrap}
    .sticker-ctrl-btn.delete{background:#ef4444}.sticker-ctrl-btn.success{background:#10b981}
    .placeholder-message{position:absolute;display:flex;flex-direction:column;align-items:center;gap:.5rem;color:#94a3b8;pointer-events:none}
    .preview-footer{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-shrink:0}
    .action-buttons{display:flex;gap:.6rem}
    .btn{padding:.5rem 1rem;border-radius:60px;font-weight:600;font-size:.8rem;border:none;cursor:pointer;background:#fff;color:#1e293b;border:1px solid #e2e8f0}
    .btn-primary{background:#4f46e5;color:#fff;border:1px solid #4f46e5}
    .btn-danger{background:#fee2e2;border-color:#fecaca;color:#b91c1c}
    .btn:disabled{opacity:.45;pointer-events:none}
    .adjust-bar{display:none;position:absolute;left:50%;bottom:14px;transform:translateX(-50%);gap:10px;z-index:50;background:rgba(255,255,255,.92);padding:8px 12px;border-radius:60px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
    .adjust-bar.show{display:flex}
    .control-panel{display:flex;flex-direction:column;gap:1rem;overflow-y:auto;padding-right:.5rem}
    .section-card{background:#ffffffd9;border-radius:1rem;padding:0 1.25rem 1.25rem;flex-shrink:0}
    .section-header{display:flex;justify-content:space-between;align-items:center;padding:1rem 0 .5rem;cursor:pointer;font-weight:600;color:#1e293b;font-size:.95rem}
    .chevron{width:1.2rem;height:1.2rem;transition:transform .3s;stroke:#64748b}
    .section-card.collapsed .chevron{transform:rotate(-90deg)}
    .section-content{display:flex;flex-direction:column;gap:.8rem;padding-top:.2rem;max-height:1200px;overflow:hidden;transition:all .3s}
    .section-card.collapsed .section-content{max-height:0;opacity:0;padding-top:0}
    .crop-group,.direction-group,.presets{display:flex;flex-wrap:wrap;gap:.5rem}
    .crop-btn,.dir-btn,.preset-btn{background:#f8fafc;border:1px solid #e2e8f0;border-radius:40px;padding:.4rem .8rem;font-size:.75rem;cursor:pointer;flex:1 1 auto;text-align:center}
    .crop-btn.active{background:#4f46e5;border-color:#4f46e5;color:#fff}
    .filter-section{display:flex;flex-direction:column;gap:.8rem}
    .slider-header{display:flex;justify-content:space-between;font-size:.8rem;font-weight:500;margin-bottom:.2rem}
    .slider-value{color:#4f46e5;background:#eef2ff;padding:.1rem .4rem;border-radius:40px;font-size:.7rem}
    input[type="range"]{width:100%;height:5px;background:#e2e8f0;border-radius:10px;outline:none;-webkit-appearance:none}
    input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#4f46e5;border:2px solid #fff;cursor:pointer}
    .size-info-grid{background:#f8fafc;padding:.6rem .8rem;border-radius:.75rem;border:1px solid #e2e8f0;font-size:.8rem;margin-bottom:.4rem}
    .size-info-row{display:flex;justify-content:space-between;margin-bottom:4px}
    .size-info-value{font-weight:600;background:#eef2ff;padding:.1rem .6rem;border-radius:40px;color:#4f46e5;font-size:.75rem}
    .size-status-text{font-size:.75rem;color:#4f46e5;background:#eef2ff;padding:.35rem;border-radius:6px;text-align:center;margin-bottom:.6rem;min-height:2rem;display:flex;align-items:center;justify-content:center}
    .size-buttons{display:flex;gap:.6rem}.size-btn{flex:1;background:#f8fafc;border:1px solid #e2e8f0;border-radius:40px;padding:.6rem 0;font-size:.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .sticker-list-container{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;background:#f8fafc;padding:8px;border-radius:8px;border:1px dashed #cbd5e1}
    .sticker-item{width:48px;height:48px;object-fit:contain;background:#e2e8f0;border-radius:4px;cursor:pointer}
  </style>
</head>
<body>
  <div class="app-card">
    <div class="header-row"><h1><span>✨ 图片处理</span> 工具</h1><button class="standalone-btn" id="standaloneBtn">⧉</button></div>
    <div class="subhead">纯前端工具，本地化操作。</div>
    <div class="editor-grid">
      <div class="left-panel">
        <div class="preview-panel">
          <div class="canvas-wrapper" id="canvasWrapper">
            <div class="sticker-controls" id="stickerControls">
              <button class="sticker-ctrl-btn success" id="saveStickerBtn" style="display:none">➕ 存入贴纸</button>
              <button class="sticker-ctrl-btn delete" id="cancelCropBtn" style="display:none">✖ 取消</button>
              <button class="sticker-ctrl-btn" id="scaleUpBtn" style="display:none">＋</button>
              <button class="sticker-ctrl-btn" id="scaleDownBtn" style="display:none">－</button>
              <button class="sticker-ctrl-btn delete" id="deleteStickerBtn" style="display:none">×</button>
            </div>
            <div class="placeholder-message" id="placeholderMsg">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:3rem;height:3rem"><rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="8.5" cy="8.5" r="1.5" fill="#cbd5e1" stroke="none"/><path d="M21 15L16 10L5 21"/></svg>
              <span>点击选择图片，或将图片拖拽到此处</span>
            </div>
            <canvas id="imageCanvas" style="display:none"></canvas>
            <div class="adjust-bar" id="adjustBar">
              <button class="btn btn-danger" id="adjustCancelBtn">取消</button>
              <button class="btn btn-primary" id="adjustApplyBtn">应用裁剪</button>
            </div>
          </div>
          <div class="preview-footer">
            <div><span id="fileNameDisplay" style="font-size:.8rem;color:#64748b">未选择文件</span></div>
            <div class="action-buttons">
              <button class="btn btn-danger" id="clearBtn" disabled>清空画布</button>
              <button class="btn" id="resetBtn" disabled>重置</button>
              <button class="btn" id="copyBtn" disabled>复制</button>
              <button class="btn btn-primary" id="downloadBtn" disabled>下载</button>
            </div>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/*">
      </div>
      <div class="control-panel">
        
        <!-- 基础调整 -->
        <div class="section-card collapsed" id="basicSection">
          <div class="section-header" data-target="basic"><span>📐 尺寸方向</span><svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" fill="none" stroke-width="2"/></svg></div>
          <div class="section-content">
            <div class="crop-group">
              <button class="crop-btn" data-crop="free" disabled>自由</button>
              <button class="crop-btn" data-crop="square" disabled>正方形</button>
              <button class="crop-btn" data-crop="3:4" disabled>竖矩形(3:4)</button>
              <button class="crop-btn" data-crop="4:3" disabled>横矩形(4:3)</button>
            </div>
            <div class="direction-group" style="margin-top:.5rem">
              <button class="dir-btn" data-dir="left" disabled>↺ 左转</button>
              <button class="dir-btn" data-dir="right" disabled>↻ 右转</button>
              <button class="dir-btn" data-dir="mirror-h" disabled>⇋ 镜像</button>
              <button class="dir-btn" data-dir="mirror-v" disabled>⇅ 镜像</button>
            </div>
          </div>
        </div>

        <!-- 滤镜调整 -->
        <div class="section-card collapsed" id="filterSection">
          <div class="section-header" data-target="filter"><span>🎨 滤镜调色</span><svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" fill="none" stroke-width="2"/></svg></div>
          <div class="section-content">
            <div class="filter-section">
              <div><div class="slider-header"><span>亮度</span><span class="slider-value" id="brightnessVal">100%</span></div><input type="range" id="brightness" min="0" max="200" value="100" disabled></div>
              <div><div class="slider-header"><span>对比度</span><span class="slider-value" id="contrastVal">100%</span></div><input type="range" id="contrast" min="0" max="200" value="100" disabled></div>
              <div><div class="slider-header"><span>饱和度</span><span class="slider-value" id="saturateVal">100%</span></div><input type="range" id="saturate" min="0" max="200" value="100" disabled></div>
            </div>
            <div class="presets" style="margin-top:.5rem">
              <button class="preset-btn" data-preset="original" disabled>原图</button>
              <button class="preset-btn" data-preset="vintage" disabled>复古</button>
              <button class="preset-btn" data-preset="bright" disabled>明亮</button>
              <button class="preset-btn" data-preset="mono" disabled>黑白</button>
              <button class="preset-btn" data-preset="cool" disabled>冷色</button>
            </div>
          </div>
        </div>

        <!-- 图形字节 -->
        <div class="section-card collapsed" id="sizeSection">
          <div class="section-header" data-target="size"><span>⚖️ 图形字节</span><svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" fill="none" stroke-width="2"/></svg></div>
          <div class="section-content">
            <div class="size-info-grid">
              <div class="size-info-row"><span>📐 尺寸</span><span class="size-info-value" id="infoDimensions">—</span></div>
              <div class="size-info-row"><span>📦 大小</span><span class="size-info-value" id="infoFileSize">—</span></div>
            </div>
            <div class="size-status-text" id="sizeStatusText">等待操作...</div>
            <div class="size-buttons"><button class="size-btn" id="decreaseSizeBtn" disabled>⬇️ 减小</button><button class="size-btn" id="increaseSizeBtn" disabled>⬆️ 增加</button></div>
          </div>
        </div>

        <!-- 抠图功能 -->
        <div class="section-card collapsed" id="stickerSection">
          <div class="section-header"><span>✂️ 抠图贴纸</span><svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" fill="none" stroke-width="2"/></svg></div>
          <div class="section-content">
            <div class="size-buttons" style="margin-bottom:0.5rem">
              <button class="size-btn" id="startCropBtn" disabled>选区</button>
              <button class="size-btn" id="extractBgBtn" disabled>抠除</button>
            </div>
            <button class="size-btn" id="clearStickersBtn" style="width:100%" disabled>清空贴纸</button>
            <div style="font-size:.8rem;margin-top:.5rem">🎯 已保存的贴纸</div>
            <div id="stickerList" class="sticker-list-container"><span style="font-size:.75rem;margin:0 auto;line-height:44px">暂无贴纸</span></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    (function(){
      const $=id=>document.getElementById(id);
      const fileInput=$('fileInput'),fileNameDisplay=$('fileNameDisplay'),canvas=$('imageCanvas'),ctx=canvas.getContext('2d'),placeholderMsg=$('placeholderMsg'),canvasWrapper=$('canvasWrapper'),startCropBtn=$('startCropBtn'),extractBgBtn=$('extractBgBtn'),clearStickersBtn=$('clearStickersBtn'),stickerList=$('stickerList'),stickerControls=$('stickerControls'),saveStickerBtn=$('saveStickerBtn'),cancelCropBtn=$('cancelCropBtn'),scaleUpBtn=$('scaleUpBtn'),scaleDownBtn=$('scaleDownBtn'),deleteStickerBtn=$('deleteStickerBtn'),resetBtn=$('resetBtn'),clearBtn=$('clearBtn'),copyBtn=$('copyBtn'),downloadBtn=$('downloadBtn'),standaloneBtn=$('standaloneBtn'),adjustBar=$('adjustBar'),adjustApplyBtn=$('adjustApplyBtn'),adjustCancelBtn=$('adjustCancelBtn'),sizeStatusText=$('sizeStatusText');
      const sliders={brightness:$('brightness'),contrast:$('contrast'),saturate:$('saturate')};
      const valLabels={brightness:$('brightnessVal'),contrast:$('contrastVal'),saturate:$('saturateVal')};
      
      let originalBackup=null,originalImage=null,currentImageLoaded=false,currentCrop='free',rotationAngle=0,isMirroredH=false,isMirroredV=false,isCropMode=false,cropStartPos=null,cropRect=null,isDragging=false,dragOffset={x:0,y:0},isEditingExtracted=false,currentFileSizeBytes=0,lastCanvasDataURLSize=0;
      let isAdjustMode=false,adjustRatio=null,adjustOffset={x:0,y:0},adjustScale=1,adjustCanvasW=0,adjustCanvasH=0,isAdjustDragging=false,adjustDragStart={x:0,y:0,mx:0,my:0};
      
      let stickers = [];
      let activeStickerId = null;

      const KB=1024,MB=1024*1024,MIN_SIZE_BYTES=50*KB,MAX_SIZE_BYTES=5*MB;
      
      function updateButtonsState() {
        const hasImage = currentImageLoaded;
        
        document.querySelectorAll('.crop-btn, .dir-btn, .preset-btn, #startCropBtn').forEach(btn => {
          btn.disabled = !hasImage;
        });
        sliders.brightness.disabled = !hasImage;
        sliders.contrast.disabled = !hasImage;
        sliders.saturate.disabled = !hasImage;
        
        copyBtn.disabled = !hasImage;
        downloadBtn.disabled = !hasImage;
        clearBtn.disabled = !hasImage;
        resetBtn.disabled = !hasImage;
        
        if(hasImage) {
           extractBgBtn.disabled = !(isCropMode || isEditingExtracted); 
        } else {
           extractBgBtn.disabled = true;
        }

        clearStickersBtn.disabled = (stickers.length === 0);
      }

      function formatFileSize(b){if(!b)return '—';if(b<KB)return b+' B';if(b<MB)return (b/KB).toFixed(1)+' KB';return (b/MB).toFixed(2)+' MB';}
      function getDataURLSize(u){const b=u.split(',')[1];return b?Math.floor(b.length*3/4):0;}
      
      function updateSizePanelInfo(){
        if(originalImage)$('infoDimensions').textContent=originalImage.width+' × '+originalImage.height;
        else $('infoDimensions').textContent='—';
        
        $('infoFileSize').textContent=formatFileSize(currentFileSizeBytes);
        
        if(!currentImageLoaded||canvas.width===0||!lastCanvasDataURLSize){
          $('decreaseSizeBtn').disabled=true;
          $('increaseSizeBtn').disabled=true;
          return;
        }
        $('decreaseSizeBtn').disabled=lastCanvasDataURLSize<MIN_SIZE_BYTES;
        $('increaseSizeBtn').disabled=lastCanvasDataURLSize>MAX_SIZE_BYTES;
      }

      // 修复：统一获取 JPEG 实际大小，与实际下载体积一致
      function refreshCanvasSizeMetric(){
        if(!currentImageLoaded||canvas.width===0){
          lastCanvasDataURLSize=0;
          updateSizePanelInfo();
          return;
        }
        try{
          lastCanvasDataURLSize=getDataURLSize(canvas.toDataURL('image/jpeg',0.9));
        }catch(e){
          lastCanvasDataURLSize=0;
        }
        updateSizePanelInfo();
      }

      function getFilterString(){return `brightness(${sliders.brightness.value/100}) contrast(${sliders.contrast.value/100}) saturate(${sliders.saturate.value/100})`;}
      function updateSliderLabels(){valLabels.brightness.textContent=sliders.brightness.value+'%';valLabels.contrast.textContent=sliders.contrast.value+'%';valLabels.saturate.textContent=sliders.saturate.value+'%';}

      function getRotatedSize(img){
        const w=img.width,h=img.height,rad=(rotationAngle*Math.PI)/180,absCos=Math.abs(Math.cos(rad)),absSin=Math.abs(Math.sin(rad));
        return {w:Math.round(w*absCos+h*absSin),h:Math.round(w*absSin+h*absCos)};
      }

      function render(){
        if(!currentImageLoaded||!originalImage)return;
        const rs=getRotatedSize(originalImage),rotatedW=rs.w,rotatedH=rs.h,rad=(rotationAngle*Math.PI)/180;
        const temp=document.createElement('canvas');temp.width=rotatedW;temp.height=rotatedH;const tctx=temp.getContext('2d');
        
        tctx.save();
        tctx.translate(rotatedW/2,rotatedH/2);
        tctx.rotate(rad);
        tctx.scale(isMirroredH?-1:1, isMirroredV?-1:1);
        tctx.drawImage(originalImage,-originalImage.width/2,-originalImage.height/2,originalImage.width,originalImage.height);
        tctx.restore();
        
        canvas.width=rotatedW;canvas.height=rotatedH;
        // 修复：移除强制行内宽高，让 CSS 接管自适应撑满
        canvas.style.width='';canvas.style.height=''; 
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.filter=getFilterString();ctx.drawImage(temp,0,0);ctx.filter='none';
        
        ctx.save();
        stickers.forEach(s=>{
          if(s.isOnCanvas){
            const cx=s.x*canvas.width,cy=s.y*canvas.height,dw=s.img.width*s.scale,dh=s.img.height*s.scale;
            if(s.id===activeStickerId){
              ctx.strokeStyle='#4f46e5';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.strokeRect(cx-dw/2,cy-dh/2,dw,dh);ctx.setLineDash([]);
            }
            ctx.drawImage(s.img,cx-dw/2,cy-dh/2,dw,dh);
          }
        });
        ctx.restore();
        
        if(isCropMode&&cropRect){ctx.save();ctx.strokeStyle='#4f46e5';ctx.lineWidth=2;ctx.setLineDash([5,5]);const rX=cropRect.x*canvas.width,rY=cropRect.y*canvas.height,rW=cropRect.w*canvas.width,rH=cropRect.h*canvas.height;ctx.strokeRect(rX,rY,rW,rH);ctx.fillStyle='rgba(79,70,229,0.15)';ctx.fillRect(rX,rY,rW,rH);ctx.restore();}
        canvas.style.display='block';placeholderMsg.style.display='none';updateFloatingButtonsPosition();setTimeout(refreshCanvasSizeMetric,0);
      }

      function renderAdjust(){
        if(!currentImageLoaded||!originalImage)return;
        const wrapperRect=canvasWrapper.getBoundingClientRect();
        const pad=16;
        const availW=Math.max(50,wrapperRect.width-pad*2),availH=Math.max(50,wrapperRect.height-pad*2);
        let targetRatio;
        if(adjustRatio==='free'||!adjustRatio){const rs=getRotatedSize(originalImage);targetRatio=rs.w/rs.h;}
        else if(adjustRatio==='square'){targetRatio=1;}
        else if(adjustRatio==='3:4'){targetRatio=3/4;}
        else if(adjustRatio==='4:3'){targetRatio=4/3;}
        else{targetRatio=1;}
        let cw,ch;
        if(availW/availH>targetRatio){ch=availH;cw=ch*targetRatio;}else{cw=availW;ch=cw/targetRatio;}
        cw=Math.max(1,Math.round(cw));ch=Math.max(1,Math.round(ch));
        adjustCanvasW=cw;adjustCanvasH=ch;
        canvas.width=cw;canvas.height=ch;canvas.style.width=cw+'px';canvas.style.height=ch+'px';
        const rs=getRotatedSize(originalImage);
        adjustScale=Math.max(cw/rs.w,ch/rs.h);
        const drawW=rs.w*adjustScale,drawH=rs.h*adjustScale;
        const maxOffX=Math.max(0,(drawW-cw)/2),maxOffY=Math.max(0,(drawH-ch)/2);
        adjustOffset.x=Math.max(-maxOffX,Math.min(maxOffX,adjustOffset.x));
        adjustOffset.y=Math.max(-maxOffY,Math.min(maxOffY,adjustOffset.y));
        ctx.clearRect(0,0,cw,ch);
        ctx.save();
        ctx.translate(cw/2+adjustOffset.x,ch/2+adjustOffset.y);
        ctx.scale(adjustScale,adjustScale);
        const rad=(rotationAngle*Math.PI)/180;
        ctx.rotate(rad);
        ctx.scale(isMirroredH?-1:1, isMirroredV?-1:1);
        ctx.filter=getFilterString();
        ctx.drawImage(originalImage,-originalImage.width/2,-originalImage.height/2,originalImage.width,originalImage.height);
        ctx.filter='none';
        ctx.restore();
        
        ctx.save();
        stickers.forEach(s=>{
          if(s.isOnCanvas){
            const cx=s.x*canvas.width,cy=s.y*canvas.height,dw=s.img.width*s.scale,dh=s.img.height*s.scale;
            if(s.id===activeStickerId){
              ctx.strokeStyle='#4f46e5';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.strokeRect(cx-dw/2,cy-dh/2,dw,dh);ctx.setLineDash([]);
            }
            ctx.drawImage(s.img,cx-dw/2,cy-dh/2,dw,dh);
          }
        });
        ctx.restore();
        
        canvas.style.display='block';placeholderMsg.style.display='none';
      }

      function requestRender(){if(isAdjustMode)renderAdjust();else render();}
      
      function updateFloatingButtonsPosition(){
        stickerControls.style.display='none';saveStickerBtn.style.display='none';cancelCropBtn.style.display='none';scaleUpBtn.style.display='none';scaleDownBtn.style.display='none';deleteStickerBtn.style.display='none';
        const rect=canvas.getBoundingClientRect();
        if(isEditingExtracted){saveStickerBtn.style.display='flex';cancelCropBtn.style.display='flex';stickerControls.style.display='flex';stickerControls.style.left=`${rect.right+10}px`;stickerControls.style.top=`${rect.top+20}px`;return;}
        if(activeStickerId!==null){
          scaleUpBtn.style.display='flex';scaleDownBtn.style.display='flex';deleteStickerBtn.style.display='flex';stickerControls.style.display='flex';
          const s=stickers.find(st=>st.id===activeStickerId);
          if(s && s.isOnCanvas){
            const cx=s.x*canvas.width,cy=s.y*canvas.height,dw=s.img.width*s.scale,dh=s.img.height*s.scale,sx=rect.width/canvas.width,sy=rect.height/canvas.height;
            stickerControls.style.left=`${rect.left+(cx+dw/2)*sx}px`;stickerControls.style.top=`${rect.top+(cy-dh/2)*sy+window.scrollY}px`;
          }
        }
      }
      
      function getPointerCoords(e){
        const rect = canvas.getBoundingClientRect();
        const cX = e.touches ? e.touches[0].clientX : e.clientX;
        const cY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (cX - rect.left) * (canvas.width / rect.width),
          y: (cY - rect.top) * (canvas.height / rect.height)
        };
      }
      
      function checkHitSticker(pos){
        if(isEditingExtracted)return null;
        for(let i=stickers.length-1;i>=0;i--){
          const s=stickers[i];
          if(!s.isOnCanvas) continue;
          const cx=s.x*canvas.width,cy=s.y*canvas.height,dw=s.img.width*s.scale,dh=s.img.height*s.scale;
          if(pos.x>=cx-dw/2 && pos.x<=cx+dw/2 && pos.y>=cy-dh/2 && pos.y<=cy+dh/2) {
            return {sticker:s, index:i, offset:{x:pos.x-cx, y:pos.y-cy}};
          }
        }
        return null;
      }

      function onPointerDown(e){
        if(!currentImageLoaded)return;
        if(isAdjustMode){
          e.preventDefault();isAdjustDragging=true;
          const cX=e.touches?e.touches[0].clientX:e.clientX,cY=e.touches?e.touches[0].clientY:e.clientY;
          adjustDragStart={x:cX,y:cY,mx:adjustOffset.x,my:adjustOffset.y};
          canvasWrapper.classList.add('mode-adjust');return;
        }
        
        const pos = getPointerCoords(e);
        
        if(isCropMode){
          e.preventDefault();
          cropStartPos={x:pos.x/canvas.width, y:pos.y/canvas.height};
          cropRect={x:cropStartPos.x, y:cropStartPos.y, w:0, h:0};
          requestRender();return;
        }
        
        const hit=checkHitSticker(pos);
        if(hit){
          e.preventDefault();
          activeStickerId=hit.sticker.id;
          isDragging=true;
          dragOffset=hit.offset;
          stickers.splice(hit.index,1);
          stickers.push(hit.sticker);
          canvasWrapper.classList.add('mode-sticker');
          requestRender();
          return;
        }
        activeStickerId=null;requestRender();
      }
      
      function onPointerMove(e){
        if(!currentImageLoaded)return;
        if(isAdjustMode&&isAdjustDragging){
          e.preventDefault();
          const cX=e.touches?e.touches[0].clientX:e.clientX,cY=e.touches?e.touches[0].clientY:e.clientY;
          const rect=canvas.getBoundingClientRect();
          const scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;
          adjustOffset.x=adjustDragStart.mx+(cX-adjustDragStart.x)*scaleX;
          adjustOffset.y=adjustDragStart.my+(cY-adjustDragStart.y)*scaleY;
          renderAdjust();return;
        }
        
        if(isCropMode&&cropStartPos){
          e.preventDefault();
          const pos = getPointerCoords(e);
          const curX = Math.max(0, Math.min(1, pos.x/canvas.width));
          const curY = Math.max(0, Math.min(1, pos.y/canvas.height));
          cropRect.x=Math.min(cropStartPos.x, curX);
          cropRect.y=Math.min(cropStartPos.y, curY);
          cropRect.w=Math.abs(curX-cropStartPos.x);
          cropRect.h=Math.abs(curY-cropStartPos.y);
          requestRender();return;
        }
        
        if(isDragging&&activeStickerId!==null){
          e.preventDefault();
          const pos = getPointerCoords(e);
          const s=stickers.find(st=>st.id===activeStickerId);
          if(s && s.isOnCanvas){
            s.x=(pos.x-dragOffset.x)/canvas.width;
            s.y=(pos.y-dragOffset.y)/canvas.height;
            requestRender();
          }
        }
      }
      
      function onPointerUp(){
        if(!currentImageLoaded)return;
        if(isAdjustMode&&isAdjustDragging){isAdjustDragging=false;return;}
        if(isCropMode&&cropStartPos){cropStartPos=null;if(cropRect&&cropRect.w>0.02&&cropRect.h>0.02){executeCropStep();}else{cropRect=null;requestRender();}return;}
        if(isDragging){isDragging=false;canvasWrapper.classList.remove('mode-sticker');requestRender();}
      }
      
      canvas.addEventListener('mousedown',onPointerDown);
      window.addEventListener('mousemove',onPointerMove);
      window.addEventListener('mouseup',onPointerUp);
      canvas.addEventListener('touchstart',onPointerDown,{passive:false});
      window.addEventListener('touchmove',onPointerMove,{passive:false});
      window.addEventListener('touchend',onPointerUp);

      function executeCropStep(){
        const cx=cropRect.x*canvas.width,cy=cropRect.y*canvas.height,cw=cropRect.w*canvas.width,ch=cropRect.h*canvas.height;
        const tempC=document.createElement('canvas');tempC.width=cw;tempC.height=ch;tempC.getContext('2d').drawImage(canvas,cx,cy,cw,ch,0,0,cw,ch);
        const img=new Image();img.onload=()=>{originalImage=img;currentCrop='free';isCropMode=false;cropRect=null;startCropBtn.textContent='框选区域';startCropBtn.style.background='#f8fafc';startCropBtn.style.color='#1e293b';extractBgBtn.disabled=false;canvasWrapper.classList.remove('mode-crop');requestRender();};img.src=tempC.toDataURL('image/png');
      }

      function enterAdjustMode(ratio){
        if(!currentImageLoaded)return;
        isAdjustMode=true;adjustRatio=ratio;adjustOffset={x:0,y:0};isCropMode=false;cropRect=null;
        canvasWrapper.classList.remove('mode-crop');startCropBtn.textContent='框选区域';startCropBtn.style.background='#f8fafc';startCropBtn.style.color='#1e293b';
        adjustBar.classList.add('show');
        renderAdjust();
      }
      
      function exitAdjustMode(){
        isAdjustMode=false;adjustRatio=null;adjustOffset={x:0,y:0};isAdjustDragging=false;
        adjustBar.classList.remove('show');canvasWrapper.classList.remove('mode-adjust');
        canvas.style.width='';canvas.style.height='';
      }

      function applyAdjustCrop(){
        if(!isAdjustMode||!currentImageLoaded)return;
        const tempC=document.createElement('canvas');tempC.width=canvas.width;tempC.height=canvas.height;
        tempC.getContext('2d').drawImage(canvas,0,0);
        const img=new Image();
        img.onload=()=>{
          originalImage=img;
          currentImageLoaded=true;
          currentFileSizeBytes=getDataURLSize(img.src);
          rotationAngle=0;isMirroredH=false;isMirroredV=false;
          resetFilters();
          currentCrop='free';
          document.querySelectorAll('.crop-btn').forEach(b=>b.classList.toggle('active',b.dataset.crop==='free'));
          exitAdjustMode();
          activeStickerId=null;
          requestRender();
        };
        img.src=tempC.toDataURL('image/png');
      }

      adjustApplyBtn.addEventListener('click',applyAdjustCrop);
      adjustCancelBtn.addEventListener('click',()=>{exitAdjustMode();requestRender();});

      // 去色差抠图（边缘采样法）
      extractBgBtn.addEventListener('click',()=>{
        if(!currentImageLoaded)return;
        const w=originalImage.width,h=originalImage.height;
        const tempC=document.createElement('canvas');tempC.width=w;tempC.height=h;
        const tCtx=tempC.getContext('2d',{willReadFrequently:true});tCtx.drawImage(originalImage,0,0);
        const imgData=tCtx.getImageData(0,0,w,h),data=imgData.data;
        
        let bgR=0,bgG=0,bgB=0,edgePixels=0;
        const step=Math.max(1, Math.floor(Math.min(w,h)/100));
        for(let x=0;x<w;x+=step){
          let i1=(0*w+x)*4, i2=((h-1)*w+x)*4;
          bgR+=data[i1]+data[i2]; bgG+=data[i1+1]+data[i2+1]; bgB+=data[i1+2]+data[i2+2]; edgePixels+=2;
        }
        for(let y=0;y<h;y+=step){
          let i1=(y*w+0)*4, i2=(y*w+(w-1))*4;
          bgR+=data[i1]+data[i2]; bgG+=data[i1+1]+data[i2+1]; bgB+=data[i1+2]+data[i2+2]; edgePixels+=2;
        }
        bgR=Math.round(bgR/edgePixels); bgG=Math.round(bgG/edgePixels); bgB=Math.round(bgB/edgePixels);

        const threshold=65, softEdge=45;
        
        for(let i=0;i<data.length;i+=4){
          const r=data[i],g=data[i+1],b=data[i+2];
          const diff=Math.sqrt(Math.pow(r-bgR,2)+Math.pow(g-bgG,2)+Math.pow(b-bgB,2));
          if(diff < threshold) data[i+3] = 0;
          else if(diff < threshold + softEdge) data[i+3] = Math.floor(255 * ((diff - threshold) / softEdge));
        }
        
        for(let x=0;x<w;x++){ data[x*4+3]=0; data[((h-1)*w+x)*4+3]=0; }
        for(let y=0;y<h;y++){ data[(y*w)*4+3]=0; data[(y*w+w-1)*4+3]=0; }
        
        tCtx.putImageData(imgData,0,0);
        const newImg=new Image();newImg.onload=()=>{originalImage=newImg;isEditingExtracted=true;activeStickerId=null;requestRender();};
        newImg.src=tempC.toDataURL('image/png');
      });

      // 存入贴纸
      saveStickerBtn.addEventListener('click',()=>{
        const img=new Image();
        img.onload=()=>{
          const sticker={id:Date.now(),img:img,x:0.5,y:0.5,scale:1,isOnCanvas:true};
          stickers.push(sticker);
          updateStickerListUI();
          
          const restoreC=document.createElement('canvas');restoreC.width=originalImage.width;restoreC.height=originalImage.height;
          restoreC.getContext('2d').drawImage(originalImage,0,0);
          const restoreImg=new Image();
          restoreImg.onload=()=>{
            originalImage=restoreImg;
            isEditingExtracted=false;
            activeStickerId=sticker.id;
            requestRender();
          };
          restoreImg.src=restoreC.toDataURL();
        };
        img.src=canvas.toDataURL('image/png');
      });

      cancelCropBtn.addEventListener('click',()=>{isEditingExtracted=false;render();});
      
      scaleUpBtn.addEventListener('click',(e)=>{e.stopPropagation();if(activeStickerId===null)return;const s=stickers.find(st=>st.id===activeStickerId);if(s){s.scale*=1.15;requestRender();}});
      scaleDownBtn.addEventListener('click',(e)=>{e.stopPropagation();if(activeStickerId===null)return;const s=stickers.find(st=>st.id===activeStickerId);if(s){s.scale*=0.85;s.scale=Math.max(0.1,s.scale);requestRender();}});
      
      // 删除按钮（×）：仅从画布隐藏，素材库保留
      deleteStickerBtn.addEventListener('click',(e)=>{
        e.stopPropagation();
        if(activeStickerId===null)return;
        const s=stickers.find(st=>st.id===activeStickerId);
        if(s){ s.isOnCanvas = false; }
        activeStickerId=null;
        requestRender(); 
      });

      function updateStickerListUI(){
        if(stickers.length===0){stickerList.innerHTML='<span style="font-size:.75rem;color:#94a3b8;line-height:44px;margin:0 auto;">暂无贴纸</span>';return;}
        stickerList.innerHTML='';
        stickers.forEach(s=>{
          const img=document.createElement('img');
          img.src=s.img.src;
          img.className='sticker-item';
          img.addEventListener('click',()=>{
            s.x=0.5; s.y=0.5; s.isOnCanvas=true; 
            activeStickerId=s.id;
            const idx=stickers.indexOf(s);
            if(idx>-1){stickers.splice(idx,1);stickers.push(s);}
            requestRender();
          });
          stickerList.appendChild(img);
        });
        updateButtonsState(); // 贴纸库变化后更新按钮状态
      }

      startCropBtn.addEventListener('click',()=>{
        if(!currentImageLoaded)return alert('请先上传图片');
        if(isAdjustMode){exitAdjustMode();}
        isCropMode=!isCropMode;
        if(isCropMode){
          startCropBtn.textContent='取消框选';
          startCropBtn.style.background='#fee2e2';
          startCropBtn.style.color='#b91c1c';
          canvasWrapper.classList.add('mode-crop');
          activeStickerId=null;
        }else{
          startCropBtn.textContent='框选区域';
          startCropBtn.style.background='#f8fafc';
          startCropBtn.style.color='#1e293b';
          canvasWrapper.classList.remove('mode-crop');
        }
        cropRect=null;
        requestRender();
        updateButtonsState(); // 更新抠除背景按钮状态
      });

      clearStickersBtn.addEventListener('click',()=>{
        stickers=[]; activeStickerId=null; updateStickerListUI(); requestRender();
        updateButtonsState();
      });
      
      function resetFilters(){sliders.brightness.value=100;sliders.contrast.value=100;sliders.saturate.value=100;updateSliderLabels();}
      function resetTransform(){rotationAngle=0;isMirroredH=false;isMirroredV=false;currentCrop='free';document.querySelectorAll('.crop-btn').forEach(b=>b.classList.toggle('active',b.dataset.crop==='free'));}
      
      // 重置按钮：恢复原图，清空画布上的贴纸，但不清空右侧素材库
      resetBtn.addEventListener('click',()=>{
        if(!originalBackup)return;
        exitAdjustMode();
        resetFilters(); resetTransform();
        originalImage=originalBackup;
        stickers.forEach(s => s.isOnCanvas = false); 
        activeStickerId=null;
        
        // 修复：重置时同步更新字节状态文字
        currentFileSizeBytes = originalBackup.src ? getDataURLSize(originalBackup.src) : 0;
        requestRender();
        sizeStatusText.textContent = '等待操作...';
      });

      // 修复：清空画布时同步清空字节状态文字
      clearBtn.addEventListener('click',()=>{
        originalImage=null;currentImageLoaded=false;canvas.style.display='none';placeholderMsg.style.display='flex';fileNameDisplay.textContent='未选择文件';
        isCropMode=false;isEditingExtracted=false;
        exitAdjustMode();
        startCropBtn.textContent='框选区域';startCropBtn.style.background='#f8fafc';startCropBtn.style.color='#1e293b';
        canvasWrapper.classList.remove('mode-crop','mode-sticker');
        resetFilters();resetTransform();fileInput.value='';
        stickerControls.style.display='none';lastCanvasDataURLSize=0;
        currentFileSizeBytes=0;
        
        sizeStatusText.textContent = '等待操作...'; // 修复状态重置
        
        updateSizePanelInfo();
        updateButtonsState();
      });

      function handleFile(file){
        if(!file||!file.type.startsWith('image/'))return alert('请选择有效的图片文件');
        fileNameDisplay.textContent=file.name.length>32?file.name.slice(0,30)+'…':file.name;
        currentFileSizeBytes=file.size;
        const reader=new FileReader();
        reader.onload=(e)=>{
          const img=new Image();
          img.onload=()=>{
            originalImage=img; originalBackup=img;
            currentImageLoaded=true;activeStickerId=null;isCropMode=false;isEditingExtracted=false;
            exitAdjustMode();
            startCropBtn.textContent='框选区域';startCropBtn.style.background='#f8fafc';startCropBtn.style.color='#1e293b';
            canvasWrapper.classList.remove('mode-crop','mode-sticker');resetFilters();resetTransform();
            
            sizeStatusText.textContent = '等待操作...'; // 修复：重新上传时重置状态
            
            requestRender();
            updateButtonsState(); 
          };
          img.src=e.target.result;
        };
        reader.readAsDataURL(file);
      }

      canvasWrapper.addEventListener('click',(e)=>{
        if(!currentImageLoaded && !isCropMode && !isAdjustMode) {
           if(e.target.closest('#stickerControls') || e.target.closest('.btn')) return;
           fileInput.click();
        }
      });
      fileInput.addEventListener('change',(e)=>{if(e.target.files.length>0)handleFile(e.target.files[0]);});
      canvasWrapper.addEventListener('dragover',(e)=>{e.preventDefault();});
      canvasWrapper.addEventListener('drop',(e)=>{e.preventDefault();if(e.dataTransfer.files.length>0)handleFile(e.dataTransfer.files[0]);});

      Object.values(sliders).forEach(s=>s.addEventListener('input',()=>{updateSliderLabels();requestRender();}));
      standaloneBtn.addEventListener('click',()=>window.open(window.location.href,'_blank','width=1400,height=900'));

      copyBtn.addEventListener('click',async()=>{
        if(!currentImageLoaded)return;
        try{canvas.toBlob(async(blob)=>{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);copyBtn.textContent='✅ 已复制';setTimeout(()=>copyBtn.textContent='复制',1500);},'image/png');}catch(e){alert('当前浏览器不支持直接复制图片。');}
      });
      
      // 下载改为 JPEG 格式，减小体积
      downloadBtn.addEventListener('click',()=>{
        if(!currentImageLoaded)return;
        const link=document.createElement('a');link.download=`processed_${Date.now()}.jpg`;link.href=canvas.toDataURL('image/jpeg', 0.9);link.click();
      });

      const presets={
        original:{brightness:100,contrast:100,saturate:100},
        vintage:{brightness:90,contrast:110,saturate:70},
        bright:{brightness:130,contrast:105,saturate:110},
        mono:{brightness:100,contrast:100,saturate:0},
        cool:{brightness:105,contrast:100,saturate:110}
      };
      document.querySelectorAll('.preset-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const p=presets[btn.dataset.preset];
          if(p){sliders.brightness.value=p.brightness;sliders.contrast.value=p.contrast;sliders.saturate.value=p.saturate;updateSliderLabels();requestRender();}
        });
      });

      document.querySelectorAll('.crop-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
          if(!currentImageLoaded)return alert('请先上传图片');
          document.querySelectorAll('.crop-btn').forEach(b=>b.classList.toggle('active',b===btn));
          currentCrop=btn.dataset.crop;
          
          if(currentCrop === 'free') {
            exitAdjustMode();
            isCropMode = true;
            startCropBtn.textContent='取消框选';
            startCropBtn.style.background='#fee2e2';
            startCropBtn.style.color='#b91c1c';
            canvasWrapper.classList.add('mode-crop');
            activeStickerId = null;
            cropRect = null;
            requestRender();
          } else {
            enterAdjustMode(btn.dataset.crop);
          }
          updateButtonsState();
        });
      });

      document.querySelectorAll('.dir-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const dir=btn.dataset.dir;
          if(dir==='left')rotationAngle=(rotationAngle+270)%360;
          else if(dir==='right')rotationAngle=(rotationAngle+90)%360;
          else if(dir==='mirror-h')isMirroredH=!isMirroredH;
          else if(dir==='mirror-v')isMirroredV=!isMirroredV;
          requestRender();
        });
      });

      document.querySelectorAll('.section-header').forEach(header=>{
        header.addEventListener('click',()=>{
          const card=header.closest('.section-card');const isCollapsed=card.classList.contains('collapsed');
          document.querySelectorAll('.section-card').forEach(c=>c.classList.add('collapsed'));
          if(isCollapsed)card.classList.remove('collapsed');
        });
      });

      function adjustImageSize(isIncrease){
        if(!currentImageLoaded||canvas.width===0)return;
        let dataURL;
        try{
          if(isIncrease){
            const scale=1.15,newW=Math.max(1,Math.round(canvas.width*scale)),newH=Math.max(1,Math.round(canvas.height*scale));
            const tempCanvas=document.createElement('canvas');tempCanvas.width=newW;tempCanvas.height=newH;
            tempCanvas.getContext('2d').drawImage(canvas,0,0,newW,newH);dataURL=tempCanvas.toDataURL('image/jpeg',1.0);
          }else{
            let quality=0.7;dataURL=canvas.toDataURL('image/jpeg',quality);
            if(getDataURLSize(dataURL)>MIN_SIZE_BYTES*2){quality=0.5;dataURL=canvas.toDataURL('image/jpeg',quality);}
            if(getDataURLSize(dataURL)>MIN_SIZE_BYTES*1.5){quality=0.35;dataURL=canvas.toDataURL('image/jpeg',quality);}
          }
        }catch(e){return;}
        const oldSize=lastCanvasDataURLSize,newSize=getDataURLSize(dataURL),diffStr=formatFileSize(Math.abs(newSize-oldSize));
        const img=new Image();
        img.onload=()=>{
          exitAdjustMode();resetFilters();resetTransform();originalImage=img;currentImageLoaded=true;currentFileSizeBytes=newSize;
          activeStickerId=null;requestRender();
          setTimeout(()=>{refreshCanvasSizeMetric();sizeStatusText.textContent=isIncrease?`✅ 已增加，当前 ${formatFileSize(newSize)} (+${diffStr})`:`✅ 已减小，当前 ${formatFileSize(newSize)} (-${diffStr})`;},50);
        };
        img.src=dataURL;
      }

      decreaseSizeBtn.addEventListener('click',()=>{
        if(lastCanvasDataURLSize>MAX_SIZE_BYTES){
          let quality=1.0,tempDataURL=canvas.toDataURL('image/jpeg',quality);
          while(getDataURLSize(tempDataURL)>MAX_SIZE_BYTES&&quality>0.1){quality-=0.1;tempDataURL=canvas.toDataURL('image/jpeg',quality);}
          const newSize=getDataURLSize(tempDataURL),oldSize=lastCanvasDataURLSize;
          const img=new Image();
          img.onload=()=>{exitAdjustMode();resetFilters();resetTransform();originalImage=img;currentFileSizeBytes=newSize;activeStickerId=null;requestRender();setTimeout(()=>{refreshCanvasSizeMetric();sizeStatusText.textContent=`✅ 已减小，当前 ${formatFileSize(newSize)} (-${formatFileSize(oldSize-newSize)})`;},50);};
          img.src=tempDataURL;
        }else{adjustImageSize(false);}
      });

      increaseSizeBtn.addEventListener('click',()=>{
        if(lastCanvasDataURLSize<MIN_SIZE_BYTES){
          const target=MIN_SIZE_BYTES;let scale=1.5,tempCanvas=document.createElement('canvas'),tempDataURL='',size=0;
          for(let i=0;i<5;i++){
            tempCanvas.width=Math.round(canvas.width*scale);tempCanvas.height=Math.round(canvas.height*scale);
            tempCanvas.getContext('2d').drawImage(canvas,0,0,tempCanvas.width,tempCanvas.height);
            tempDataURL=tempCanvas.toDataURL('image/jpeg',1.0);size=getDataURLSize(tempDataURL);
            if(size>=target)break;scale*=1.3;
          }
          const oldSize=lastCanvasDataURLSize;
          const img=new Image();
          img.onload=()=>{exitAdjustMode();resetFilters();resetTransform();originalImage=img;currentFileSizeBytes=size;activeStickerId=null;requestRender();setTimeout(()=>{refreshCanvasSizeMetric();sizeStatusText.textContent=`✅ 已增加，当前 ${formatFileSize(size)} (+${formatFileSize(size-oldSize)})`;},50);};
          img.src=tempDataURL;
        }else{adjustImageSize(true);}
      });

      window.addEventListener('resize',()=>{if(isAdjustMode)renderAdjust();else updateFloatingButtonsPosition();});
      window.addEventListener('scroll',updateFloatingButtonsPosition,true);
      
      updateSliderLabels();
      updateStickerListUI();
      updateSizePanelInfo();
      updateButtonsState(); 
    })();

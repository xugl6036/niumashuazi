<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主机厂安装规范查询工具</title>
    <!-- 引入 SheetJS 库用于解析 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f6f9;
            --card-bg: #ffffff;
            --primary-color: #3b82f6;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .main-container {
            display: flex;
            flex: 1;
            gap: 20px;
            overflow: hidden;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* 左侧区域 */
        .left-panel {
            flex: 6;
        }

        /* 头部工具栏：包含搜索框和标签 */
        .left-header {
            display: flex;
            align-items: center;
            padding: 10px 20px 0;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
            gap: 20px;
        }

        /* 搜索框样式 */
        .search-box {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 12px;
            width: 250px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .search-box:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }
        .search-box svg {
            color: var(--text-secondary);
            margin-right: 8px;
            width: 16px;
            height: 16px;
        }
        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: var(--text-main);
            background: transparent;
        }

        /* 导航标签 */
        .nav-tabs {
            display: flex;
            flex: 1;
            margin-bottom: -1px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            user-select: none;
            white-space: nowrap;
        }
        .nav-item.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            font-weight: 500;
        }

        /* 左侧内容区 */
        .left-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
            background-color: #fff;
            overflow-y: auto;
        }

        /* 矩阵式结果展示 */
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .result-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
        }
        .result-card:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        /* 加载提示 */
        .loading-tip {
            color: var(--text-secondary);
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
        }

        /* 右侧区域 */
        .right-panel {
            flex: 4;
        }
        .right-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
        }
        .right-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }
        .right-title svg {
            color: var(--primary-color);
        }

        .open-window-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .open-window-btn:hover {
            background-color: #e5e7eb;
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #fafbfc;
        }

        .icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- 左侧功能区 -->
        <div class="card left-panel">
            <!-- 头部：搜索 + 标签 -->
            <div class="left-header">
                <!-- 全局模糊搜索框 -->
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="全局模糊搜索..." autocomplete="off">
                </div>

                <!-- 标签栏 -->
                <div class="nav-tabs" id="navTabs">
                    <div class="nav-item active" data-type="all">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                        全部
                    </div>
                    <div class="nav-item" data-type="主机厂">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M14 4l2.29 2.29-2.88 2.88 1.42 1.42 2.88-2.88L20 10V4zm-4 0H4v6l2.29-2.29 4.71 4.7V20h2v-8.41l-5.29-5.3z"/></svg>
                        主机厂
                    </div>
                    <div class="nav-item" data-type="平台">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
                        平台
                    </div>
                    <div class="nav-item" data-type="线缆品牌">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/></svg>
                        线缆品牌
                    </div>
                </div>
            </div>

            <!-- 左侧内容区 (数据渲染区) -->
            <div class="left-content">
                <div class="loading-tip" id="loadingTip">正在加载数据...</div>
                <div class="result-grid" id="resultGrid" style="display: none;"></div>
            </div>
        </div>

        <!-- 右侧预览区 -->
        <div class="card right-panel">
            <div class="right-header">
                <div class="right-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    主机厂安装规范
                </div>
                <button class="open-window-btn" title="在新窗口打开" onclick="openInNewWindow()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    </svg>
                </button>
            </div>
            <div class="preview-area"></div>
        </div>

    </div>

    <script>
        // --- 全局变量 ---
        let allData = []; 
        let currentNavType = 'all'; 
        let currentSearchKeyword = ''; 

        // --- DOM 元素 ---
        const loadingTip = document.getElementById('loadingTip');
        const resultGrid = document.getElementById('resultGrid');
        const searchInput = document.getElementById('searchInput');
        const navItems = document.querySelectorAll('.nav-item');

        // --- 核心逻辑：解析 Excel ---
        async function loadExcelData() {
            // 判断当前环境路径：
            // 如果是本地双击打开 (file://)，由于 fetch 不支持直接读本地文件，我们会尝试通过 XMLHttpRequest 兜底，或者提示。
            // 最佳实践是通过 VS Code 的 Live Server 插件打开。
            
            let filePath = '../data/oem-sop.xlsx'; // 默认按照您的目录结构
            
            // 如果您的 html 放在 pages 文件夹里，而本地直接双击打开，相对路径是这样的
            // 建议：如果直接双击，请将 html 放在根目录，或者用 Live Server
            
            try {
                loadingTip.textContent = '正在加载数据，请稍候...';
                const response = await fetch(filePath);
                if (!response.ok) throw new Error('文件获取失败');
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                parseTableData(jsonData);
                
                loadingTip.style.display = 'none';
                resultGrid.style.display = 'grid';
                renderResults(); 

            } catch (error) {
                console.error('读取 Excel 失败:', error);
                loadingTip.innerHTML = `<span style="color:#ef4444">数据加载失败。</span><br><br>
                由于浏览器安全限制，直接双击 HTML 文件通常无法读取本地 Excel。<br>
                请使用 <b>VS Code 的 Live Server 插件</b> 运行，<br>
                或者将项目部署到 GitHub Pages。`;
            }
        }

        // --- 核心逻辑：提取数据 ---
        function parseTableData(rows) {
            // 根据 Excel 结构，第 3 行是平台，第 4 行是主机厂 (索引从 0 开始，即 2 和 3)
            const platformRow = rows[2]; 
            const oemRow = rows[3];

            const maxCols = Math.max(platformRow.length, oemRow.length);

            // 从第 1 列 (B列) 开始遍历，提取每列的数据
            for (let col = 1; col < maxCols; col++) {
                const platform = platformRow[col] ? platformRow[col].toString().trim() : '';
                const oem = oemRow[col] ? oemRow[col].toString().trim() : '';

                if (oem || platform) {
                    let rowData = {
                        type: '主机厂', 
                        platform: platform,
                        oemName: oem || '未命名',
                        displayName: oem || platform,
                        fullText: '' // 存储整列内容用于全局模糊搜索
                    };

                    let textPieces = [];
                    // 收集该列所有行的数据（包括属性名和值）
                    for (let r = 0; r < rows.length; r++) {
                        if (rows[r] && rows[r][col]) {
                            textPieces.push(rows[r][col].toString().trim());
                        }
                    }
                    rowData.fullText = textPieces.join(' ').toLowerCase();

                    allData.push(rowData);
                }
            }
        }

        // --- 核心逻辑：过滤与渲染 ---
        function renderResults() {
            const filteredData = allData.filter(item => {
                // 1. 标签过滤
                let matchTab = true;
                if (currentNavType !== 'all') {
                    // 这里仅做基础演示，当前数据的 type 都是主机厂
                    matchTab = item.type === currentNavType;
                }

                // 2. 搜索过滤（全局模糊匹配）
                let matchSearch = true;
                if (currentSearchKeyword) {
                    matchSearch = item.fullText.includes(currentSearchKeyword);
                }

                return matchTab && matchSearch;
            });

            resultGrid.innerHTML = '';
            
            if (filteredData.length === 0) {
                resultGrid.innerHTML = '<div class="loading-tip">未找到匹配的主机厂</div>';
                return;
            }

            // 去重展示
            const uniqueNames = new Set();
            
            filteredData.forEach(item => {
                if (!uniqueNames.has(item.displayName)) {
                    uniqueNames.add(item.displayName);
                    
                    const card = document.createElement('div');
                    card.className = 'result-card';
                    card.textContent = item.displayName;
                    card.onclick = () => {
                        // 点击卡片，未来可以在这里渲染右侧的详细信息
                        console.log(`点击了 ${item.displayName}，该列详细数据：`, item.fullText);
                    };
                    resultGrid.appendChild(card);
                }
            });
        }

        // --- 事件监听 ---
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentSearchKeyword = e.target.value.trim().toLowerCase();
                renderResults();
            }, 300);
        });

        navItems.forEach(item => {
            item.addEventListener('click', function() {
                navItems.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
                currentNavType = this.getAttribute('data-type');
                renderResults();
            });
        });

        function openInNewWindow() {
            window.open(window.location.href, '_blank', 'width=1000,height=800,menubar=no,toolbar=no');
        }

        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', () => {
            // 稍微延迟加载，确保 UI 已经渲染
            setTimeout(loadExcelData, 100);
        });

    </script>
</body>
</html>

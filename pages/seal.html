<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>电子印章生成器</title>
<style>
    :root {
        --primary: #e60000;
        --primary-light: #ff4d4f;
        --primary-soft: rgba(230, 0, 0, 0.06);
        --text-main: #1a1a1a;
        --text-sub: #8c8c8c;
        --text-label: #595959;
        --border: #e8e8e8;
        --border-soft: #f0f0f0;
        --bg-body: #eef1f5;
        --bg-panel: #ffffff;
        --bg-input: #f7f8fa;
        --radius-sm: 6px;
        --radius: 10px;
        --radius-lg: 14px;
        --shadow-lg: 0 8px 28px rgba(0,0,0,0.08);
        --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg-body);
        background-image:
            radial-gradient(circle at 20% 0%, rgba(230,0,0,0.03) 0%, transparent 50%),
            radial-gradient(circle at 80% 100%, rgba(24,144,255,0.03) 0%, transparent 50%);
        color: var(--text-main);
        font-size: 13px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        padding: 14px 22px 18px;
    }

    /* ===== 主内容区 ===== */
    #mainContent {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
    }
    
    body.is-locked #mainContent {
        pointer-events: none;
        user-select: none;
    }

    .disclaimer {
        text-align: center;
        color: #8c8c8c;
        font-size: 12px;
        margin-bottom: 12px;
        flex-shrink: 0;
        padding: 8px 16px;
        background: rgba(255,255,255,0.6);
        border-radius: 100px;
        backdrop-filter: blur(8px);
        align-self: center;
        border: 1px solid rgba(0,0,0,0.03);
    }
    .disclaimer strong { color: var(--primary); font-weight: 600; }

    .app-container {
        display: flex;
        flex: 1;
        gap: 20px;
        width: 100%;
        min-height: 0;
        overflow: hidden;
    }

    /* 左侧预览 */
    .preview-panel {
        flex: 0 0 360px;
        background: var(--bg-panel);
        padding: 28px 24px 24px;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        position: relative;
    }
    .preview-label {
        position: absolute;
        top: 18px; left: 24px;
        font-size: 11px;
        font-weight: 600;
        color: #bfbfbf;
        letter-spacing: 2px;
    }
    .seal-container {
        width: 100%;
        aspect-ratio: 1 / 1;
        max-width: 280px;
        max-height: 280px;
        margin-bottom: 26px;
        position: relative;
        z-index: 1;
    }
    .seal-container svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 20px rgba(230, 0, 0, 0.12)); }
    
    .action-btns { display: flex; gap: 10px; width: 100%; max-width: 280px; position: relative; z-index: 1; }
    .action-btns button { flex: 1; padding: 11px 0; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 600; transition: all var(--transition); }
    .btn-primary { background: linear-gradient(135deg, #ff4d4f, #e60000); color: #fff; box-shadow: 0 4px 14px rgba(230, 0, 0, 0.25); }
    .btn-default { background: #fff; border: 1px solid var(--border); color: var(--text-label); }
    .btn-default:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

    /* 右侧配置 */
    .config-panel {
        flex: 1;
        background: var(--bg-panel);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        height: 100%;
    }
    .config-header { padding: 18px 26px 14px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: space-between; }
    .config-header h2 { font-size: 15px; font-weight: 700; }
    .config-header .badge { font-size: 11px; color: var(--text-sub); background: var(--bg-input); padding: 3px 10px; border-radius: 100px; }

    .config-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 16px; padding: 20px 24px; overflow-y: auto; }

    /* 卡片 */
    .group { background: #fff; border: 1px solid var(--border-soft); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
    .group-header { display: flex; align-items: center; gap: 8px; padding: 11px 14px; background: linear-gradient(180deg, #fcfcfd, #f8f9fb); border-bottom: 1px solid var(--border-soft); }
    .group-icon { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--primary-light), var(--primary)); display: flex; align-items: center; justify-content: center; }
    .group-icon svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2; }
    .group-title { font-size: 12.5px; font-weight: 600; flex: 1; }
    
    .group-content { padding: 14px; display: flex; flex-direction: column; gap: 12px; flex: 1; justify-content: center; }
    .field-row { display: grid; align-items: center; gap: 10px; }
    .field-row + .field-row { padding-top: 10px; border-top: 1px dashed var(--border-soft); }
    .field { display: flex; align-items: center; gap: 6px; }
    .field-label { font-size: 11.5px; color: var(--text-label); white-space: nowrap; }

    .input-control { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; height: 32px; outline: none; background: var(--bg-input); }
    .input-control:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
    .color-control { width: 32px; height: 32px; padding: 3px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; }
    
    .toggle { position: relative; display: inline-block; width: 34px; height: 18px; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track { position: absolute; inset: 0; background: #d9d9d9; border-radius: 18px; transition: .2s; }
    .toggle-track::before { content: ""; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
    .toggle input:checked + .toggle-track { background: linear-gradient(135deg, var(--primary-light), var(--primary)); }
    .toggle input:checked + .toggle-track::before { transform: translateX(16px); }
    .group.disabled .group-content { opacity: 0.45; pointer-events: none; }

    /* 栅格 */
    .row-3 { grid-template-columns: repeat(3, 1fr); }
    .row-2 { grid-template-columns: repeat(2, 1fr); }
    .row-base { grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-line { grid-template-columns: repeat(2, 1fr); gap: 10px; }

    /* ===== 锁屏界面（高透光毛玻璃） ===== */
    #lockScreen {
        position: fixed;
        inset: 0;
        /* 极低的不透明度底色，确保能看清背后的工具 */
        background: rgba(255, 255, 255, 0.2);
        /* 适中的模糊度，产生磨砂玻璃质感 */
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #lockScreen.hidden { opacity: 0; visibility: hidden; }
    
    .lock-box {
        background: #ffffff;
        padding: 40px 30px;
        border-radius: var(--radius-lg);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 320px;
        border: 1px solid rgba(255,255,255,0.8);
    }
    .lock-box h2 { font-size: 18px; margin-bottom: 8px; }
    .lock-box p { font-size: 12px; color: var(--text-sub); margin-bottom: 24px; }
    .lock-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; outline: none; background: var(--bg-input); margin-bottom: 20px; text-align: center; letter-spacing: 2px; }
    .lock-input:focus { border-color: var(--primary); background: #fff; }
    .lock-btn { width: 100%; padding: 12px; border: none; border-radius: var(--radius); background: linear-gradient(135deg, #ff4d4f, #e60000); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(230, 0, 0, 0.25); }
    .lock-error { color: var(--primary); font-size: 12px; margin-top: 12px; opacity: 0; height: 16px; }
    .lock-error.show { opacity: 1; }

    /* 全局弹窗 */
    .toast-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.15); backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transition: .3s; z-index: 9999; }
    .toast-overlay.show { opacity: 1; visibility: visible; }
    .toast-content { background: rgba(255, 255, 255, 0.9); padding: 16px 36px; border-radius: var(--radius-lg); font-size: 14px; font-weight: 600; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); }
</style>
</head>
<body class="is-locked">

<!-- 主内容区 -->
<div id="mainContent">
    <div class="disclaimer"><strong>郑重声明：</strong>本工具生成的印章仅供个人学习娱乐使用，请勿用于非法用途，否则后果自负！</div>
    <div class="app-container">
        <div class="preview-panel">
            <span class="preview-label">PREVIEW</span>
            <div class="seal-container">
                <svg id="sealSvg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                    <circle id="svgOuterCircle" cx="150" cy="150" r="140" fill="none" stroke="#e60000" stroke-width="6"/>
                    <circle id="svgInnerCircle" cx="150" cy="150" r="130" fill="none" stroke="#e60000" stroke-width="1"/>
                    <path id="svgStar" fill="#e60000" d=""/>
                    <g id="svgMainTextGroup"></g>
                    <text id="svgSubText" x="150" y="235" text-anchor="middle" fill="#e60000" font-size="18" font-weight="bold"></text>
                    <text id="svgCodeText" x="150" y="260" text-anchor="middle" fill="#e60000" font-size="12" font-family="monospace"></text>
                </svg>
            </div>
            <div class="action-btns">
                <button class="btn-primary" onclick="downloadImage()">下载印章</button>
                <button class="btn-default" onclick="showToast()">存为模板</button>
            </div>
        </div>

        <div class="config-panel">
            <div class="config-header"><h2>印章配置</h2><span class="badge">实时预览</span></div>
            <div class="config-grid">
                <!-- 基础配置 -->
                <div class="group">
                    <div class="group-header"><div class="group-icon"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg></div><span class="group-title">基础配置</span></div>
                    <div class="group-content">
                        <div class="field-row row-base">
                            <div class="field"><span class="field-label">颜色</span><input type="color" id="colorPicker" value="#e60000" class="color-control"></div>
                            <div class="field"><span class="field-label">字体</span><select id="fontFamily" class="input-control"><option value="SimSun, serif">宋体</option><option value="SimHei, sans-serif">黑体</option><option value="Microsoft YaHei, sans-serif">微软雅黑</option></select></div>
                        </div>
                        <div class="field-row row-base">
                            <div class="field"><span class="field-label">尺寸</span><input type="text" value="300×300" disabled class="input-control"></div>
                            <div class="field" style="justify-content: flex-end;"><span class="field-label">老化</span><label class="toggle"><input type="checkbox" id="agingToggle"><span class="toggle-track"></span></label></div>
                        </div>
                    </div>
                </div>
                <!-- 主文字 -->
                <div class="group" id="groupMain">
                    <div class="group-header"><div class="group-icon"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg></div><span class="group-title">主文字</span><label class="toggle" style="margin-left:auto;"><input type="checkbox" id="mainTextToggle" checked><span class="toggle-track"></span></label></div>
                    <div class="group-content">
                        <div class="field-row"><input type="text" id="mainTextInput" value="中国人会飞科技有限公司" class="input-control"></div>
                        <div class="field-row row-3">
                            <div class="field"><span class="field-label">字号</span><input type="number" id="mainFontSize" value="28" class="input-control"></div>
                            <div class="field"><span class="field-label">半径</span><input type="number" id="mainRadius" value="110" class="input-control"></div>
                            <div class="field"><span class="field-label">起始角</span><input type="number" id="mainStartAngle" value="20" class="input-control"></div>
                        </div>
                        <div class="field-row row-2">
                            <div class="field"><span class="field-label">粗细</span><select id="mainFontWeight" class="input-control"><option value="normal">常规</option><option value="bold" selected>加粗</option><option value="900">特粗</option></select></div>
                            <div class="field"><span class="field-label">拉伸</span><input type="number" id="mainStretch" value="1" step="0.1" class="input-control"></div>
                        </div>
                    </div>
                </div>
                <!-- 副文字 -->
                <div class="group" id="groupSub">
                    <div class="group-header"><div class="group-icon"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h12M4 17h8"/></svg></div><span class="group-title">副文字</span><label class="toggle" style="margin-left:auto;"><input type="checkbox" id="subTextToggle" checked><span class="toggle-track"></span></label></div>
                    <div class="group-content">
                        <div class="field-row"><input type="text" id="subTextInput" value="牛马刷子" class="input-control"></div>
                        <div class="field-row row-2">
                            <div class="field"><span class="field-label">字号</span><input type="number" id="subFontSize" value="18" class="input-control"></div>
                            <div class="field"><span class="field-label">Y 轴</span><input type="number" id="subY" value="235" class="input-control"></div>
                        </div>
                    </div>
                </div>
                <!-- 序列号 -->
                <div class="group" id="groupCode">
                    <div class="group-header"><div class="group-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h7"/></svg></div><span class="group-title">序列号</span><label class="toggle" style="margin-left:auto;"><input type="checkbox" id="codeToggle" checked><span class="toggle-track"></span></label></div>
                    <div class="group-content">
                        <div class="field-row"><input type="text" id="codeTextInput" value="0123456667890" class="input-control"></div>
                        <div class="field-row row-2">
                            <div class="field"><span class="field-label">字号</span><input type="number" id="codeFontSize" value="12" class="input-control"></div>
                            <div class="field"><span class="field-label">Y 轴</span><input type="number" id="codeY" value="260" class="input-control"></div>
                        </div>
                    </div>
                </div>
                <!-- 边线 -->
                <div class="group">
                    <div class="group-header"><div class="group-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg></div><span class="group-title">边线配置</span></div>
                    <div class="group-content">
                        <div class="field-row row-line">
                            <div class="field"><span class="field-label">外粗</span><input type="number" id="outerBorderWidth" value="6" class="input-control"></div>
                            <div class="field"><span class="field-label">外径</span><input type="number" id="outerBorderRadius" value="140" class="input-control"></div>
                        </div>
                        <div class="field-row row-line">
                            <div class="field"><span class="field-label">内边线</span><label class="toggle"><input type="checkbox" id="innerBorderToggle" checked><span class="toggle-track"></span></label></div>
                            <div class="field" style="gap:6px;">
                                <input type="number" id="innerBorderWidth" value="1" step="0.5" class="input-control" style="width:48%;">
                                <input type="number" id="innerBorderRadius" value="130" class="input-control" style="width:52%;">
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 五角星 -->
                <div class="group">
                    <div class="group-header"><div class="group-icon" style="background: linear-gradient(135deg, #ffc53d, #faad14);"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.3 5.9 20.4l1.4-6.8L2.2 9l6.9-.7L12 2z"/></svg></div><span class="group-title">五角星</span><label class="toggle" style="margin-left:auto;"><input type="checkbox" id="starToggle" checked><span class="toggle-track"></span></label></div>
                    <div class="group-content">
                        <div class="field-row row-2">
                            <div class="field"><span class="field-label">半径</span><input type="number" id="starRadius" value="24" step="1" class="input-control"></div>
                            <div class="field"><span class="field-label">角度</span><input type="number" id="starAngle" value="0" step="1" class="input-control"></div>

</div>

<!-- 锁屏层 -->
<div id="lockScreen">
    <div class="lock-box">
        <h2>安全验证</h2>
        <p>该工具不公开使用</p>
        <input type="password" id="passwordInput" class="lock-input" placeholder="Passkey" autocomplete="off">
        <button class="lock-btn" onclick="checkPassword()">Login</button>
        <div class="lock-error" id="lockError">不要再尝试了</div>
    </div>
</div>

<!-- 全局提示框 -->
<div id="globalToast" class="toast-overlay">
    <div class="toast-content">暂不可用</div>
</div>

<script>
    // ================= 1. 密码验证逻辑 =================
    const CORRECT_PASSWORD = "different1";

    function checkPassword() {
        const input = document.getElementById('passwordInput');
        const error = document.getElementById('lockError');
        const lockScreen = document.getElementById('lockScreen');

        const enteredPwd = input.value.trim();

        if (enteredPwd === CORRECT_PASSWORD) {
            // 成功：解锁底层，隐藏锁屏
            document.body.classList.remove('is-locked');
            lockScreen.classList.add('hidden');
            
            // 初始化渲染
            updateRender();
        } else {
            // 失败：提示并抖动
            error.classList.add('show');
            input.value = '';
            input.focus();
            
            const lockBox = document.querySelector('.lock-box');
            lockBox.style.transform = 'translateX(-10px)';
            setTimeout(() => lockBox.style.transform = 'translateX(10px)', 50);
            setTimeout(() => lockBox.style.transform = 'translateX(-10px)', 100);
            setTimeout(() => lockBox.style.transform = 'translateX(0)', 150);
        }
    }

    // 支持回车键登录
    document.getElementById('passwordInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkPassword();
        }
    });

    // ================= 2. 印章渲染逻辑 =================
    const svg = document.getElementById('sealSvg');
    const svgOuterCircle = document.getElementById('svgOuterCircle');
    const svgInnerCircle = document.getElementById('svgInnerCircle');
    const svgStar = document.getElementById('svgStar');
    const svgMainTextGroup = document.getElementById('svgMainTextGroup');
    const svgSubText = document.getElementById('svgSubText');
    const svgCodeText = document.getElementById('svgCodeText');
    const colorPicker = document.getElementById('colorPicker');
    const fontFamily = document.getElementById('fontFamily');

    const groups = {
        main: { toggle: document.getElementById('mainTextToggle'), group: document.getElementById('groupMain') },
        sub:  { toggle: document.getElementById('subTextToggle'),  group: document.getElementById('groupSub') },
        code: { toggle: document.getElementById('codeToggle'),     group: document.getElementById('groupCode') }
    };

    const starToggle = document.getElementById('starToggle');
    const starRadiusInput = document.getElementById('starRadius');
    const starAngleInput = document.getElementById('starAngle');

    function getStarPath(cx, cy, outerR, innerR, rotationAngleDeg = 0) {
        const points = [];
        const baseAngle = -Math.PI / 2 + (rotationAngleDeg * Math.PI) / 180;
        for (let i = 0; i < 10; i++) {
            const r = (i % 2 === 0) ? outerR : innerR;
            const angle = baseAngle + (Math.PI * 2 / 10) * i;
            points.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
        }
        return `M ${points.join(' L ')} Z`;
    }

    function renderRingText() {
        svgMainTextGroup.innerHTML = '';
        if (!groups.main.toggle.checked) return;

        const text = document.getElementById('mainTextInput').value;
        const fontSize = parseInt(document.getElementById('mainFontSize').value) || 28;
        const radius = parseInt(document.getElementById('mainRadius').value) || 110;
        const startAngle = parseInt(document.getElementById('mainStartAngle').value) || 20;
        const stretch = parseFloat(document.getElementById('mainStretch').value) || 1;
        const fontWeight = document.getElementById('mainFontWeight').value;
        const font = fontFamily.value;

        const chars = text.split('');
        if (chars.length === 0) return;

        const charArc = fontSize * 1.1;
        const totalArc = chars.length * charArc;
        const totalAngle = (totalArc / (2 * Math.PI * radius)) * 360;

        let currentAngle = -90 - (totalAngle / 2) + startAngle;
        const angleStep = totalAngle / chars.length;

        chars.forEach((char) => {
            const rad = (currentAngle * Math.PI) / 180;
            const x = 150 + radius * Math.cos(rad);
            const y = 150 + radius * Math.sin(rad);

            const textEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
            textEl.setAttribute("x", x);
            textEl.setAttribute("y", y);
            textEl.setAttribute("fill", colorPicker.value);
            textEl.setAttribute("font-size", fontSize);
            textEl.setAttribute("font-weight", fontWeight);
            textEl.setAttribute("font-family", font);
            textEl.setAttribute("text-anchor", "middle");
            textEl.setAttribute("dominant-baseline", "central");
            textEl.setAttribute("transform", `rotate(${currentAngle + 90}, ${x}, ${y}) scale(${stretch}, 1)`);
            textEl.textContent = char;
            svgMainTextGroup.appendChild(textEl);
            currentAngle += angleStep;
        });
    }

    function updateRender() {
        const color = colorPicker.value;
        const font = fontFamily.value;

        Object.keys(groups).forEach(key => {
            groups[key].group.classList.toggle('disabled', !groups[key].toggle.checked);
        });

        svgOuterCircle.setAttribute("stroke", color);
        svgOuterCircle.setAttribute("stroke-width", document.getElementById('outerBorderWidth').value);
        svgOuterCircle.setAttribute("r", document.getElementById('outerBorderRadius').value);

        if (document.getElementById('innerBorderToggle').checked) {
            svgInnerCircle.style.display = 'block';
            svgInnerCircle.setAttribute("stroke", color);
            svgInnerCircle.setAttribute("stroke-width", document.getElementById('innerBorderWidth').value);
            svgInnerCircle.setAttribute("r", document.getElementById('innerBorderRadius').value);
        } else {
            svgInnerCircle.style.display = 'none';
        }

        if (starToggle.checked) {
            svgStar.style.display = 'block';
            svgStar.setAttribute("fill", color);
            const sRadius = parseFloat(starRadiusInput.value) || 24;
            const sAngle = parseFloat(starAngleInput.value) || 0;
            const iRadius = sRadius * 0.4;
            svgStar.setAttribute("d", getStarPath(150, 150, sRadius, iRadius, sAngle));
        } else {
            svgStar.style.display = 'none';
        }

        renderRingText();

        if (groups.sub.toggle.checked) {
            svgSubText.style.display = 'block';
            svgSubText.setAttribute("fill", color);
            svgSubText.setAttribute("font-family", font);
            svgSubText.setAttribute("font-size", document.getElementById('subFontSize').value);
            svgSubText.setAttribute("y", document.getElementById('subY').value);
            svgSubText.textContent = document.getElementById('subTextInput').value;
        } else {
            svgSubText.style.display = 'none';
        }

        if (groups.code.toggle.checked) {
            svgCodeText.style.display = 'block';
            svgCodeText.setAttribute("fill", color);
            svgCodeText.setAttribute("font-family", font);
            svgCodeText.setAttribute("font-size", document.getElementById('codeFontSize').value);
            svgCodeText.setAttribute("y", document.getElementById('codeY').value);
            svgCodeText.textContent = document.getElementById('codeTextInput').value;
        } else {
            svgCodeText.style.display = 'none';
        }
    }

    // 绑定所有输入事件
    document.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('input', updateRender);
        el.addEventListener('change', updateRender);
    });

    // 下载功能
    function downloadImage() {
        const svgData = new XMLSerializer().serializeToString(svg);
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const img = new Image();
        canvas.width = 600;
        canvas.height = 600;
        const svgBlob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
            ctx.clearRect(0, 0, 600, 600);
            ctx.drawImage(img, 0, 0, 600, 600);
            URL.revokeObjectURL(url);
            const a = document.createElement("a");
            a.href = canvas.toDataURL("image/png");
            a.download = "电子印章.png";
            a.click();
        };
        img.src = url;
    }

    // 弹窗控制
    let toastTimer = null;
    function showToast() {
        const toast = document.getElementById('globalToast');
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }
</script>
</body>
</html>

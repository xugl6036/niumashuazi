<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 俄罗斯方块 · 多模式</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* 禁止页面滚动 */
        }

        body {
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f2f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, monospace;
            color: #e0e6ff;
            padding: 8px;
        }

        .game-container {
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(4px);
            padding: min(24px, 3vh) min(30px, 3vw);
            border-radius: 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 4px rgba(255, 255, 255, 0.08);
            border: 1px solid #2e3a5a;
            display: flex;
            gap: min(24px, 2.5vw);
            justify-content: center;
            align-items: stretch;
            height: 98vh;
            max-width: 98vw;
        }

        .play-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex-shrink: 1;
            height: 100%;
            justify-content: center;
        }

        .canvas-wrapper {
            position: relative;
            height: 100%; 
            max-height: 100%;
            aspect-ratio: 1 / 2;
            width: auto;
            border-radius: 20px;
            overflow: hidden;
            flex-shrink: 0;
        }

        canvas#board {
            background: #0e121f;
            border-radius: 20px;
            box-shadow: inset 0 0 0 2px #273153, inset 0 0 20px #000000aa, 0 18px 30px -8px black;
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 修改：半透明遮罩层 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 23, 0.65); /* 半透明背景 */
            /* 移除 backdrop-filter: blur(6px); 以保证画面清晰可见 */
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .overlay.active {
            display: flex;
        }

        .overlay-title {
            font-size: clamp(1.5rem, 4.5vh, 2.6rem);
            font-weight: 800;
            color: #a0b5ff;
            text-shadow: 0 0 30px #4d6ef5, 0 0 60px #2a3f9e;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .overlay-subtitle {
            font-size: clamp(0.9rem, 2.5vh, 1.3rem);
            font-weight: 600;
            color: #ff7b7b;
            text-shadow: 0 0 12px #ff4d4d;
            min-height: 1.5em;
        }

        .overlay-title.pulse {
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.7; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1.05); }
        }

        .info-panel {
            background: #12182a;
            border-radius: 28px;
            padding: min(24px, 2.5vh) min(20px, 2vw);
            box-shadow: inset 0 1px 3px #ffffff0c, 0 12px 24px -8px black;
            border: 1px solid #2d3a60;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: min(20px, 2vh);
            height: 100%;
            flex-shrink: 0;
            justify-content: flex-start;
        }

        .mode-selector {
            display: flex;
            gap: min(8px, 0.8vw);
            justify-content: center;
            flex-shrink: 0;
            width: 100%;
            margin-bottom: min(10px, 1vh);
        }

        .mode-btn {
            background: #1e263b;
            border: 1px solid #3d4e7a;
            color: #b9c8ff;
            font-weight: 600;
            font-size: clamp(0.7rem, min(2vh, 2vw), 0.95rem);
            padding: min(6px, 0.6vh) min(14px, 1.2vw);
            border-radius: 60px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.15s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            flex: 1;
            text-align: center;
        }

        .mode-btn:hover {
            background: #2a3552;
            border-color: #6a7fcb;
            color: #ffffff;
            transform: scale(1.02);
        }

        .mode-btn.active {
            background: #4d6ef5;
            border-color: #a0b5ff;
            color: white;
            box-shadow: 0 0 16px #4d6ef5aa;
        }

        .next-piece {
            text-align: center;
            flex-shrink: 0;
        }

        .next-piece h3 {
            margin: 0 0 min(8px, 0.8vh) 0;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: clamp(0.6rem, min(1.5vh, 1.5vw), 0.8rem);
            color: #8a9bda;
        }

        canvas#nextCanvas {
            background: #0b0f18;
            border-radius: 14px;
            display: block;
            width: clamp(70px, min(16vh, 14vw), 130px);
            height: clamp(70px, min(16vh, 14vw), 130px);
            box-shadow: inset 0 0 0 1px #36466b;
        }

        .stats {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: min(10px, 1vh);
            font-weight: 500;
            flex-shrink: 1;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            background: #1a2137;
            padding: min(8px, 0.8vh) min(14px, 1.2vw);
            border-radius: 40px;
            border: 1px solid #303e64;
            font-size: clamp(0.7rem, min(1.8vh, 1.8vw), 1rem);
            white-space: nowrap;
        }

        .stat-label {
            color: #9aabdf;
            font-size: clamp(0.6rem, min(1.5vh, 1.5vw), 0.85rem);
            letter-spacing: 1px;
        }

        .stat-value {
            font-weight: 700;
            color: #dfe8ff;
            text-shadow: 0 0 8px #4d6ef5;
            font-size: clamp(0.8rem, min(2.1vh, 2.1vw), 1.15rem);
        }

        button.action-btn {
            background: #27345a;
            border: 1px solid #6378c0;
            color: white;
            font-weight: 600;
            padding: min(10px, 1.2vh) min(16px, 1.2vw);
            border-radius: 40px;
            font-size: clamp(0.75rem, min(1.9vh, 1.9vw), 1rem);
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 4px 0 #0f1420;
            width: 100%;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            margin-top: auto;
        }

        button.action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0f1420;
        }

        button.action-btn:hover {
            background: #32437a;
            border-color: #95aaff;
        }

        .footer-note {
            font-size: clamp(0.5rem, min(1.2vh, 1.2vw), 0.7rem);
            color: #5e6d9b;
            text-align: center;
            flex-shrink: 0;
        }

        /* 针对矮屏幕的适配 */
        @media (max-height: 650px) {
            .game-container { padding: 12px 20px; border-radius: 24px; gap: 16px; }
            .info-panel { padding: 12px 14px; gap: 10px; border-radius: 20px; }
            .stat-item { padding: 6px 10px; }
            .mode-btn { padding: 4px 10px; }
        }

        /* 横屏窄屏手机 */
        @media (max-width: 650px) and (max-height: 500px) {
            .game-container { padding: 8px 10px; border-radius: 18px; gap: 10px; }
            .info-panel { padding: 10px; gap: 8px; border-radius: 16px; }
            .next-piece h3 { font-size: 0.55rem; }
            canvas#nextCanvas { width: 56px; height: 56px; }
            .stat-item { font-size: 0.65rem; padding: 3px 6px; }
            .stat-label { font-size: 0.55rem; }
            .stat-value { font-size: 0.75rem; }
            button.action-btn { font-size: 0.7rem; padding: 5px 10px; }
            .footer-note { display: none; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 左侧：游戏板 -->
        <div class="play-area">
            <div class="canvas-wrapper">
                <canvas id="board" width="300" height="600"></canvas>
                <!-- 修改：统一遮罩层，用于暂停和结束 -->
                <div class="overlay" id="gameOverlay">
                    <div class="overlay-title" id="overlayTitle">暂停</div>
                    <div class="overlay-subtitle" id="overlaySubtitle"></div>
                </div>
            </div>
        </div>

        <!-- 右侧信息面板 -->
        <div class="info-panel">
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="classic">经典</button>
                <button class="mode-btn" data-mode="timed">限时</button>
                <button class="mode-btn" data-mode="challenge">挑战</button>
            </div>
            
            <div class="next-piece">
                <h3>▶ 下一个</h3>
                <canvas id="nextCanvas" width="120" height="120"></canvas>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">分数</span>
                    <span class="stat-value" id="scoreDisplay">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">等级</span>
                    <span class="stat-value" id="levelDisplay">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">行数</span>
                    <span class="stat-value" id="linesDisplay">0</span>
                </div>
                <div class="stat-item" id="timerItem" style="display: none;">
                    <span class="stat-label">剩余</span>
                    <span class="stat-value" id="timerDisplay">0.0</span>
                </div>
            </div>
            <!-- 移除了独立的 game-over-msg，改用遮罩层显示 -->
            <button class="action-btn" id="actionBtn">
                <span id="btnIcon">▶️</span>
                <span id="btnText">开始</span>
            </button>
            <div class="footer-note">
                ← ↓ → 移动 &nbsp;|&nbsp; ↑ 旋转 &nbsp;|&nbsp; 空格 硬降
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- 俄罗斯方块核心参数 ----------
            const COLS = 10;
            const ROWS = 20;
            const BLOCK_SIZE = 30;

            const canvas = document.getElementById('board');
            const ctx = canvas.getContext('2d');
            const nextCanvas = document.getElementById('nextCanvas');
            const nextCtx = nextCanvas.getContext('2d');

            // UI元素
            const scoreDisplay = document.getElementById('scoreDisplay');
            const levelDisplay = document.getElementById('levelDisplay');
            const linesDisplay = document.getElementById('linesDisplay');
            const timerDisplay = document.getElementById('timerDisplay');
            const timerItem = document.getElementById('timerItem');
            
            // 遮罩层元素
            const gameOverlay = document.getElementById('gameOverlay');
            const overlayTitle = document.getElementById('overlayTitle');
            const overlaySubtitle = document.getElementById('overlaySubtitle');

            const modeBtns = document.querySelectorAll('.mode-btn');
            const actionBtn = document.getElementById('actionBtn');
            const btnIcon = document.getElementById('btnIcon');
            const btnText = document.getElementById('btnText');

            // ---------- 形状定义 ----------
            const SHAPES = [
                { matrix: [[1,1,1,1]], color: '#44e0ff' }, // I
                { matrix: [[1,1],[1,1]], color: '#f9e74a' }, // O
                { matrix: [[0,1,0],[1,1,1]], color: '#c05eff' }, // T
                { matrix: [[0,1,1],[1,1,0]], color: '#52e86b' }, // S
                { matrix: [[1,1,0],[0,1,1]], color: '#ff5e7c' }, // Z
                { matrix: [[1,0,0],[1,1,1]], color: '#ffa84d' }, // L
                { matrix: [[0,0,1],[1,1,1]], color: '#4d7aff' }  // J
            ];

            // ---------- 游戏状态 ----------
            let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            let currentPiece = null;
            let nextPiece = null;
            let score = 0;
            let level = 0;
            let linesCleared = 0;
            let gameActive = false;
            let gamePaused = false;
            let gameOverFlag = false;
            let gameInterval = null;

            // 模式相关
            let currentMode = 'classic';
            let timeLeft = 0;
            let timerInterval = null;
            let challengeInterval = null;

            // 下落定时器
            let dropTimeout = null;
            const BASE_INTERVAL = 800;
            const MIN_INTERVAL = 120;
            const TIMED_MODE_START = 60;

            // 消除动画
            let clearingRows = [];
            let clearAnimationTimer = null;
            let isClearing = false;

            // 记录游戏结束原因
            let gameOverReason = '';

            // ---------- 辅助函数 ----------
            function getDropInterval() {
                return Math.max(MIN_INTERVAL, BASE_INTERVAL - level * 60);
            }

            function getRandomPiece() {
                const idx = Math.floor(Math.random() * SHAPES.length);
                return {
                    matrix: SHAPES[idx].matrix.map(row => [...row]),
                    color: SHAPES[idx].color
                };
            }

            function spawnNewPiece() {
                if (!nextPiece) {
                    nextPiece = getRandomPiece();
                }
                currentPiece = {
                    matrix: nextPiece.matrix.map(row => [...row]),
                    color: nextPiece.color,
                    x: Math.floor((COLS - nextPiece.matrix[0].length) / 2),
                    y: 0
                };
                nextPiece = getRandomPiece();

                if (collision(currentPiece.matrix, currentPiece.x, currentPiece.y)) {
                    gameOver();
                }
                drawAll();
            }

            function collision(matrix, offsetX, offsetY) {
                for (let row = 0; row < matrix.length; row++) {
                    for (let col = 0; col < matrix[0].length; col++) {
                        if (matrix[row][col] !== 0) {
                            const boardX = offsetX + col;
                            const boardY = offsetY + row;
                            if (boardX < 0 || boardX >= COLS || boardY >= ROWS || boardY < 0) return true;
                            if (boardY >= 0 && board[boardY][boardX] !== 0) return true;
                        }
                    }
                }
                return false;
            }

            function lockPiece() {
                if (!currentPiece) return;
                const { matrix, x, y, color } = currentPiece;
                for (let r = 0; r < matrix.length; r++) {
                    for (let c = 0; c < matrix[0].length; c++) {
                        if (matrix[r][c] !== 0) {
                            const boardX = x + c;
                            const boardY = y + r;
                            if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
                                board[boardY][boardX] = color;
                            }
                        }
                    }
                }
                const fullRows = [];
                for (let row = 0; row < ROWS; row++) {
                    if (board[row].every(cell => cell !== 0)) {
                        fullRows.push(row);
                    }
                }
                if (fullRows.length > 0) {
                    isClearing = true;
                    clearingRows = fullRows;
                    if (dropTimeout) clearTimeout(dropTimeout);
                    if (clearAnimationTimer) clearTimeout(clearAnimationTimer);
                    clearAnimationTimer = setTimeout(() => {
                        for (let i = fullRows.length - 1; i >= 0; i--) {
                            const row = fullRows[i];
                            board.splice(row, 1);
                            board.unshift(new Array(COLS).fill(0));
                        }
                        const removed = fullRows.length;
                        const points = [0, 100, 300, 500, 800];
                        const addScore = (points[removed] || 800) * (level + 1);
                        score += addScore;
                        linesCleared += removed;
                        const newLevel = Math.floor(linesCleared / 2);
                        if (newLevel > level) level = newLevel;
                        updateStats();

                        clearingRows = [];
                        isClearing = false;
                        clearAnimationTimer = null;

                        spawnNewPiece();
                        if (gameActive && !gameOverFlag && !gamePaused) {
                            resetDropTimer();
                        }
                        drawAll();
                    }, 300);
                    drawAll();
                } else {
                    spawnNewPiece();
                    if (gameActive && !gameOverFlag && !gamePaused) {
                        resetDropTimer();
                    }
                }
            }

            function updateStats() {
                scoreDisplay.textContent = score;
                levelDisplay.textContent = level;
                linesDisplay.textContent = linesCleared;
            }

            function drawBoard() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let row = 0; row < ROWS; row++) {
                    for (let col = 0; col < COLS; col++) {
                        const color = board[row][col];
                        if (clearingRows.includes(row)) {
                            ctx.fillStyle = '#ffffff';
                            ctx.shadowColor = '#ffffff';
                            ctx.shadowBlur = 20;
                            ctx.fillRect(col * BLOCK_SIZE, row * BLOCK_SIZE, BLOCK_SIZE-1, BLOCK_SIZE-1);
                        } else if (color !== 0) {
                            ctx.fillStyle = color;
                            ctx.shadowColor = color;
                            ctx.shadowBlur = 10;
                            ctx.fillRect(col * BLOCK_SIZE, row * BLOCK_SIZE, BLOCK_SIZE-1, BLOCK_SIZE-1);
                        } else {
                            ctx.fillStyle = '#1a1f2e';
                            ctx.shadowBlur = 0;
                            ctx.fillRect(col * BLOCK_SIZE, row * BLOCK_SIZE, BLOCK_SIZE-1, BLOCK_SIZE-1);
                        }
                    }
                }

                if (currentPiece && gameActive && !gamePaused && !gameOverFlag && !isClearing) {
                    const { matrix, x, y, color } = currentPiece;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 14;
                    ctx.fillStyle = color;
                    for (let r = 0; r < matrix.length; r++) {
                        for (let c = 0; c < matrix[0].length; c++) {
                            if (matrix[r][c] !== 0) {
                                const boardX = (x + c) * BLOCK_SIZE;
                                const boardY = (y + r) * BLOCK_SIZE;
                                ctx.fillRect(boardX, boardY, BLOCK_SIZE-1, BLOCK_SIZE-1);
                            }
                        }
                    }
                }
                ctx.shadowBlur = 0;
            }

            function drawNext() {
                nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
                if (!nextPiece) return;
                const matrix = nextPiece.matrix;
                const color = nextPiece.color;
                const rows = matrix.length;
                const cols = matrix[0].length;
                const blockW = nextCanvas.width / 5;
                const blockH = nextCanvas.height / 5;
                const offsetX = (5 - cols) * blockW / 2;
                const offsetY = (5 - rows) * blockH / 2;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (matrix[r][c] !== 0) {
                            nextCtx.fillStyle = color;
                            nextCtx.shadowColor = color;
                            nextCtx.shadowBlur = 16;
                            nextCtx.fillRect(offsetX + c * blockW, offsetY + r * blockH, blockW-1, blockH-1);
                        }
                    }
                }
                nextCtx.shadowBlur = 0;
            }

            function drawAll() {
                drawBoard();
                drawNext();
            }

            function movePiece(dx, dy, isDownKey = false) {
                if (!gameActive || !currentPiece || gameOverFlag || gamePaused || isClearing) return false;
                const { matrix, x, y } = currentPiece;
                const newX = x + dx;
                const newY = y + dy;
                if (!collision(matrix, newX, newY)) {
                    currentPiece.x = newX;
                    currentPiece.y = newY;
                    drawAll();
                    if (!isDownKey) {
                        if (gameActive && !gameOverFlag && !gamePaused) resetDropTimer();
                    }
                    return true;
                }
                if (dy === 1) {
                    lockPiece();
                    drawAll();
                }
                return false;
            }

            function rotatePiece() {
                if (!gameActive || !currentPiece || gameOverFlag || gamePaused || isClearing) return;
                const matrix = currentPiece.matrix;
                const rotated = matrix[0].map((_, idx) => matrix.map(row => row[idx]).reverse());
                const x = currentPiece.x;
                const y = currentPiece.y;
                if (!collision(rotated, x, y)) {
                    currentPiece.matrix = rotated;
                } else if (!collision(rotated, x - 1, y)) {
                    currentPiece.matrix = rotated;
                    currentPiece.x -= 1;
                } else if (!collision(rotated, x + 1, y)) {
                    currentPiece.matrix = rotated;
                    currentPiece.x += 1;
                } else if (!collision(rotated, x, y - 1)) {
                    currentPiece.matrix = rotated;
                    currentPiece.y -= 1;
                }
                drawAll();
                if (gameActive && !gameOverFlag && !gamePaused) resetDropTimer();
            }

            function hardDrop() {
                if (!gameActive || !currentPiece || gameOverFlag || gamePaused || isClearing) return;
                while (!collision(currentPiece.matrix, currentPiece.x, currentPiece.y + 1)) {
                    currentPiece.y++;
                }
                lockPiece();
                drawAll();
            }

            function resetDropTimer() {
                if (dropTimeout) clearTimeout(dropTimeout);
                if (!gameActive || gameOverFlag || gamePaused || isClearing) return;
                const interval = getDropInterval();
                dropTimeout = setTimeout(() => {
                    if (gameActive && !gameOverFlag && !gamePaused && !isClearing && currentPiece) {
                        if (!movePiece(0, 1)) {
                        }
                    }
                    if (gameActive && !gameOverFlag && !gamePaused && !isClearing) {
                        resetDropTimer();
                    }
                }, interval);
            }

            function clearAllTimers() {
                if (dropTimeout) clearTimeout(dropTimeout);
                if (gameInterval) clearInterval(gameInterval);
                if (timerInterval) clearInterval(timerInterval);
                if (challengeInterval) clearInterval(challengeInterval);
                if (clearAnimationTimer) clearTimeout(clearAnimationTimer);
                dropTimeout = null;
                gameInterval = null;
                timerInterval = null;
                challengeInterval = null;
                clearAnimationTimer = null;
            }

            function updateButtonState() {
                if (gameOverFlag) {
                    btnIcon.textContent = '🔄';
                    btnText.textContent = '重新开始';
                } else if (gameActive && !gamePaused) {
                    btnIcon.textContent = '⏸️';
                    btnText.textContent = '暂停';
                } else if (!gameActive && gamePaused) {
                    btnIcon.textContent = '▶️';
                    btnText.textContent = '继续';
                } else {
                    btnIcon.textContent = '▶️';
                    btnText.textContent = '开始';
                }
            }

            // 修改：统一更新遮罩层（处理暂停和结束）
            function updateOverlay() {
                if (gameOverFlag) {
                    overlayTitle.textContent = '游戏结束';
                    overlayTitle.classList.remove('pulse'); // 确保不闪烁
                    overlayTitle.style.color = '#ff7b7b'; // 结束用红色
                    overlayTitle.style.textShadow = '0 0 30px #ff4d4d, 0 0 60px #a02929';
                    overlaySubtitle.textContent = gameOverReason;
                    gameOverlay.classList.add('active');
                } else if (gamePaused) {
                    overlayTitle.textContent = '暂停';
                    overlayTitle.classList.add('pulse'); // 暂停时闪烁
                    overlayTitle.style.color = '#a0b5ff';
                    overlayTitle.style.textShadow = '0 0 30px #4d6ef5, 0 0 60px #2a3f9e';
                    overlaySubtitle.textContent = '';
                    gameOverlay.classList.add('active');
                } else {
                    gameOverlay.classList.remove('active');
                }
            }

            function startGame() {
                clearAllTimers();

                board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
                score = 0;
                level = 0;
                linesCleared = 0;
                gameOverFlag = false;
                gamePaused = false;
                gameActive = false;
                isClearing = false;
                clearingRows = [];
                gameOverReason = '';

                nextPiece = getRandomPiece();
                currentPiece = {
                    matrix: nextPiece.matrix.map(row => [...row]),
                    color: nextPiece.color,
                    x: Math.floor((COLS - nextPiece.matrix[0].length) / 2),
                    y: 0
                };
                nextPiece = getRandomPiece();

                if (currentMode === 'timed') {
                    timeLeft = TIMED_MODE_START;
                    timerItem.style.display = 'flex';
                    timerDisplay.textContent = timeLeft.toFixed(1);
                } else {
                    timerItem.style.display = 'none';
                }
                if (challengeInterval) clearInterval(challengeInterval);
                if (timerInterval) clearInterval(timerInterval);

                updateStats();
                drawAll();
                updateButtonState();
                updateOverlay();
            }

            function actuallyStartGame() {
                if (gameOverFlag) {
                    startGame();
                    actuallyStartGame();
                    return;
                }
                gameActive = true;
                gamePaused = false;

                if (currentMode === 'timed') {
                    if (timerInterval) clearInterval(timerInterval);
                    timerInterval = setInterval(() => {
                        if (!gameActive || gameOverFlag || gamePaused || isClearing) return;
                        timeLeft -= 0.1;
                        if (timeLeft <= 0) {
                            timeLeft = 0;
                            timerDisplay.textContent = '0.0';
                            gameOver('⏰ 时间到！');
                        } else {
                            timerDisplay.textContent = timeLeft.toFixed(1);
                        }
                    }, 100);
                }
                if (currentMode === 'challenge') {
                    if (challengeInterval) clearInterval(challengeInterval);
                    challengeInterval = setInterval(() => {
                        if (!gameActive || gameOverFlag || gamePaused || isClearing) return;
                        level += 1;
                        updateStats();
                        resetDropTimer();
                    }, 12000);
                }

                resetDropTimer();
                updateButtonState();
                updateOverlay();
            }

            function pauseGame() {
                if (!gameActive || gameOverFlag) return;
                gamePaused = true;
                gameActive = false;
                if (dropTimeout) clearTimeout(dropTimeout);
                if (timerInterval) clearInterval(timerInterval);
                if (challengeInterval) clearInterval(challengeInterval);
                updateButtonState();
                updateOverlay();
                drawAll();
            }

            function resumeGame() {
                if (gameOverFlag || !gamePaused) return;
                gamePaused = false;
                gameActive = true;

                if (currentMode === 'timed') {
                    if (timerInterval) clearInterval(timerInterval);
                    timerInterval = setInterval(() => {
                        if (!gameActive || gameOverFlag || gamePaused || isClearing) return;
                        timeLeft -= 0.1;
                        if (timeLeft <= 0) {
                            timeLeft = 0;
                            timerDisplay.textContent = '0.0';
                            gameOver('⏰ 时间到！');
                        } else {
                            timerDisplay.textContent = timeLeft.toFixed(1);
                        }
                    }, 100);
                }
                if (currentMode === 'challenge') {
                    if (challengeInterval) clearInterval(challengeInterval);
                    challengeInterval = setInterval(() => {
                        if (!gameActive || gameOverFlag || gamePaused || isClearing) return;
                        level += 1;
                        updateStats();
                        resetDropTimer();
                    }, 12000);
                }

                resetDropTimer();
                updateButtonState();
                updateOverlay();
            }

            function gameOver(reason = '游戏结束') {
                if (gameOverFlag) return;
                gameOverFlag = true;
                gameActive = false;
                gamePaused = false;
                gameOverReason = reason === '游戏结束' ? '' : reason; 
                clearAllTimers();
                drawAll();
                updateButtonState();
                updateOverlay();
            }

            function handleKeyDown(e) {
                const key = e.key;
                e.preventDefault();

                if (!gameActive || gameOverFlag || gamePaused || isClearing) return;

                switch (key) {
                    case 'ArrowLeft': movePiece(-1, 0); break;
                    case 'ArrowRight': movePiece(1, 0); break;
                    case 'ArrowDown': 
                        if (movePiece(0, 1, true)) {
                            if (gameActive && !gameOverFlag && !gamePaused) resetDropTimer();
                        }
                        break;
                    case 'ArrowUp': rotatePiece(); break;
                    case ' ':
                    case 'Space':
                        hardDrop();
                        break;
                    default: return;
                }
            }

            function switchMode(mode) {
                currentMode = mode;
                modeBtns.forEach(btn => {
                    if (btn.dataset.mode === mode) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
                startGame();
            }

            window.addEventListener('keydown', handleKeyDown);

            actionBtn.addEventListener('click', () => {
                if (gameOverFlag) {
                    startGame();
                    actuallyStartGame();
                } else if (!gameActive && !gamePaused) {
                    actuallyStartGame();
                } else if (gameActive && !gamePaused) {
                    pauseGame();
                } else if (!gameActive && gamePaused) {
                    resumeGame();
                }
            });

            modeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const mode = btn.dataset.mode;
                    if (mode === currentMode) return;
                    switchMode(mode);
                });
            });

            window.addEventListener('keydown', function(e) {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                    e.preventDefault();
                }
            }, { passive: false });

            function init() {
                currentMode = 'classic';
                modeBtns.forEach(btn => {
                    if (btn.dataset.mode === 'classic') btn.classList.add('active');
                    else btn.classList.remove('active');
                });
                startGame();
            }

            init();
        })();
    </script>
</body>
</html>

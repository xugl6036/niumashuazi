<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平台工单数据转换工具</title>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    html, body { height: 100%; }

    body {
      background: linear-gradient(145deg, #eef2f7 0%, #f8fafc 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 24px;
      gap: 12px;
      overflow: hidden;
    }

    :root {
      --color-yanwei: #86efac;
      --current-theme-color: var(--color-yanwei);
    }

    .shell {
      width: 1440px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1 1 auto;
      min-height: 0;
    }

    .topbar {
      background: linear-gradient(135deg, #1e3a5f 0%, #152c47 100%);
      border-radius: 16px;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px -8px rgba(30, 58, 95, 0.35);
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 10px 16px;
      user-select: none;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .topbar-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-title i {
      font-size: 1.2rem;
      color: #7cb3e8;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .version {
      font-size: 0.82rem;
      font-weight: 500;
      color: #a8c6e8;
      background: rgba(255, 255, 255, 0.08);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .icon-btn-top {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #d4e6ff;
      width: 32px;
      height: 32px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn-top:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .app {
      display: flex;
      width: 100%;
      gap: 24px;
      flex: 1 1 auto;
      min-height: 0;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.12), 0 8px 24px -8px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .left { flex: 1; min-width: 0; }
    .right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; min-height: 0; }

    .output-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.1), 0 4px 16px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      flex-shrink: 0;
    }

    /* 调整比例，群名和制表高度严格保持一致 */
    .output-card:nth-child(1) { flex: 3; }
    .output-card:nth-child(2) { flex: 1; }
    .output-card:nth-child(3) { flex: 1; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      background: linear-gradient(to bottom, #fbfdff, #f7fafd);
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      flex-shrink: 0;
    }

    .card-header .title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-header .title i {
      font-size: 1.05rem;
      color: var(--current-theme-color);
    }

    .action-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(241, 245, 249, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.6);
      width: 32px;
      height: 32px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #64748b;
      font-size: 1rem;
      transition: all 0.18s;
    }

    .icon-btn:hover {
      background: #ffffff;
      color: #1e293b;
      transform: translateY(-1px);
    }

    .icon-btn.paste-btn:hover { background: #eff6ff; color: #2563eb; }
    .icon-btn.regen-btn:hover { background: #f0fdf4; color: #16a34a; }
    .icon-btn.clear-btn:hover { background: #fef2f2; color: #dc2626; }

    .text-area {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 18px 22px;
      font-size: 0.95rem;
      line-height: 1.65;
      color: #0f172a;
      background: #ffffff;
      overflow-y: auto;
      min-height: 0;
    }

    /* 群名专用：单行显示，禁止上下滚动 */
    .group-name-area {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 18px 22px;
      font-size: 0.95rem;
      line-height: 1.65;
      color: #0f172a;
      background: #ffffff;
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      min-height: 0;
    }

    .table-display-area {
      flex: 1;
      width: 100%;
      padding: 16px 22px;
      background: #ffffff;
      overflow: auto;
      min-height: 0;
    }

    .table-wrapper {
      display: inline-flex;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      white-space: nowrap;
    }

    .table-cell {
      padding: 8px 12px;
      border-right: 1px solid #e2e8f0;
      font-size: 0.88rem;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .table-cell:last-child {
      border-right: none;
    }

    .table-cell .th {
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 4px;
    }
    
    .table-cell .td {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.85rem;
    }
    
    .table-cell.empty {
      background: #f8fafc;
      color: #cbd5e1;
    }

    .copy-btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .copy-btn:hover { background: #ffffff; color: #1e293b; transform: translateY(-1px); }
    .copy-btn.copied { background: #e6f7e6; color: #15803d; border-color: #b8e6b8; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 8px 0 4px;
      flex-shrink: 0;
    }
    .footer-line {
      flex: 1;
      max-width: 300px;
      height: 1px;
      background: linear-gradient(to right, transparent, #b6c6da, #b6c6da, transparent);
    }
    .footer-text {
      font-size: 0.78rem;
      font-weight: 500;
      color: #7c8ea6;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">
          <i class="fas fa-gears"></i> 平台工单数据转换工具
        </div>
      </div>
      <div class="topbar-right">
        <span class="version">V1.0</span>
        <button class="icon-btn-top" id="openWindowBtn" title="独立窗口打开">
          <i class="fas fa-clone"></i>
        </button>
      </div>
    </header>

    <div class="app">
      <div class="card left">
        <div class="card-header">
          <div class="title">
            <i class="fas fa-database"></i> 数据源
          </div>
          <div class="action-buttons">
            <button class="icon-btn paste-btn" id="pasteBtn" title="粘贴生成">
              <i class="fas fa-paste"></i>
            </button>
            <button class="icon-btn regen-btn" id="regenBtn" title="重新生成">
              <i class="fas fa-rotate-right"></i>
            </button>
            <button class="icon-btn clear-btn" id="clearBtn" title="清空">
              <i class="fas fa-trash-can"></i>
            </button>
          </div>
        </div>
        <textarea class="text-area" id="sourceInput" placeholder="在妍伟运营平台工单详情页面全选复制，
在此粘贴原始内容，
点击右上角图标快速生成..."></textarea>
      </div>

      <div class="right">
        <div class="output-card">
          <div class="card-header">
            <div class="title">
              <i class="fas fa-bullhorn"></i> 群公告
            </div>
            <button class="copy-btn" data-target="announcementOutput">
              <i class="fas fa-copy"></i> 复制
            </button>
          </div>
          <textarea class="text-area output-textarea" id="announcementOutput" placeholder="群公告将显示在这里..."></textarea>
        </div>

        <div class="output-card">
          <div class="card-header">
            <div class="title">
              <i class="fas fa-users"></i> 群名
            </div>
            <button class="copy-btn" data-target="groupNameOutput">
              <i class="fas fa-copy"></i> 复制
            </button>
          </div>
          <textarea class="group-name-area" id="groupNameOutput" placeholder="群名将显示在这里..."></textarea>
        </div>

        <div class="output-card" id="tableOutputCard">
          <div class="card-header" id="normalTableHeader">
            <div class="title">
              <i class="fas fa-table"></i> 制表
            </div>
            <button class="copy-btn" data-target="tableOutput">
              <i class="fas fa-copy"></i> 复制
            </button>
          </div>
          <div class="table-display-area" id="tableDisplayArea"></div>
          <textarea id="tableOutput" style="display:none;"></textarea>
        </div>
      </div>
    </div>

    <footer class="footer">
      <span class="footer-line"></span>
      <span class="footer-text"><i class="fas fa-code"></i> Powered by XUGL</span>
      <span class="footer-line"></span>
    </footer>
  </div>

  <script>
    (function() {
      const sourceInput = document.getElementById('sourceInput');
      const announcementOutput = document.getElementById('announcementOutput');
      const groupNameOutput = document.getElementById('groupNameOutput');
      const tableOutput = document.getElementById('tableOutput');
      const tableDisplayArea = document.getElementById('tableDisplayArea');

      const pasteBtn = document.getElementById('pasteBtn');
      const regenBtn = document.getElementById('regenBtn');
      const clearBtn = document.getElementById('clearBtn');
      const openWindowBtn = document.getElementById('openWindowBtn');
      const copyBtns = document.querySelectorAll('.copy-btn');

      const defaultPlaceholder = `在妍伟运营平台工单详情页面全选复制，
在此粘贴原始内容，
点击右上角图标快速生成...`;

      // 核心提取函数
      function extractRawData(raw) {
        let cleanRaw = raw;
        const startIdx = raw.indexOf('工单信息');
        if (startIdx !== -1) {
          cleanRaw = raw.substring(startIdx + 4); 
        } else {
           const secondIdx = raw.indexOf('工单编号');
           if(secondIdx !== -1) cleanRaw = raw.substring(secondIdx);
        }

        const lines = cleanRaw.split(/\r?\n/).map(s => s.trim()).filter(s => s);
        const data = {};
        
        let skipSection = false;
        
        for (let i = 0; i < lines.length; i++) {
          let line = lines[i];
          
          if (line.startsWith('动态信息') || line.startsWith('@') || line.startsWith('工单号：')) {
             break; 
          }
          
          if (line === '回执信息' || line === '结算信息' || line === '客户签名') {
             skipSection = true;
             continue;
          }
          
          if (skipSection) continue;

          const validKeys = ['工单编号','工单类型','可用品牌','可用仓库','推进状态','多级审核','状态类型','状态','未安装原因','购车人姓名','团队','购车人电话','客户地址','处理人','协同人','工单来源','创建人','创建时间','桩名称','套包类型','桩图','吉利工单编号','车架号','安装联系人姓名','安装联系人手机号','分配服务商时间','用户申请工单时间','安装状态','详细车位','车辆品牌','车型名称','交车终端时间','车辆类型','内购单物料码','桩配送方式','用户备注','运营备注','是否可忽略证件照材料','第一次驳回时间','第二次驳回时间','驳回原因','拒绝原因','用户取消申请的时间','首联完成时间','权益到期时间','关闭来源','浩瀚评价分数','浩瀚评价内容','客户催单次数','最新催单时间','完成时间','归档时间','更新时间'];
          
          if (validKeys.includes(line) && i + 1 < lines.length) {
            const val = lines[i + 1];
            if (!validKeys.includes(val)) {
              data[line] = val;
              i++; 
            } else {
              data[line] = '无';
            }
          }
        }
        return data;
      }

      // 核心转换逻辑
      function transformData(data) {
        if (!data || !data['工单编号']) return { announcement: '', groupName: '', table: '' };

        // ---- 预处理字段 ----
        let workOrderNo = data['工单编号'] || '';
        let customerName = data['购车人姓名'] || '无';
        if (customerName === '无') customerName = data['安装联系人姓名'] || '';
        
        let addressRaw = data['客户地址'] || '';
        let carBrand = data['车辆品牌'] || '';
        let carModel = data['车型名称'] || '';
        let carType = data['车辆类型'] || '';
        let carVIN = data['车架号'] || '';
        let jiliNo = data['吉利工单编号'] || '';
        let applyTime = data['用户申请工单时间'] || '';
        let deliveryTime = data['交车终端时间'] || '';
        let rightEndTime = data['权益到期时间'] || '';
        let deliveryMethod = data['桩配送方式'] || '';
        let installContact = data['安装联系人姓名'] || '';
        let installPhone = data['安装联系人手机号'] || '';
        let userRemark = data['用户备注'] || '无';
        let opRemark = data['运营备注'] || '无';

        // ---- 规则 1：地址拆分 (修复重复问题) ----
        let province = '', city = '', district = '', detail = '';
        let addrParts = addressRaw.split(/\s+/).filter(s=>s);
        if (addrParts.length >= 4) {
          province = addrParts[0];
          city = addrParts[1];
          district = addrParts[2];
          detail = addrParts.slice(3).join('');
        } else {
          let match = addressRaw.match(/^(.*?[省市自治区])(.*?[市州盟])(.*?[区县市旗])(.*)$/);
          if (match) {
             province = match[1];
             city = match[2];
             district = match[3];
             detail = match[4];
          } else {
             province = addrParts[0] || '';
             city = addrParts[1] || '';
             district = addrParts[2] || '';
             detail = addrParts[3] || '';
          }
        }

        // 去除详细地址中重复的省市区县
        if (detail && province && detail.startsWith(province)) detail = detail.substring(province.length);
        if (detail && city && detail.startsWith(city)) detail = detail.substring(city.length);
        if (detail && district && detail.startsWith(district)) detail = detail.substring(district.length);

        // ---- 规则 2：车型名称、购车时间、权益到期 ----
        let finalModel = '';
        let finalCarType = carType === '无' ? '商城订单' : carType;
        if (carModel === '无' || !carModel) {
          finalModel = carBrand + '商城'; 
        } else {
          finalModel = carModel; 
        }

        let finalBuyTime = deliveryTime === '无' || !deliveryTime ? applyTime : deliveryTime;
        let finalRightTime = rightEndTime === '-' || rightEndTime === '无' || !rightEndTime;
        if (finalRightTime && finalBuyTime) {
          let d = new Date(finalBuyTime);
          d.setDate(d.getDate() - 1);
          d.setFullYear(d.getFullYear() + 1);
          finalRightTime = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        } else {
          finalRightTime = finalRightTime ? '' : finalRightTime;
          if (rightEndTime && rightEndTime !== '-' && rightEndTime !== '无') {
             finalRightTime = rightEndTime.split(' ')[0];
          }
        }

        // ---- 组装：群公告 ----
        let annLines = [];
        annLines.push('妍伟运营平台');
        annLines.push('工单编号：' + workOrderNo);
        annLines.push('安装联系人：' + installContact + installPhone);
        annLines.push('客户地址：' + province + city + district + detail);
        annLines.push('吉利单号：' + jiliNo);
        if (carVIN !== '无' && carVIN !== '') annLines.push('车架号：' + carVIN);
        if (data['购车人姓名'] && data['购车人姓名'] !== '无') annLines.push('购车人：' + data['购车人姓名']);
        if (finalBuyTime) annLines.push('购车时间：' + finalBuyTime.split(' ')[0] + '；权益截止：' + finalRightTime);
        annLines.push('车型名称：' + finalModel + '/' + finalCarType + '/' + deliveryMethod);
        annLines.push('桩名称：' + (data['桩名称'] || '无'));
        annLines.push('套包类型：' + (data['套包类型'] || '无').split(',')[0]);

        if (userRemark && userRemark !== '无') annLines.push('用户备注：' + userRemark);
        
        if (deliveryMethod === '快递到家') {
          annLines.push('运营备注：桩在客户手上，无需核验权益');
        } else if (opRemark && opRemark !== '无') {
          annLines.push('运营备注：' + opRemark);
        }
        
        let announcement = annLines.join('\n');

        // ---- 组装：群名 ----
        let m = '', d = '';
        if (applyTime) {
           let dObj = new Date(applyTime);
           m = dObj.getMonth() + 1;
           d = String(dObj.getDate()).padStart(2, '0');
        }
        let dateStr = m ? `${m}/${d}` : '';
        let groupName = `${dateStr}妍伟·${finalModel}${district}${customerName}安装服务群`;

        // ---- 组装：制表（A1 ~ Z1，无表头） ----
        let row = new Array(26).fill(''); 
        
        row[0] = workOrderNo; // A
        row[1] = customerName; // B
        // C, D, E 留空
        row[5] = data['创建时间'] || ''; // F
        // G ~ S 留空
        row[19] = installContact; // T (只有名字)
        row[20] = city; // U
        row[21] = district; // V
        row[22] = (carVIN === '无' || !carVIN) ? '无' : carVIN; // W
        row[23] = finalModel; // X
        row[24] = finalBuyTime ? finalBuyTime.split(' ')[0] : ''; // Y
        row[25] = jiliNo; // Z

        let table = row.join('\t'); // Tab文本

        return { announcement, groupName, table, row };
      }

      function updateOutputs() {
        const raw = sourceInput.value;
        if (!raw.trim()) {
          announcementOutput.value = '';
          groupNameOutput.value = '';
          tableOutput.value = '';
          tableDisplayArea.innerHTML = '';
          return;
        }
        
        const data = extractRawData(raw);
        const result = transformData(data);

        announcementOutput.value = result.announcement;
        groupNameOutput.value = result.groupName;
        tableOutput.value = result.table;
        
        renderTableDisplay(result.row);
        resetAllCopyBtns();
      }

      // 渲染界面横向表格
      function renderTableDisplay(rowData) {
        tableDisplayArea.innerHTML = '';
        if (!rowData || rowData.length === 0) return;

        const wrapper = document.createElement('div');
        wrapper.className = 'table-wrapper';

        const headers = ['A工单号', 'B购车人', 'C', 'D', 'E', 'F创建时间', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'P', 'Q', 'R', 'S', 'T安装人', 'U城市', 'V区县', 'W车架号', 'X车型', 'Y交车时间', 'Z车企单号'];

        for (let i = 0; i < rowData.length; i++) {
          const cell = document.createElement('div');
          cell.className = 'table-cell';
          
          const val = rowData[i] || '';
          if (val === '') cell.classList.add('empty');

          const th = document.createElement('div');
          th.className = 'th';
          th.textContent = headers[i];
          
          const td = document.createElement('div');
          td.className = 'td';
          td.textContent = val || '-';

          cell.appendChild(th);
          cell.appendChild(td);
          wrapper.appendChild(cell);
        }

        tableDisplayArea.appendChild(wrapper);
      }

      function resetAllCopyBtns() {
        copyBtns.forEach(btn => {
          btn.classList.remove('copied');
          btn.innerHTML = '<i class="fas fa-copy"></i> 复制';
        });
      }

      async function copyTextToClipboard(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (err) {
          try {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            const success = document.execCommand('copy');
            document.body.removeChild(textarea);
            return success;
          } catch (e) {
            return false;
          }
        }
      }

      async function handleCopyClick(event) {
        const btn = event.currentTarget;
        const targetId = btn.getAttribute('data-target');
        const targetEl = document.getElementById(targetId);
        if (!targetEl) return;
        
        const textToCopy = targetEl.value;
        const success = await copyTextToClipboard(textToCopy);

        if (success) {
          btn.innerHTML = '<i class="fas fa-check"></i> 已复制';
          btn.classList.add('copied');

          setTimeout(() => {
            if (btn.classList.contains('copied')) {
              btn.classList.remove('copied');
              btn.innerHTML = '<i class="fas fa-copy"></i> 复制';
            }
          }, 2000);
        } else {
          alert('复制失败，请手动选择文本复制');
        }
      }

      async function pasteAndGenerate() {
        try {
          if (!navigator.clipboard || !navigator.clipboard.readText) {
            throw new Error('API not supported');
          }
          const text = await navigator.clipboard.readText();
          if (text) {
            sourceInput.value = text;
            updateOutputs();
          }
        } catch (err) {
          // 如果在独立窗口(blob)中，Chrome拦截了读取，直接通过UI引导
          // 不弹窗，而是聚焦输入框，并把占位符改为提示
          sourceInput.focus();
          sourceInput.placeholder = '⚠️ 当前环境限制了自动读取。\n\n请直接在此按下 Ctrl+V (或右键粘贴)，\n系统会自动生成结果。';
          
          // 3秒后恢复默认提示
          setTimeout(() => {
            if (sourceInput.value.trim() === '') {
               sourceInput.placeholder = defaultPlaceholder;
            }
          }, 4000);
        }
      }

      function clearAll() {
        sourceInput.value = '';
        announcementOutput.value = '';
        groupNameOutput.value = '';
        tableOutput.value = '';
        tableDisplayArea.innerHTML = '';
        resetAllCopyBtns();
        sourceInput.placeholder = defaultPlaceholder;
        sourceInput.focus();
      }

      function openInNewWindow() {
        const htmlContent = document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank', 'width=1440,height=900,menubar=no,toolbar=no,location=no,status=no');
      }

      pasteBtn.addEventListener('click', pasteAndGenerate);
      regenBtn.addEventListener('click', updateOutputs);
      clearBtn.addEventListener('click', clearAll);
      openWindowBtn.addEventListener('click', openInNewWindow);

      copyBtns.forEach(btn => {
        btn.addEventListener('click', handleCopyClick);
      });
      
      // 绑定输入监听，无论是手动打字还是粘贴，均实时触发更新
      sourceInput.addEventListener('input', updateOutputs);
    })();
  </script>
</body>
</html>

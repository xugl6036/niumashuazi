<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牛马刷子 - 打工人工具合集</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
    :root { --primary-color: #5a9bd4; --primary-hover: #4884ba; --primary-light: #7eb8e6; --bg-color: #eef6fc; --sidebar-bg: #ffffff; --sidebar-header-bg: #f4f9fe; --text-main: #3b5b7e; --text-muted: #8a9bb5; --border-color: #e2edf7; --content-bg: #f7fbff; --box-bg: #ffffff; --box-border: #dbe9f4; --quote-bg: linear-gradient(135deg, #f0f8ff 0%, #ffffff 100%); --quote-mark: #e6f2fc; --shadow: rgba(100, 150, 200, 0.08); --shadow-hover: rgba(90, 155, 212, 0.15); }
    [data-theme="mint"] { --primary-color: #4eb598; --primary-hover: #3d9b7f; --primary-light: #75caae; --bg-color: #f0f9f6; --sidebar-bg: #ffffff; --sidebar-header-bg: #f2faf7; --text-main: #2c5a4a; --text-muted: #7a9e92; --border-color: #d5ede4; --content-bg: #f7fcfa; --box-bg: #ffffff; --box-border: #d5ede4; --quote-bg: linear-gradient(135deg, #f0faf6 0%, #ffffff 100%); --quote-mark: #dff5eb; --shadow: rgba(100, 200, 170, 0.08); --shadow-hover: rgba(78, 181, 152, 0.15); }
    [data-theme="peach"] { --primary-color: #f09b8f; --primary-hover: #e07f71; --primary-light: #f5b8ae; --bg-color: #fdf4f2; --sidebar-bg: #ffffff; --sidebar-header-bg: #fef8f6; --text-main: #7a4b45; --text-muted: #a98c87; --border-color: #f7e3de; --content-bg: #fffafa; --box-bg: #ffffff; --box-border: #f7e3de; --quote-bg: linear-gradient(135deg, #fef5f3 0%, #ffffff 100%); --quote-mark: #fce9e5; --shadow: rgba(200, 150, 140, 0.08); --shadow-hover: rgba(240, 155, 143, 0.15); }
    [data-theme="orange"] { --primary-color: #f5a623; --primary-hover: #e09412; --primary-light: #f7be5b; --bg-color: #fef9f0; --sidebar-bg: #ffffff; --sidebar-header-bg: #fffdf8; --text-main: #865e1a; --text-muted: #a89673; --border-color: #f7ecd6; --content-bg: #fffbf5; --box-bg: #ffffff; --box-border: #f7ecd6; --quote-bg: linear-gradient(135deg, #fef8ed 0%, #ffffff 100%); --quote-mark: #fdf1d9; --shadow: rgba(200, 160, 100, 0.08); --shadow-hover: rgba(245, 166, 35, 0.15); }
    [data-theme="dark"] { --primary-color: #a88bfa; --primary-hover: #8e6cf0; --primary-light: #c3b0fd; --bg-color: #121212; --sidebar-bg: #1e1e1e; --sidebar-header-bg: #2d2d2d; --text-main: #e0e0e0; --text-muted: #888888; --border-color: #333333; --content-bg: #121212; --box-bg: #1e1e1e; --box-border: #333333; --quote-bg: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%); --quote-mark: #2a2a2a; --shadow: rgba(0, 0, 0, 0.4); --shadow-hover: rgba(168, 139, 250, 0.2); }
    [data-theme="light"] { --primary-color: #555555; --primary-hover: #333333; --primary-light: #888888; --bg-color: #f9f9f9; --sidebar-bg: #ffffff; --sidebar-header-bg: #f5f5f5; --text-main: #333333; --text-muted: #999999; --border-color: #eeeeee; --content-bg: #fcfcfc; --box-bg: #ffffff; --box-border: #eeeeee; --quote-bg: linear-gradient(135deg, #fafafa 0%, #ffffff 100%); --quote-mark: #f0f0f0; --shadow: rgba(0, 0, 0, 0.04); --shadow-hover: rgba(0, 0, 0, 0.08); }
    [data-theme="gray"] { --primary-color: #6c7a89; --primary-hover: #56626e; --primary-light: #8e9daa; --bg-color: #2f3640; --sidebar-bg: #353b48; --sidebar-header-bg: #2f3640; --text-main: #dcdde1; --text-muted: #9aa0a6; --border-color: #414852; --content-bg: #2f3640; --box-bg: #353b48; --box-border: #414852; --quote-bg: linear-gradient(135deg, #353b48 0%, #2f3640 100%); --quote-mark: #3e4652; --shadow: rgba(0, 0, 0, 0.3); --shadow-hover: rgba(108, 122, 137, 0.25); }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft YaHei", sans-serif; }
    body { background-color: var(--bg-color); height: 100vh; overflow: hidden; transition: background-color 0.3s ease; }
    #mainSystem { display: flex; height: 100vh; overflow: hidden; }
    
    /* 侧边栏 */
    .sidebar { width: 320px; background-color: var(--sidebar-bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; transition: width 0.3s; border-right: 1px solid var(--border-color); z-index: 20; }
    .sidebar.collapsed { width: 80px; }
    .sidebar-header { height: 72px; background-color: var(--sidebar-header-bg); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
    .sidebar-header .icon { font-size: 28px; }
    .sidebar-header .title-text { margin-left: 10px; transition: opacity 0.3s; }
    .sidebar.collapsed .title-text { opacity: 0; width: 0; overflow: hidden; }
    .sidebar-content { display: flex; flex: 1; overflow: hidden; }
    .primary-nav { width: 85px; background-color: var(--sidebar-header-bg); border-right: 1px solid var(--border-color); overflow-y: auto; padding-top: 15px; }
    .primary-item { height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; position: relative; }
    .primary-item .icon { font-size: 26px; margin-bottom: 4px; }
    .primary-item.active { color: var(--text-main); background-color: var(--sidebar-bg); font-weight: 600; }
    .primary-item.active::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 4px; background-color: var(--primary-color); }
    .secondary-nav { flex: 1; padding-top: 15px; overflow-y: auto; white-space: nowrap; }
    .sidebar.collapsed .secondary-nav { opacity: 0; pointer-events: none; }
    .secondary-item { height: 54px; padding: 0 20px; display: flex; align-items: center; cursor: pointer; font-size: 15px; color: var(--text-main); border-radius: 0 27px 27px 0; margin-right: 12px; margin-bottom: 5px; transition: 0.2s; }
    .secondary-item .icon { margin-right: 12px; font-size: 18px; width: 22px; text-align: center; }
    .secondary-item:hover { background-color: var(--content-bg); }
    .secondary-item.active { background-color: var(--primary-color); color: #fff; }

    /* 右侧主体 */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .top-header { height: 72px; background-color: var(--sidebar-bg); box-shadow: 0 1px 0 var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .collapse-btn { cursor: pointer; font-size: 20px; color: var(--text-muted); padding: 5px 8px; border-radius: 4px; }
    .collapse-btn:hover { background-color: var(--content-bg); }
    .breadcrumb { font-size: 14px; color: var(--text-muted); display: flex; gap: 5px; }
    .current-path { color: var(--text-main); font-weight: 500; }
    .header-right { display: flex; align-items: center; gap: 15px; position: relative; }
    .version-text { font-size: 12px; color: var(--text-muted); background: var(--content-bg); padding: 4px 8px; border-radius: 12px; }
    .icon-btn { font-size: 18px; background: transparent; border: none; cursor: pointer; padding: 6px; border-radius: 50%; color: var(--text-main); position: relative; }
    .icon-btn:hover { background-color: var(--content-bg); }
    .badge-dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; background-color: #f56c6c; border-radius: 50%; border: 2px solid var(--sidebar-bg); }
    
    /* 弹窗 */
    .popover { position: absolute; top: 45px; right: 0; background: var(--box-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.2); display: none; z-index: 100; color: var(--text-main); }
    .popover.show { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    .notify-popover { width: 260px; }
    .popover-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
    .notify-item { padding: 10px 0; border-bottom: 1px dashed var(--border-color); font-size: 13px; }
    .notify-item:last-child { border-bottom: none; padding-bottom: 0; }
    .notify-item .time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .theme-popover { width: 230px; }
    .theme-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .theme-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
    .theme-dot.active { border-color: var(--text-main); }
    .theme-dot.blue { background-color: #5a9bd4; } .theme-dot.mint { background-color: #4eb598; } .theme-dot.peach { background-color: #f09b8f; } .theme-dot.orange { background-color: #f5a623; } .theme-dot.dark { background-color: #1e1e1e; } .theme-dot.light { background-color: #f5f5f5; border: 1px solid #ddd; } .theme-dot.gray { background-color: #6c7a89; }

    /* 滚动文字 */
    .marquee-container { height: 40px; background-color: var(--content-bg); border-bottom: 1px solid var(--border-color); overflow: hidden; display: flex; align-items: center; z-index: 5; }
    .marquee-content { display: inline-block; white-space: nowrap; padding-left: 100%; animation: marquee 25s linear infinite; font-size: 13px; color: var(--primary-color); font-weight: 500; letter-spacing: 1px; }
    .marquee-container:hover .marquee-content { animation-play-state: paused; }
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

    /* 内容区 */
    .content-area { flex: 1; padding: 0; overflow-y: auto; background-color: var(--content-bg); display: flex; flex-direction: column; position: relative; }
    .content-inner { padding: 24px; display: flex; flex-direction: column; flex: 1; }
    
    /* 针对首页占满，其他工具页有内边距 */
    .content-inner.is-tool { padding: 0; }

    .page-title { font-size: 20px; font-weight: 600; color: var(--text-main); margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); display: flex; gap: 10px; }
    .full-quote-container { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--quote-bg); position: relative; overflow: hidden; padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); }
    .full-quote-container::before { content: '“'; position: absolute; top: 40px; left: 80px; font-size: 240px; color: var(--quote-mark); font-family: serif; line-height: 1; z-index: 0; }
    .quote-text { font-size: 38px; font-weight: 600; color: var(--text-main); line-height: 1.6; position: relative; z-index: 1; letter-spacing: 2px; text-align: center; max-width: 1000px; }
    .placeholder-box { background: var(--box-bg); border: 2px dashed var(--border-color); border-radius: 16px; padding: 80px 40px; text-align: center; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .placeholder-box .p-icon { font-size: 56px; margin-bottom: 20px; }
    .placeholder-box .p-title { font-size: 18px; font-weight: 600; color: var(--primary-color); }
    .placeholder-box .p-desc { font-size: 14px; margin-top: 10px; }

    /* ================== Iframe 样式 ================== */
    .iframe-wrapper {
        flex: 1;
        width: 100%;
        height: 100%;
        border: none;
        background: var(--box-bg);
        overflow: hidden;
    }
    .iframe-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
</style>
</head>
<body>

<!-- ================== 主系统 ================== -->
<div id="mainSystem">
    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="icon">🐂</span>
            <span class="title-text">牛马刷子</span>
        </div>
        <div class="sidebar-content">
            <div class="primary-nav" id="primaryNav"></div>
            <div class="secondary-nav" id="secondary-nav"></div>
        </div>
    </div>

    <!-- 右侧主体 -->
    <div class="main-wrapper">
        <!-- 路径导航 -->
        <div class="top-header">
            <div class="header-left">
                <div class="collapse-btn" id="collapse-btn">☰</div>
                <div class="breadcrumb">
                    <span id="breadcrumb-parent">首页</span>
                    <span style="color: #ccc;">/</span>
                    <span class="current-path" id="breadcrumb-child">胡言乱语</span>
                </div>
            </div>
            
            <div class="header-right">
                <span class="version-text">v2.0.0</span>
                <button class="icon-btn" id="notifyBtn">
                    🔔
                    <span class="badge-dot"></span>
                </button>
                <div class="popover notify-popover" id="notifyPopover">
                    <div class="popover-title">🔔 消息通知</div>
                    <div class="notify-item"><div>系统已更新至 v2.0.0</div><div class="time">10分钟前</div></div>
                    <div class="notify-item"><div>摸鱼提醒：起来喝杯水，走动一下~</div><div class="time">1小时前</div></div>
                </div>
                <button class="icon-btn" id="themeBtn">🎨</button>
                <div class="popover theme-popover" id="themePopover">
                    <div class="popover-title">🎨 选择主题颜色</div>
                    <div class="theme-options">
                        <div class="theme-dot light" onclick="changeTheme('light', this)"></div>
                        <div class="theme-dot dark" onclick="changeTheme('dark', this)"></div>
                        <div class="theme-dot gray active" onclick="changeTheme('gray', this)"></div>
                        <div class="theme-dot blue" onclick="changeTheme('blue', this)"></div>
                        <div class="theme-dot mint" onclick="changeTheme('mint', this)"></div>
                        <div class="theme-dot peach" onclick="changeTheme('peach', this)"></div>
                        <div class="theme-dot orange" onclick="changeTheme('orange', this)"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 滚动文字 -->
        <div class="marquee-container" id="marqueeContainer">
            <div class="marquee-content">
                📢 欢迎使用牛马刷子工具合集！今日语录：只要思想不滑坡，办法总比困难多。摸鱼虽好，可不要贪杯哦~ 🐟 友情提示：距离周末还有 2 天，牛马们加油！
            </div>
        </div>

        <!-- 内容主体 -->
        <div class="content-area" id="contentArea">
            <div class="content-inner" id="contentInner">
                <div class="content-card" id="contentCard" style="flex: 1; display: flex; flex-direction: column;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    /* ================== 名言库 ================== */
    const quotes = [
        "人生是旷野，不是轨道。不必按别人的节奏赶路。",
        "接纳无常，才是安稳的开始。得到是幸运，失去是常态。",
        "我们终其一生，不是为了满足所有人的期待，而是取悦自己。",
        "世事本无好坏，是我们的念头，赋予它悲欢。",
        "慢慢来，好戏都在烟火里。"
    ];

    /* ================== 全局菜单数据 ================== */
    const menuData = [
        {
            title: "首页",
            icon: "🏠",
            subs: [
                { icon: "✨", name: "胡言乱语", url: "" }
            ]
        },
        {
            title: "图形",
            icon: "🎨",
            subs: [
                { icon: "💧", name: "自定义水印", url: "./pages/watermark.html" }, 
                { icon: "🧠", name: "思维导图", url: "./pages/mindmap.html" },
                { icon: "🖼️", name: "图片去水印", url: "./pages/remove-wm.html" },
                { icon: "📊", name: "图表制作", url: "./pages/chart.html" }
            ]
        },
        {
            title: "制表",
            icon: "📗",
            subs: [
                { icon: "📑", name: "Excel公式库", url: "" },
                { icon: "📝", name: "财务报表", url: "" },
                { icon: "📅", name: "排班表生成", url: "" }
            ]
        },
        {
            title: "效率",
            icon: "⚡",
            subs: [
                { icon: "⌨️", name: "快捷短语", url: "" },
                { icon: "🕒", name: "时间管理", url: "" },
                { icon: "📋", name: "剪贴板历史", url: "" }
            ]
        },
        {
            title: "Wiki",
            icon: "📚",
            subs: [
                { icon: "💡", name: "摸鱼指南", url: "" },
                { icon: "🛠️", name: "办公技巧", url: "" }
            ]
        },
        {
            title: "摸鱼",
            icon: "🐟",
            subs: [
                { icon: "🎮", name: "小游戏", url: "" },
                { icon: "📰", name: "今日热搜", url: "" },
                { icon: "🎵", name: "白噪音", url: "" }
            ]
        },
        {
            title: "support",
            icon: "🛡️",
            subs: [
                { icon: "✉️", name: "联系作者", url: "" },
                { icon: "📄", name: "关于牛马", url: "" }
            ]
        }
    ];

    /* ================== 初始化渲染 ================== */
    renderPrimaryNav();
    renderSubMenu(0);

    /* ================== 侧边栏渲染 ================== */
    function renderPrimaryNav() {
        const primaryNav = document.getElementById('primaryNav');
        primaryNav.innerHTML = '';
        
        menuData.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = `primary-item ${index === 0 ? 'active' : ''}`;
            div.setAttribute('data-index', index);
            div.innerHTML = `<span class="icon">${item.icon}</span><span class="item-text">${item.title}</span>`;
            
            div.addEventListener('click', function () {
                document.querySelectorAll('.primary-item').forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                renderSubMenu(parseInt(this.getAttribute('data-index')));
            });
            primaryNav.appendChild(div);
        });
    }

    function renderSubMenu(index) {
        const data = menuData[index];
        const secondaryNav = document.getElementById('secondary-nav');
        secondaryNav.innerHTML = '';
        document.getElementById('breadcrumb-parent').textContent = data.title;

        data.subs.forEach((subItem, subIndex) => {
            const div = document.createElement('div');
            div.className = `secondary-item ${subIndex === 0 ? 'active' : ''}`;
            div.innerHTML = `<span class="icon">${subItem.icon}</span> <span>${subItem.name}</span>`;
            
            div.addEventListener('click', function () {
                document.querySelectorAll('.secondary-item').forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                renderContent(data.title, subItem.name);
            });
            secondaryNav.appendChild(div);
        });

        if (data.subs.length > 0) {
            renderContent(data.title, data.subs[0].name);
        }
    }

    /* ================== 内容路由================== */
    function renderContent(parentName, childName) {
        document.getElementById('breadcrumb-child').textContent = childName;
        const contentCard = document.getElementById('contentCard');
        const contentInner = document.getElementById('contentInner');
        const marqueeContainer = document.getElementById('marqueeContainer');

        // 查找当前点击的菜单项的数据
        const parentData = menuData.find(m => m.title === parentName);
        const subData = parentData.subs.find(s => s.name === childName);

        // 逻辑1：判断是否显示滚动条（只在首页显示）
        if (parentName === '首页') {
            marqueeContainer.style.display = 'flex';
            contentInner.classList.remove('is-tool'); // 去掉工具页的特权样式
        } else {
            marqueeContainer.style.display = 'none';
            contentInner.classList.add('is-tool'); // 加上工具页的满屏样式
        }

        // 逻辑2：渲染内容
        if (parentName === '首页') {
            contentCard.innerHTML = `
                <div class="full-quote-container">
                    <div class="quote-text">${getRandomQuote()}</div>
                </div>
            `;
        } else if (subData && subData.url) {
            // 【核心逻辑】加载 iframe，且移除了原本重复的标题行
            contentCard.innerHTML = `
                <div class="iframe-wrapper">
                    <iframe src="${subData.url}" title="${childName}"></iframe>
                </div>
            `;
        } else {
            // 没有 url 的继续显示占位提示
            contentCard.innerHTML = `
                <div class="page-title" style="margin: 24px 24px 0 24px;">${parentData.icon} ${parentName} · ${childName}</div>
                <div class="placeholder-box" style="margin: 24px;">
                    <div class="p-icon">🚧</div>
                    <div class="p-title">「${childName}」工具开发中</div>
                    <div class="p-desc">牛马正在疯狂写代码，马上上线...</div>
                </div>
            `;
        }
    }

    function getRandomQuote() {
        return quotes[Math.floor(Math.random() * quotes.length)];
    }

    /* ================== 事件绑定 ================== */
    document.getElementById('collapse-btn').addEventListener('click', function () {
        document.getElementById('sidebar').classList.toggle('collapsed');
    });

    const notifyBtn = document.getElementById('notifyBtn');
    const notifyPopover = document.getElementById('notifyPopover');
    const themeBtn = document.getElementById('themeBtn');
    const themePopover = document.getElementById('themePopover');

    notifyBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        themePopover.classList.remove('show');
        notifyPopover.classList.toggle('show');
    });

    themeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        notifyPopover.classList.remove('show');
        themePopover.classList.toggle('show');
    });

    document.addEventListener('click', function (e) {
        if (!notifyPopover.contains(e.target) && e.target !== notifyBtn) {
            notifyPopover.classList.remove('show');
        }
        if (!themePopover.contains(e.target) && e.target !== themeBtn) {
            themePopover.classList.remove('show');
        }
    });

    function changeTheme(themeName, el) {
        document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
        el.classList.add('active');

        if (themeName === 'blue') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            document.documentElement.setAttribute('data-theme', themeName);
        }
    }
</script>

</body>
</html>

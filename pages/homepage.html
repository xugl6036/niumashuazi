<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>每日寄语 · 如梦令</title>
  <!-- 引入农历转换库 -->
  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.13/lunar.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'KaiTi', '华文楷体', 'STKaiti', 'Georgia', '宋体', serif;
      background-color: #f8f6f0;
    }

    /* 主容器 */
    .app {
      display: flex;
      width: 100vw;
      height: 100vh;
      padding: 1.5rem;
      gap: 1.5rem;
      background: linear-gradient(135deg, #fdfcf9 0%, #f2efe9 100%);
      position: relative;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 10% 20%, rgba(200, 180, 150, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(200, 180, 150, 0.05) 0%, transparent 40%);
      pointer-events: none;
    }

    /* 左侧名言区域 */
    .left-panel {
      flex: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 2rem 1rem 2rem 1rem;
      border: 1px solid rgba(200, 180, 160, 0.25);
      box-shadow: 0 15px 35px -15px rgba(100, 80, 60, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.8);
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .left-panel::after {
      content: "";
      position: absolute;
      inset: 1.2rem;
      border-radius: 1.5rem 0.5rem 1.5rem 0.5rem;
      border: 1px dashed rgba(180, 160, 140, 0.25);
      pointer-events: none;
    }

    .quote-container {
      max-width: 90%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.5rem; /* 行间距 */
      transform: translateY(-0.5rem);
    }

    .quote-text {
      font-size: 4rem; /* 初始大小，由 JS 接管 */
      line-height: 1.4;
      color: #2c2825; 
      text-shadow: 0 4px 15px rgba(255, 255, 255, 0.9);
      letter-spacing: 0.05em;
      font-weight: 500;
      word-break: break-word;
    }

    /* 左侧按标点切分后的行 */
    .quote-text .line {
      display: block;
    }

    /* 修改：将每日寄语移动至右下角 */
    .quote-signature {
      position: absolute;
      right: 2.5rem;
      bottom: 2.5rem;
      font-size: 1.1rem;
      color: rgba(120, 100, 80, 0.6);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      font-style: italic;
      font-family: 'Georgia', serif;
      text-align: right;
    }

    .quote-signature::before {
      content: "—— ✦ ——";
      display: block;
      margin-bottom: 0.8rem;
      color: rgba(160, 140, 120, 0.4);
      font-style: normal;
      letter-spacing: 0.2rem;
      font-size: 0.9rem;
    }

    /* 右侧卡片区域 */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      min-width: 240px;
    }

    .card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 1.5rem;
      border: 1px solid rgba(200, 180, 160, 0.25);
      box-shadow: 0 10px 25px -10px rgba(100, 80, 60, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      padding: 1.2rem 1rem;
      display: flex;
      flex-direction: column;
      color: #3a3530;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      overflow: hidden;
      position: relative;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(210, 180, 140, 0.8);
      box-shadow: 0 15px 35px -8px rgba(180, 150, 110, 0.2), 
                  0 0 0 1px rgba(210, 180, 140, 0.3), 
                  inset 0 1px 0 rgba(255, 255, 255, 1);
      background: rgba(255, 255, 255, 0.85);
    }

    .card-top { flex: 3; justify-content: flex-start; }
    .card-middle { flex: 3; justify-content: flex-start; }
    
    .card-bottom {
      flex: 4;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.45);
      border-color: rgba(200, 180, 160, 0.2);
      padding-bottom: 2rem;
    }
    .card-bottom:hover {
      border-color: rgba(210, 180, 140, 0.5);
      background: rgba(255, 255, 255, 0.65);
      transform: translateY(-2px);
    }

    .ci-title {
      font-size: 1.1rem;
      color: rgba(110, 90, 70, 0.8);
      letter-spacing: 0.2em;
      font-weight: 600;
      align-self: flex-start;
      margin-bottom: 1rem;
      padding-left: 0.2rem;
      font-family: 'KaiTi', '华文楷体', serif;
    }

    /* 诗词容器 */
    .ci-content {
      text-align: center;
      color: #2c2825;
      font-family: 'KaiTi', '华文楷体', 'STKaiti', 'Georgia', serif;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8);
      letter-spacing: 0.05em;
      width: 100%;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem; 
    }

    .card-top:hover .ci-content,
    .card-middle:hover .ci-content {
      transform: translateY(-8px);
    }

    /* 强制单行显示 */
    .ci-content .line {
      display: block;
      white-space: nowrap;
      font-size: 1.2rem; 
    }

    /* --- 右下角时间日期 --- */
    .time-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
      font-weight: bold;
    }

    .time-clock {
      font-size: clamp(2rem, 3vw, 2.8rem);
      color: #2c2825;
      letter-spacing: 0.05em;
      line-height: 1;
      margin-bottom: 3.5rem;
    }

    .date-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .time-date {
      font-size: clamp(1.1rem, 1.5vw, 1.4rem);
      color: #2c2825;
      letter-spacing: 0.05em;
      display: flex;
      align-items: baseline;
      gap: 0.3rem;
    }

    .time-lunar {
      font-size: clamp(1.1rem, 1.5vw, 1.4rem);
      color: #2c2825;
      letter-spacing: 0.08em;
    }

    /* 屏幕适配微调 */
    @media (max-width: 1000px) {
      .right-panel { min-width: 200px; }
      .time-clock { font-size: 1.8rem; margin-bottom: 2.5rem; }
      .time-date { font-size: 1rem; }
      .time-lunar { font-size: 1rem; }
      .ci-title { font-size: 1rem; padding-left: 0.4rem; }
      .card { padding: 1rem 0.5rem; }
      .ci-content { gap: 0.6rem; } 
    }

    @media (max-height: 600px) {
      .app { padding: 1rem; gap: 1rem; }
      .quote-text { font-size: 2rem; }
      .quote-signature { margin-top: 1rem; font-size: 0.9rem; }
      .ci-title { font-size: 0.9rem; margin-bottom: 0.5rem; }
      .card-bottom { padding-bottom: 1.5rem; }
      .time-clock { font-size: 1.6rem; margin-bottom: 2rem; }
      .time-date { font-size: 0.9rem; }
      .time-lunar { font-size: 0.9rem; }
      .ci-content { gap: 0.4rem; } 
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 左侧 -->
    <div class="left-panel">
      <div class="quote-container">
        <div class="quote-text" id="quoteDisplay">上善若水，水善利万物而不争。</div>
      </div>
      <div class="quote-signature">每日寄语</div>
    </div>

    <!-- 右侧 -->
    <div class="right-panel">
      <!-- 第一行 -->
      <div class="card card-top">
        <div class="ci-title">如梦令</div>
        <div class="ci-content" id="content1">
          <span class="line">常记溪亭日暮，沉醉不知归路。</span>
          <span class="line">兴尽晚回舟，误入藕花深处。</span>
          <span class="line">争渡，争渡，惊起一滩鸥鹭。</span>
        </div>
      </div>

      <!-- 第二行 -->
      <div class="card card-middle">
        <div class="ci-title">如梦令</div>
        <div class="ci-content" id="content2">
          <span class="line">昨夜雨疏风骤，浓睡不消残酒。</span>
          <span class="line">试问卷帘人，却道海棠依旧。</span>
          <span class="line">知否，知否？应是绿肥红瘦。</span>
        </div>
      </div>

      <!-- 第三行：时间与日期 -->
      <div class="card card-bottom">
        <div class="time-container">
          <div class="time-clock" id="clock">00:00:00</div>
          
          <div class="date-group">
            <div class="time-date">
              <span id="date-main">1月1日</span>
              <span id="date-week" style="font-size: 0.9em; opacity: 0.85;">周一</span>
            </div>
            <div class="time-lunar" id="lunar">农历</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      /* ================= 名言与时间逻辑 ================= */
      const quotes = [
        "我的精神状态，属于是快递公司丢件级别。",
        "别跟我讲道理，道理昨天出门迷路还没回来。",
        "如果看见我在发呆，不是安静，是 CPU 在烧开水。",
        "本人：正常外壳，里面一锅发酵糯米粥。",
        "我的人生主线任务：找个地方趴着。",
        "别预判我，我自己都预判不了下一秒干嘛。",
        "脑子已经申请长期休假，只有身体在打卡上班。",
        "别的小朋友奔赴山海，我奔赴下一顿饭。",
        "建议把我做成标本，标注：暂时还活着。",
        "情绪稳定是伪装，内心正在举办庙会。",
        "钱没存下，奇怪的知识存满硬盘。",
        "我不是困，是灵魂想提前下班。",
        "如果我突然消失，大概率是躲进表情包里了。",
        "生活对我重拳出击，我掏出一根棒棒糖反击。",
        "计划：明天好好做人；执行：继续发疯。",
        "脑袋空空，是专属我的避风港。",
        "低功耗待机，请勿频繁唤醒。",
        "允许一切发生，包括我原地长蘑菇。",
        "可爱额度已透支，现在是散装模式。",
        "正在和空气博弈，暂时没空理世界。",
        "我的烦恼轻到飘起来，但砸到我很疼。",
        "想冬眠，但是没有足够粮食，也没有洞。",
        "外表人模人样，内心是流浪野猫。",
        "不要深挖我，挖出来全是废料。",
        "人生主打一个随机触发，没有剧本。",
        "我没有摆烂，只是选择缓慢蠕动。",
        "脑子进水就算了，还在里面养鱼。",
        "如果觉得我奇怪，那是我出厂没校准。",
        "快乐偶尔到货，大部分时间在路上。",
        "不想奔赴未来，想奔赴一张软乎乎的床。",
        "我的专注力，比蒲公英还容易吹散。",
        "灵魂偷偷溜出去逛街，肉身替它坐牢。",
        "遇事不要慌，先发呆三分钟再说。",
        "别人闪闪发光，我间歇性反光。",
        "想当一块石头，不用思考 只管晒太阳。",
        "每天的任务：撑到睡觉。",
        "我的思绪乱跑，抓都抓不住。",
        "没什么远大理想，只求不饿不烦。",
        "一旦开始发呆，谁喊我都属于远程呼叫失败。",
        "我这个人，稳定性不如摇摇乐。",
        "梦想很大，但是我很懒，接不住。",
        "正在缓冲人生，请耐心等待，大概率加载失败。",
        "不要对我抱有期待，期待容易落空。",
        "内心喧嚣如菜市场，表面安静如冰柜。",
        "如果可以，我想把烦恼一键卸载。",
        "我是散装人类，随时可能散架。",
        "喜欢发呆，发呆是免费避难所。",
        "生活一团乱麻，我干脆就地躺平。",
        "偶尔正常，大部分时间处于掉线状态。",
        "如果哪天我突然通透，那一定是系统 bug。",
        "为什么不回消息？今天没上班吗",
        "你把我当做蒙古人了啊，让我蒙在鼓里",
        "真的是老母猪带胸罩，一套又一套",
        "公主请上班！",
        "苍蝇趴在玻璃窗，有光明 没前途",
        "擀面杖吹火，一窍不通",
        "癞蛤蟆爬脚面，不咬人 膈应人",
        "茶壶煮饺子，有嘴倒不出",
        "鸭子孵小鸡，白忙活",
        "水牛掉井里，有劲使不出",
        "麻雀落在牌坊上，东西不大 架子不小",
        "属手电筒的，只照别人 不照自己",
        "泥菩萨过河，自身难保",
        "竹篮打水，一场空",
        "骑驴看唱本，走着瞧",
        "墙上芦苇，头重脚轻根底浅",
        "山间竹笋，嘴尖皮厚腹中空",
        "老母鸡抱空窝，白忙活一场",
        "搬起石头砸自己的脚，自作自受",
        "吹喇叭抬轿子，捧臭脚",
        "高射炮打蚊子，大材小用",
        "断线的风筝，不知去向，管不住",
        "井底蛤蟆，没见过什么大世面",
        "秋后的蚂蚱，蹦跶不了几天",
        "黄鼠狼给鸡拜年，没安好心",
        "哑巴吃汤圆，心里有数",
        "秃子头上的虱子，明摆着",
        "兔子尾巴，长不了",
        "绣花枕头，一包草",
        "老牛追兔子，有劲使不上",
        "烂泥扶不上墙，怎么扶都不行",
        "画饼充饥，空欢喜",
        "隔靴搔痒，抓不到点子上",
        "水上浮萍，没根没底",
        "戏台子上的胡子，假的",
        "偷鸡不成，蚀把米",
        "灯草搭桥，白费劲儿",
        "狗咬吕洞宾，不识好人心",
        "纸糊的老虎，外强中干",
        "驼子跌跟头，两头不着实",
        "黑夜里走独木桥，瞎闯",
        "螃蟹过街，横行霸道",
        "温水煮青蛙，慢慢遭殃",
        "庙里的和尚，无牵无挂",
        "拿鸡毛当令箭，小题大做",
        "冰糖煮黄连，同甘共苦",
        "旱地里的田螺，硬撑",
        "石磨子压手，实打实瞎折腾",
        "鹦鹉学舌，人云亦云",
        "稻草人救火，自身难保",
        "筛子盛水，漏洞百出",
        "毛驴拉磨，原地打转",
        "晴天打伞，多此一举",
        "坛子里头捉乌龟，手到擒来"
      ];

      const randomIndex = Math.floor(Math.random() * quotes.length);
      document.getElementById('quoteDisplay').textContent = quotes[randomIndex];

      // ---------- 时间日期逻辑 ----------
      const clockEl = document.getElementById('clock');
      const dateMainEl = document.getElementById('date-main');
      const dateWeekEl = document.getElementById('date-week');
      const lunarEl = document.getElementById('lunar');
      const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

      function updateTime() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        clockEl.textContent = `${h}:${m}:${s}`;

        const month = now.getMonth() + 1;
        const day = now.getDate();
        const weekDay = weekDays[now.getDay()];
        dateMainEl.textContent = `${month}月${day}日`;
        dateWeekEl.textContent = weekDay;

        if (window.Lunar) {
          try {
            const lunar = Lunar.fromDate(now);
            lunarEl.textContent = `${lunar.getYearInGanZhi()}年${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
          } catch (e) {
            lunarEl.textContent = "农历获取失败";
          }
        } else {
          lunarEl.textContent = "农历加载中...";
        }
      }

      updateTime();
      setInterval(updateTime, 1000);


      /* ================= 核心：文字大小自适应缩放 & 标点断句 ================= */
      
      // 1. 专门处理左侧长句：智能根据标点断行
      function processLeftQuote() {
        const quoteEl = document.getElementById('quoteDisplay');
        const text = quoteEl.textContent.trim();
        
        // 使用正则匹配，按所有常见标点进行切分（保留标点）
        // 比如：“不要深挖我，挖出来全是废料。” 会被分为 ["不要深挖我，", "挖出来全是废料。"]
        const segments = text.split(/(?<=[，。！？；：、,.!?;:])/).filter(s => s.trim().length > 0);
        
        // 如果切分后有多行，则生成 span 并应用块级样式
        if (segments.length > 1) {
          quoteEl.innerHTML = '';
          segments.forEach(seg => {
            const span = document.createElement('span');
            span.className = 'line';
            span.textContent = seg.trim();
            quoteEl.appendChild(span);
          });
        } else {
          // 如果没切分，也强制加个类，方便统一样式
          quoteEl.innerHTML = `<span class="line">${text}</span>`;
        }
      }

      // 2. 专门处理左侧的缩放（确保不溢出，且字号最大化）
      function fitLeftTextToContainer() {
        const quoteEl = document.getElementById('quoteDisplay');
        if (!quoteEl) return;
        
        const lines = quoteEl.querySelectorAll('.line');
        if (lines.length === 0) return;

        // 重置为最大字号以便测量
        lines.forEach(line => line.style.fontSize = '100px');

        // 获取左侧面板内容的实际可用宽度
        const containerWidth = quoteEl.clientWidth; 
        
        let minRatio = 1;

        lines.forEach(line => {
          const lineWidth = line.getBoundingClientRect().width;
          // 计算当前行宽度相对于可用宽度的比例
          const ratio = containerWidth / lineWidth;
          if (ratio < minRatio) {
            minRatio = ratio;
          }
        });

        // 计算最终字号
        let finalSize = 100 * minRatio;
        
        // 限制字号范围（左侧主视觉，字号可以大一点）
        finalSize = Math.max(16, Math.min(finalSize, 80)); 

        // 应用字号
        lines.forEach(line => {
          line.style.fontSize = finalSize + 'px';
        });
      }

      // 3. 原有的右侧文字拆分逻辑（针对词句太长的微调）
      function splitTextByPunctuation(text) {
        const regex = /[^，。！？；：、,.!?;:]+[，。！？；：、,.!?;:]?/g;
        const matches = text.match(regex);
        if (!matches) return [text];
        const result = [];
        let buffer = "";
        const maxLen = 12; 
        for (let i = 0; i < matches.length; i++) {
          const part = matches[i];
          if (buffer.length + part.length > maxLen && buffer.length > 0) {
            result.push(buffer.trim());
            buffer = part;
          } else {
            buffer += part;
          }
        }
        if (buffer.trim()) result.push(buffer.trim());
        return result;
      }

      function processRightLines() {
        const contents = [document.getElementById('content1'), document.getElementById('content2')];
        contents.forEach(contentDiv => {
          if (!contentDiv) return;
          const originalLines = Array.from(contentDiv.querySelectorAll('.line'));
          originalLines.forEach(line => {
            const text = line.textContent.trim();
            const segments = splitTextByPunctuation(text);
            if (segments.length > 1) {
              const fragment = document.createDocumentFragment();
              segments.forEach(seg => {
                const span = document.createElement('span');
                span.className = 'line';
                span.textContent = seg;
                fragment.appendChild(span);
              });
              line.parentNode.replaceChild(fragment, line);
            }
          });
        });
      }

      // 4. 原有的右侧缩放逻辑
      function fitRightTextToContainer() {
        const contents = [document.getElementById('content1'), document.getElementById('content2')];
        contents.forEach(contentDiv => {
          if (!contentDiv) return;
          const lines = contentDiv.querySelectorAll('.line');
          if (lines.length === 0) return;
          lines.forEach(line => line.style.fontSize = '100px');
          const containerWidth = contentDiv.clientWidth - 16; 
          let minRatio = 1; 
          lines.forEach(line => {
            const lineWidth = line.getBoundingClientRect().width;
            const ratio = containerWidth / lineWidth;
            if (ratio < minRatio) minRatio = ratio;
          });
          let finalSize = 100 * minRatio;
          finalSize = Math.max(9, Math.min(finalSize, 22)); 
          lines.forEach(line => {
            line.style.fontSize = finalSize + 'px';
          });
        });
      }

      // ================= 统一初始化 =================
      function initAll() {
        processLeftQuote(); // 左侧智能标点断句
        processRightLines(); // 右侧断句
        
        fitLeftTextToContainer(); // 左侧自适应字号
        fitRightTextToContainer(); // 右侧自适应字号
      }

      window.addEventListener('load', initAll);
      window.addEventListener('resize', () => {
        fitLeftTextToContainer();
        fitRightTextToContainer();
      });

      setTimeout(initAll, 100);
      setTimeout(initAll, 500);

      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
          fitLeftTextToContainer();
          fitRightTextToContainer();
        });
        ro.observe(document.querySelector('.left-panel'));
        ro.observe(document.querySelector('.right-panel'));
      }

    })();
  </script>
</body>
</html>

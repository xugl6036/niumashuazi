<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主机厂安装规范查询工具</title>
    <!-- 引入 SheetJS 库用于解析 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f6f9;
            --card-bg: #ffffff;
            --primary-color: #3b82f6;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            background-color: var(--bg-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .main-container {
            display: flex;
            flex: 1;
            gap: 20px;
            overflow: hidden;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* 左侧区域 */
        .left-panel {
            flex: 6;
        }

        /* 头部工具栏 */
        .left-header {
            display: flex;
            align-items: center;
            padding: 10px 20px 0;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* 搜索框样式 */
        .search-box {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 12px;
            width: 280px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
            position: relative;
        }
        .search-box:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }
        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: var(--text-main);
            background: transparent;
            padding-right: 20px;
        }
        /* 清空按钮 X */
        .clear-btn {
            position: absolute;
            right: 10px;
            cursor: pointer;
            color: #9ca3af;
            display: none;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
        }
        .clear-btn:hover {
            color: #4b5563;
        }

        /* 导航标签 */
        .nav-tabs {
            display: flex;
            flex: 1;
            margin-bottom: -1px;
        }
        .nav-item {
            padding: 12px 16px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            user-select: none;
            white-space: nowrap;
        }
        .nav-item.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            font-weight: 500;
        }

        /* 左侧内容区：内部滚动 */
        .left-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
            background-color: #fff;
            overflow-y: auto;
        }

        /* 矩阵式结果展示 */
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .result-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            word-break: break-all;
        }
        .result-card:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 提示信息/空状态 */
        .empty-tip {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            font-size: 15px;
            text-align: center;
            line-height: 1.6;
        }

        /* 右侧区域 */
        .right-panel {
            flex: 4;
        }
        .right-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
        }
        .right-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }
        .right-header-actions {
            display: flex;
            gap: 6px;
        }
        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-btn:hover {
            background-color: #e5e7eb;
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .preview-area {
            flex: 1;
            padding: 20px;
            background: #fafbfc;
            overflow-y: auto;
        }

        /* ========== 弹窗样式 ========== */
        .modal-mask {
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-wrap {
            background: #fff;
            border-radius: 12px;
            width: 420px;
            max-width: 90vw;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-title {
            font-weight: 600;
            font-size: 16px;
        }
        .modal-close {
            border: none;
            background: transparent;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .modal-body {
            padding: 20px;
            line-height: 1.7;
            color: var(--text-main);
        }
        .modal-body p {
            margin-bottom: 16px;
            color: var(--text-secondary);
        }
        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border-color);
            text-align: right;
        }
        .btn-primary {
            padding: 8px 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        /* 隐藏原生input */
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- 左侧功能区 -->
        <div class="card left-panel">
            <!-- 头部：搜索 + 标签 -->
            <div class="left-header">
                <!-- 全局模糊搜索框 -->
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="模糊搜索线缆品牌、漏保规格..." autocomplete="off">
                    <button class="clear-btn" id="clearSearch" title="清空">✕</button>
                </div>

                <!-- 标签栏 -->
                <div class="nav-tabs" id="navTabs">
                    <div class="nav-item active" data-type="all">全部</div>
                    <div class="nav-item" data-type="主机厂">主机厂</div>
                    <div class="nav-item" data-type="平台">平台</div>
                    <div class="nav-item" data-type="线缆品牌">线缆品牌</div>
                </div>
            </div>

            <!-- 左侧内容区 -->
            <div class="left-content">
                <div class="empty-tip" id="emptyTip">数据加载中...</div>
                <div class="result-grid" id="resultGrid" style="display: none;"></div>
            </div>
        </div>

        <!-- 右侧预览区 -->
        <div class="card right-panel">
            <div class="right-header">
                <div class="right-title">主机厂安装规范</div>
                <div class="right-header-actions">
                    <!-- 齿轮设置按钮 -->
                    <button class="icon-btn" id="settingBtn" title="设置 / 选择数据文件">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                    <!-- 新窗口按钮 -->
                    <button class="icon-btn" id="newWindowBtn" title="在新窗口打开">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="preview-area"></div>
        </div>

    </div>

    <!-- ========== 设置弹窗 ========== -->
    <div class="modal-mask" id="modalMask">
        <div class="modal-wrap">
            <div class="modal-header">
                <div class="modal-title">数据设置</div>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div class="modal-body">
                <p>当前显示内置快照：本地双击打开或在线预览时浏览器不允许自动读取同目录文件。<br>查看最新数据请选择Excel文件，或部署到 Pages。</p>
                <input type="file" id="fileInput" accept=".xlsx,.xls">
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="selectFileBtn">选择 Excel 文件</button>
            </div>
        </div>
    </div>

    <script>
        // --- 全局变量 ---
        let tableRows = []; // 原始二维数组
        let allData = [];   // 所有数据列表（用于全局搜索）
        let currentNavType = 'all';
        let currentSearchKeyword = '';

        // --- DOM 元素 ---
        const emptyTip = document.getElementById('emptyTip');
        const resultGrid = document.getElementById('resultGrid');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearch');
        const navItems = document.querySelectorAll('.nav-item');

        // 弹窗DOM
        const modalMask = document.getElementById('modalMask');
        const modalClose = document.getElementById('modalClose');
        const settingBtn = document.getElementById('settingBtn');
        const selectFileBtn = document.getElementById('selectFileBtn');
        const fileInput = document.getElementById('fileInput');
        const newWindowBtn = document.getElementById('newWindowBtn');

        // 弹窗控制
        function openModal() {
            modalMask.style.display = 'flex';
        }
        function closeModal() {
            modalMask.style.display = 'none';
        }
        settingBtn.addEventListener('click', openModal);
        modalClose.addEventListener('click', closeModal);
        modalMask.addEventListener('click', (e)=>{
            if(e.target === modalMask) closeModal();
        })
        selectFileBtn.addEventListener('click', ()=>{
            fileInput.click();
        })
        fileInput.addEventListener('change', async (e)=>{
            const file = e.target.files[0];
            if(!file) return;
            const buffer = await file.arrayBuffer();
            const wb = XLSX.read(buffer, {type:'array'});
            const ws = wb.Sheets[wb.SheetNames[0]];
            tableRows = XLSX.utils.sheet_to_json(ws, {header:1});
            buildSearchData(tableRows);
            renderResults();
            closeModal();
        })
        newWindowBtn.addEventListener('click', ()=>{
            window.open(window.location.href, '_blank', 'width=1000,height=800,menubar=no,toolbar=no');
        })

        // --- 核心逻辑：解析 Excel ---
        async function loadExcelData() {
            let filePath = '../data/oem-sop.xlsx';

            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error('文件获取失败');

                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                // header: 1 表示将每行作为数组返回
                tableRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                buildSearchData(tableRows);
                showWelcomeMessage();

            } catch (error) {
                console.error('读取 Excel 失败:', error);
                emptyTip.innerHTML = `<span style="color:#ef4444">数据加载失败。</span><br><br>
                点击右侧齿轮按钮选择本地Excel文件加载数据`;
            }
        }

        // --- 构建搜索用的长文本数据 ---
        function buildSearchData(rows) {
            allData = [];
            // 获取主机厂行 (第4行，索引为 3)
            const oemRow = rows[3] || [];

            for (let col = 1; col < oemRow.length; col++) {
                let textPieces = [];
                for (let r = 0; r < rows.length; r++) {
                    if (rows[r] && rows[r][col]) {
                        textPieces.push(rows[r][col].toString().trim());
                    }
                }
                allData.push(textPieces.join(' ').toLowerCase());
            }
        }

        // --- 提取各维度的数据 ---

        // 提取指定行，去重并过滤空值
        function extractColumnData(rows, rowIndex) {
            const rowData = rows[rowIndex] || [];
            const set = new Set();
            for (let i = 1; i < rowData.length; i++) {
                if (rowData[i] && rowData[i].toString().trim() !== '') {
                    set.add(rowData[i].toString().trim());
                }
            }
            return Array.from(set);
        }

        // 提取线缆品牌并智能拆分
        function extractCableBrands(rows) {
            // 查找"线缆品牌"所在的行号
            let brandRowIndex = -1;
            for (let r = 0; r < rows.length; r++) {
                if (rows[r] && rows[r][0] && rows[r][0].toString().trim() === '线缆品牌') {
                    brandRowIndex = r;
                    break;
                }
            }
            if (brandRowIndex === -1) return [];

            const brandRow = rows[brandRowIndex];
            const brands = new Set();

            // 正则匹配中文、英文标点及空格进行切分
            const splitRegex = /[\s,，、;；\n/()（）]+/;

            for (let i = 1; i < brandRow.length; i++) {
                if (brandRow[i]) {
                    let text = brandRow[i].toString().trim();
                    let parts = text.split(splitRegex);

                    parts.forEach(p => {
                        let cleanP = p.trim();
                        if (cleanP.length > 0 &&
                            cleanP.length < 15 &&
                            !cleanP.includes('如果') &&
                            !cleanP.includes('需要') &&
                            !cleanP.includes('报备') &&
                            !cleanP.includes('白名单') &&
                            !cleanP.includes('建议') &&
                            !cleanP.includes('优选') &&
                            !cleanP.includes('使用')
                        ) {
                            brands.add(cleanP);
                        }
                    });
                }
            }
            return Array.from(brands);
        }

        // --- 渲染逻辑 ---
        function showWelcomeMessage() {
            emptyTip.style.display = 'flex';
            resultGrid.style.display = 'none';
            emptyTip.innerHTML = `欢迎使用桩企规范查询工具<br><br>可以模糊搜索线缆品牌、漏保规格型号等...`;
        }

        function renderResults() {
            // 如果是全部标签，且没有搜索词，显示欢迎语
            if (currentNavType === 'all' && !currentSearchKeyword) {
                showWelcomeMessage();
                return;
            }

            emptyTip.style.display = 'none';
            resultGrid.style.display = 'grid';
            resultGrid.innerHTML = '';

            // 1. 如果是全局模糊搜索
            if (currentSearchKeyword) {
                let matchedNames = [];

                if (currentNavType === 'all') {
                    // 在【主机厂】列表中搜索匹配的列
                    const oemRow = tableRows[3] || []; // 主机厂在第4行(索引3)
                    allData.forEach((fullText, index) => {
                        if (fullText.includes(currentSearchKeyword)) {
                            if (oemRow[index + 1]) {
                                matchedNames.push(oemRow[index + 1].toString().trim());
                            }
                        }
                    });
                } else if (currentNavType === '主机厂') {
                    // 只在主机厂名字里搜
                    let list = extractColumnData(tableRows, 3);
                    matchedNames = list.filter(name => name.toLowerCase().includes(currentSearchKeyword));
                } else if (currentNavType === '平台') {
                    // 只在平台名字里搜
                    let list = extractColumnData(tableRows, 2);
                    matchedNames = list.filter(name => name.toLowerCase().includes(currentSearchKeyword));
                } else if (currentNavType === '线缆品牌') {
                    // 只在提取出的线缆品牌里搜
                    let list = extractCableBrands(tableRows);
                    matchedNames = list.filter(name => name.toLowerCase().includes(currentSearchKeyword));
                }

                const uniqueNames = [...new Set(matchedNames)];
                renderGrid(uniqueNames, '未找到匹配的主机厂/品牌');

            } else {
                // 2. 如果是纯标签点击（无搜索词）
                let list = [];
                if (currentNavType === '主机厂') {
                    list = extractColumnData(tableRows, 3); // 第4行
                } else if (currentNavType === '平台') {
                    list = extractColumnData(tableRows, 2); // 第3行
                } else if (currentNavType === '线缆品牌') {
                    list = extractCableBrands(tableRows);
                }

                renderGrid(list, '暂无数据');
            }
        }

        function renderGrid(items, emptyText) {
            if (items.length === 0) {
                resultGrid.innerHTML = `<div class="empty-tip" style="grid-column: 1/-1; height: 200px;">${emptyText}</div>`;
                return;
            }

            items.forEach(name => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.textContent = name;
                resultGrid.appendChild(card);
            });
        }

        // --- 事件监听 ---
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();

            if (val.length > 0) {
                clearBtn.style.display = 'flex';
            } else {
                clearBtn.style.display = 'none';
            }

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentSearchKeyword = val.toLowerCase();
                renderResults();
            }, 300);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            currentSearchKeyword = '';
            renderResults();
            searchInput.focus();
        });

        navItems.forEach(item => {
            item.addEventListener('click', function () {
                navItems.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
                currentNavType = this.getAttribute('data-type');
                renderResults();
            });
        });

        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadExcelData, 100);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 图片处理工具 · 牛马刷子工具合集</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #e9edf2;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .app-card {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      padding: 1rem 1.5rem 1.5rem;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.2rem;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    h1 span {
      background: linear-gradient(135deg, #4f46e5, #c026d3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
    }

    .standalone-btn {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }
    .standalone-btn:hover {
      background: #f8fafc;
      border-color: #a78bfa;
      color: #4f46e5;
    }
    .standalone-btn svg {
      width: 1rem;
      height: 1rem;
      stroke: currentColor;
    }

    .subhead {
      color: #475569;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      border-left: 4px solid #a78bfa;
      padding-left: 0.8rem;
      flex-shrink: 0;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.5rem;
      flex: 1;
      min-height: 0;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* 移除独立上传区域，集成到预览面板 */
    .preview-panel {
      background: #ffffffd9;
      border-radius: 1rem;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .canvas-wrapper {
      background: #f1f5f9;
      border-radius: 0.75rem;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      border: 2px dashed #cbd5e1;
      margin-bottom: 0.5rem;
      flex: 1;
      min-height: 0;
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
    }

    .canvas-wrapper.dragover {
      border-color: #8b5cf6;
      background: #f5f3ff;
    }

    /* 隐藏文件输入 */
    #fileInput { display: none; }

    #imageCanvas {
      max-width: 100%;
      max-height: 100%;
      display: block;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    /* 空白占位提示 */
    .placeholder-message {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: #94a3b8;
      padding: 1rem;
      text-align: center;
      pointer-events: none; /* 让点击穿透到 wrapper */
    }
    .placeholder-message svg {
      width: 3rem;
      height: 3rem;
    }

    .preview-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .hint-inline {
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .action-buttons {
      display: flex;
      gap: 0.6rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s;
      background: white;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    .btn-primary {
      background: #4f46e5;
      color: white;
      border: 1px solid #4f46e5;
      box-shadow: 0 4px 12px -4px #4f46e5;
    }
    .btn-primary:hover { background: #6366f1; transform: scale(1.02); }
    .btn-secondary:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .btn-danger { background: #fee2e2; border-color: #fecaca; color: #b91c1c; }
    .btn-danger:hover { background: #fecaca; }
    .btn:disabled { opacity: 0.45; pointer-events: none; filter: grayscale(0.5); }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      padding-right: 0.5rem;
      min-height: 0;
    }

    .control-panel::-webkit-scrollbar { width: 6px; }
    .control-panel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    .section-card {
      background: #ffffffd9;
      border-radius: 1rem;
      padding: 0 1.25rem 1.25rem 1.25rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0 0.5rem 0;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      color: #1e293b;
      font-size: 0.95rem;
    }
    .section-header:hover { color: #4f46e5; }

    .section-header .chevron {
      width: 1.2rem;
      height: 1.2rem;
      transition: transform 0.3s ease;
      stroke: #64748b;
    }
    .section-card.collapsed .chevron { transform: rotate(-90deg); }

    .section-content {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      padding-top: 0.2rem;
      transition: max-height 0.3s ease, opacity 0.2s ease;
      max-height: 1200px;
      opacity: 1;
      overflow: hidden;
    }
    .section-card.collapsed .section-content {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      margin-top: 0;
      pointer-events: none;
    }

    .crop-group, .direction-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .crop-btn, .dir-btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 40px;
      padding: 0.4rem 0.8rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s;
      flex: 1 1 auto;
      text-align: center;
      white-space: nowrap;
    }
    .crop-btn:hover, .dir-btn:hover {
      background: #eef2ff;
      border-color: #a78bfa;
      color: #4f46e5;
    }
    .crop-btn.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }

    .filter-section { display: flex; flex-direction: column; gap: 0.8rem; }
    .slider-item { display: flex; flex-direction: column; gap: 0.2rem; }
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1e293b;
    }
    .slider-value {
      color: #4f46e5;
      background: #eef2ff;
      padding: 0.1rem 0.4rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      height: 5px;
      background: #e2e8f0;
      border-radius: 10px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #4f46e5;
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(79, 70, 229, 0.4);
      cursor: pointer;
    }

    .presets { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .preset-btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 40px;
      padding: 0.3rem 0.6rem;
      font-size: 0.7rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      flex: 1 0 auto;
      text-align: center;
    }
    .preset-btn:hover { background: #eef2ff; border-color: #a78bfa; color: #4f46e5; }

    /* 减肥增重 模块 */
    .size-info-grid {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      background: #f8fafc;
      padding: 0.6rem 0.8rem;
      border-radius: 0.75rem;
      border: 1px solid #e2e8f0;
      font-size: 0.8rem;
      color: #1e293b;
      margin-bottom: 0.4rem;
    }
    .size-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .size-info-label {
      color: #475569;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .size-info-value {
      font-weight: 600;
      background: #eef2ff;
      padding: 0.1rem 0.6rem;
      border-radius: 40px;
      color: #4f46e5;
      font-size: 0.75rem;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 状态栏长驻 */
    .size-status-text {
      font-size: 0.75rem;
      color: #4f46e5;
      background: #eef2ff;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 0.6rem;
      font-weight: 500;
      min-height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .size-buttons {
      display: flex;
      gap: 0.6rem;
    }
    .size-btn {
      flex: 1;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 40px;
      padding: 0.6rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .size-btn:hover:not(:disabled) {
      background: #eef2ff;
      border-color: #a78bfa;
      color: #4f46e5;
      transform: scale(1.01);
    }
    .size-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(0.6);
    }
    .size-btn .arrow-icon { font-size: 0.9rem; }

    @media (max-width: 900px) {
      .editor-grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-card">
    <div class="header-row">
      <h1><span>✨ 图片处理</span> 工具</h1>
      <button class="standalone-btn" id="standaloneBtn" title="在新窗口打开，免受界面刷新干扰">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        在独立窗口中打开
      </button>
    </div>
    <div class="subhead">纯前端工具，本地化操作。牛马刷子工具合集   ©️ XUGL6036   @ Github</div>

    <div class="editor-grid">
      <div class="left-panel">
        <!-- 预览面板集成上传区域 -->
        <div class="preview-panel">
          <div class="canvas-wrapper" id="canvasWrapper">
            <!-- 空白占位，点击或拖拽触发上传 -->
            <div class="placeholder-message" id="placeholderMsg">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="2" y="2" width="20" height="20" rx="3" />
                <circle cx="8.5" cy="8.5" r="1.5" fill="#cbd5e1" stroke="none" />
                <path d="M21 15L16 10L5 21" />
              </svg>
              <span>点击选择图片，或将图片拖拽到此处</span>
            </div>
            <canvas id="imageCanvas" style="display: none;"></canvas>
          </div>

          <div class="preview-footer">
            <div class="hint-inline">
              <span id="fileNameDisplay" style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">未选择文件</span>
            </div>
            <div class="action-buttons">
              <button class="btn btn-danger" id="clearBtn">清空</button>
              <button class="btn btn-secondary" id="resetBtn">重置</button>
              <button class="btn btn-secondary" id="copyBtn" disabled>复制</button>
              <button class="btn btn-primary" id="downloadBtn" disabled>下载</button>
            </div>
          </div>
        </div>

        <!-- 隐藏的文件输入 -->
        <input type="file" id="fileInput" accept="image/*">
      </div>

      <!-- 右侧控制面板 -->
      <div class="control-panel">
        <!-- 滤镜调整 -->
        <div class="section-card" id="filterSection">
          <div class="section-header" data-target="filter">
            <span>🎨 滤镜调整</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9" /></svg>
          </div>
          <div class="section-content">
            <div class="filter-section">
              <div class="slider-item"><div class="slider-header"><span>☀️ 亮度</span><span class="slider-value" id="brightnessVal">100%</span></div><input type="range" id="brightness" min="0" max="200" value="100"></div>
              <div class="slider-item"><div class="slider-header"><span>⚡ 对比度</span><span class="slider-value" id="contrastVal">100%</span></div><input type="range" id="contrast" min="0" max="200" value="100"></div>
              <div class="slider-item"><div class="slider-header"><span>🎨 饱和度</span><span class="slider-value" id="saturateVal">100%</span></div><input type="range" id="saturate" min="0" max="200" value="100"></div>
              <div class="slider-item"><div class="slider-header"><span>🌫️ 模糊</span><span class="slider-value" id="blurVal">0px</span></div><input type="range" id="blur" min="0" max="15" value="0" step="0.5"></div>
              <div class="slider-item"><div class="slider-header"><span>⬛ 灰度</span><span class="slider-value" id="grayscaleVal">0%</span></div><input type="range" id="grayscale" min="0" max="100" value="0"></div>
            </div>
            <div style="margin-top: 0.5rem;">
              <div style="font-size: 0.8rem; font-weight: 500; color: #475569; margin-bottom: 0.3rem;">⚡ 快速预设</div>
              <div class="presets">
                <button class="preset-btn" data-preset="original">原图</button>
                <button class="preset-btn" data-preset="vintage">复古</button>
                <button class="preset-btn" data-preset="bright">明亮</button>
                <button class="preset-btn" data-preset="cool">冷调</button>
                <button class="preset-btn" data-preset="bw">黑白</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 基础调整 -->
        <div class="section-card collapsed" id="basicSection">
          <div class="section-header" data-target="basic">
            <span>✂️ 基础调整</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9" /></svg>
          </div>
          <div class="section-content">
            <div style="font-size: 0.8rem; font-weight: 500; color: #475569;">裁剪比例</div>
            <div class="crop-group">
              <button class="crop-btn active" data-crop="free">自由拖拽</button>
              <button class="crop-btn" data-crop="square">正方形</button>
              <button class="crop-btn" data-crop="4:3">4:3 横</button>
              <button class="crop-btn" data-crop="3:4">3:4 竖</button>
            </div>

            <div style="font-size: 0.8rem; font-weight: 500; color: #475569; margin-top: 0.5rem;">方向</div>
            <div class="direction-group">
              <button class="dir-btn" data-dir="left">↺ 左转90°</button>
              <button class="dir-btn" data-dir="right">↻ 右转90°</button>
              <button class="dir-btn" data-dir="mirror-h">⇋ 左右镜像</button>
              <button class="dir-btn" data-dir="mirror-v">⇅ 上下镜像</button>
            </div>
          </div>
        </div>

        <!-- 减肥增重 -->
        <div class="section-card collapsed" id="sizeSection">
          <div class="section-header" data-target="size">
            <span>⚖️ 减肥增重</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9" /></svg>
          </div>
          <div class="section-content">
            <div class="size-info-grid" id="sizeInfoGrid">
              <div class="size-info-row">
                <span class="size-info-label">📐 尺寸</span>
                <span class="size-info-value" id="infoDimensions">—</span>
              </div>
              <div class="size-info-row">
                <span class="size-info-label">📦 文件大小</span>
                <span class="size-info-value" id="infoFileSize">—</span>
              </div>
              <div class="size-info-row">
                <span class="size-info-label">🖼️ 当前画布</span>
                <span class="size-info-value" id="infoCanvasSize">—</span>
              </div>
            </div>

            <!-- 状态栏长驻 -->
            <div class="size-status-text" id="sizeStatusText">等待操作...</div>

            <div class="size-buttons">
              <button class="size-btn" id="decreaseSizeBtn" disabled>
                <span class="arrow-icon">⬇️</span> 减小字节
              </button>
              <button class="size-btn" id="increaseSizeBtn" disabled>
                <span class="arrow-icon">⬆️</span> 增加字节
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // DOM
      const fileInput = document.getElementById('fileInput');
      const fileNameDisplay = document.getElementById('fileNameDisplay');
      const canvas = document.getElementById('imageCanvas');
      const ctx = canvas.getContext('2d');
      const placeholderMsg = document.getElementById('placeholderMsg');
      const canvasWrapper = document.getElementById('canvasWrapper');

      const sliders = {
        brightness: document.getElementById('brightness'),
        contrast: document.getElementById('contrast'),
        saturate: document.getElementById('saturate'),
        blur: document.getElementById('blur'),
        grayscale: document.getElementById('grayscale')
      };
      const valLabels = {
        brightness: document.getElementById('brightnessVal'),
        contrast: document.getElementById('contrastVal'),
        saturate: document.getElementById('saturateVal'),
        blur: document.getElementById('blurVal'),
        grayscale: document.getElementById('grayscaleVal')
      };

      const resetBtn = document.getElementById('resetBtn');
      const clearBtn = document.getElementById('clearBtn');
      const copyBtn = document.getElementById('copyBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const standaloneBtn = document.getElementById('standaloneBtn');
      const presetBtns = document.querySelectorAll('.preset-btn');
      const cropBtns = document.querySelectorAll('.crop-btn');
      const dirBtns = document.querySelectorAll('.dir-btn');
      const sectionHeaders = document.querySelectorAll('.section-header');
      const sectionCards = document.querySelectorAll('.section-card');

      const infoDimensions = document.getElementById('infoDimensions');
      const infoFileSize = document.getElementById('infoFileSize');
      const infoCanvasSize = document.getElementById('infoCanvasSize');
      const decreaseSizeBtn = document.getElementById('decreaseSizeBtn');
      const increaseSizeBtn = document.getElementById('increaseSizeBtn');
      const sizeStatusText = document.getElementById('sizeStatusText');

      // State
      let originalImage = null;
      let currentImageLoaded = false;
      let currentCrop = 'free';
      let rotationAngle = 0;
      let flipH = false;
      let flipV = false;

      let isDragging = false;
      let startX = 0, startY = 0;
      let currentX = 0, currentY = 0;
      let manualCropRect = null;

      let currentFileSizeBytes = 0;
      let currentMimeType = 'image/png';

      const KB = 1024;
      const MB = 1024 * 1024;
      const MIN_SIZE_BYTES = 50 * KB;
      const MAX_SIZE_BYTES = 5 * MB;

      function formatFileSize(bytes) {
        if (bytes === 0 || bytes === undefined || bytes === null) return '—';
        if (bytes < KB) return bytes + ' B';
        if (bytes < MB) return (bytes / KB).toFixed(1) + ' KB';
        return (bytes / MB).toFixed(2) + ' MB';
      }

      let lastCanvasDataURLSize = 0;

      function getDataURLSize(dataURL) {
        const base64 = dataURL.split(',')[1];
        if (!base64) return 0;
        return Math.floor(base64.length * 3 / 4);
      }

      function updateSizePanelInfo() {
        if (originalImage) {
          infoDimensions.textContent = `${originalImage.width} × ${originalImage.height}`;
        } else {
          infoDimensions.textContent = '—';
        }

        if (currentImageLoaded && canvas.width > 0) {
          infoCanvasSize.textContent = `${canvas.width} × ${canvas.height}`;
        } else {
          infoCanvasSize.textContent = '—';
        }

        infoFileSize.textContent = formatFileSize(currentFileSizeBytes);

        if (!currentImageLoaded || canvas.width === 0 || !lastCanvasDataURLSize) {
          decreaseSizeBtn.disabled = true;
          increaseSizeBtn.disabled = true;
          return;
        }

        const size = lastCanvasDataURLSize;
        decreaseSizeBtn.disabled = size < MIN_SIZE_BYTES;
        increaseSizeBtn.disabled = size > MAX_SIZE_BYTES;
      }

      function refreshCanvasSizeMetric() {
        if (!currentImageLoaded || canvas.width === 0) {
          lastCanvasDataURLSize = 0;
          updateSizePanelInfo();
          return;
        }
        try {
          const dataURL = canvas.toDataURL('image/png');
          lastCanvasDataURLSize = getDataURLSize(dataURL);
        } catch (e) {
          lastCanvasDataURLSize = 0;
        }
        updateSizePanelInfo();
      }

      function render() {
        if (!currentImageLoaded || !originalImage) return;

        const w = originalImage.width;
        const h = originalImage.height;
        const rad = (rotationAngle * Math.PI) / 180;
        const absCos = Math.abs(Math.cos(rad));
        const absSin = Math.abs(Math.sin(rad));
        const rotatedW = Math.round(w * absCos + h * absSin);
        const rotatedH = Math.round(w * absSin + h * absCos);

        const temp = document.createElement('canvas');
        temp.width = rotatedW;
        temp.height = rotatedH;
        const tctx = temp.getContext('2d');

        tctx.save();
        tctx.translate(rotatedW / 2, rotatedH / 2);
        tctx.rotate(rad);
        tctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
        tctx.drawImage(originalImage, -w / 2, -h / 2, w, h);
        tctx.restore();

        let finalCropW = rotatedW, finalCropH = rotatedH, finalCropX = 0, finalCropY = 0;

        if (currentCrop === 'free') {
          if (manualCropRect) {
            finalCropX = manualCropRect.x * rotatedW;
            finalCropY = manualCropRect.y * rotatedH;
            finalCropW = manualCropRect.w * rotatedW;
            finalCropH = manualCropRect.h * rotatedH;
            if (finalCropW < 1) finalCropW = 1;
            if (finalCropH < 1) finalCropH = 1;
          } else {
            finalCropW = rotatedW;
            finalCropH = rotatedH;
          }
        } else if (currentCrop === 'square') {
          const size = Math.min(rotatedW, rotatedH);
          finalCropW = finalCropH = size;
          finalCropX = (rotatedW - size) / 2;
          finalCropY = (rotatedH - size) / 2;
        } else if (currentCrop === '4:3') {
          const ratio = 4 / 3;
          if (rotatedW / rotatedH > ratio) {
            finalCropW = rotatedH * ratio;
            finalCropH = rotatedH;
            finalCropX = (rotatedW - finalCropW) / 2;
          } else {
            finalCropW = rotatedW;
            finalCropH = rotatedW / ratio;
            finalCropY = (rotatedH - finalCropH) / 2;
          }
        } else if (currentCrop === '3:4') {
          const ratio = 3 / 4;
          if (rotatedW / rotatedH > ratio) {
            finalCropW = rotatedH * ratio;
            finalCropH = rotatedH;
            finalCropX = (rotatedW - finalCropW) / 2;
          } else {
            finalCropW = rotatedW;
            finalCropH = rotatedW / ratio;
            finalCropY = (rotatedH - finalCropH) / 2;
          }
        }

        canvas.width = Math.round(finalCropW);
        canvas.height = Math.round(finalCropH);
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.filter = getFilterString();
        ctx.drawImage(
          temp, 
          finalCropX, finalCropY, finalCropW, finalCropH, 
          0, 0, canvas.width, canvas.height
        );
        ctx.filter = 'none';

        canvas.style.display = 'block';
        placeholderMsg.style.display = 'none';
        downloadBtn.disabled = false;
        copyBtn.disabled = false;

        setTimeout(() => {
          refreshCanvasSizeMetric();
        }, 0);
      }

      let renderTimeout = null;
      function requestRender() {
        if (renderTimeout) cancelAnimationFrame(renderTimeout);
        renderTimeout = requestAnimationFrame(() => render());
      }

      function updateSliderLabels() {
        valLabels.brightness.textContent = sliders.brightness.value + '%';
        valLabels.contrast.textContent = sliders.contrast.value + '%';
        valLabels.saturate.textContent = sliders.saturate.value + '%';
        valLabels.blur.textContent = parseFloat(sliders.blur.value).toFixed(1) + 'px';
        valLabels.grayscale.textContent = sliders.grayscale.value + '%';
      }

      function getFilterString() {
        const b = sliders.brightness.value / 100;
        const c = sliders.contrast.value / 100;
        const s = sliders.saturate.value / 100;
        const bl = sliders.blur.value;
        const g = sliders.grayscale.value / 100;
        return `brightness(${b}) contrast(${c}) saturate(${s}) blur(${bl}px) grayscale(${g})`;
      }

      function getRelativePos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let x = (clientX - rect.left) / rect.width;
        let y = (clientY - rect.top) / rect.height;
        return {
          x: Math.max(0, Math.min(1, x)),
          y: Math.max(0, Math.min(1, y))
        };
      }

      function onPointerDown(e) {
        if (currentCrop !== 'free' || !currentImageLoaded) return;
        e.preventDefault();
        isDragging = true;
        const pos = getRelativePos(e);
        startX = pos.x; startY = pos.y;
        currentX = pos.x; currentY = pos.y;
        manualCropRect = null;
      }

      function onPointerMove(e) {
        if (!isDragging || currentCrop !== 'free') return;
        e.preventDefault();
        const pos = getRelativePos(e);
        currentX = pos.x; currentY = pos.y;
        const x1 = Math.min(startX, currentX);
        const y1 = Math.min(startY, currentY);
        const w = Math.abs(currentX - startX);
        const h = Math.abs(currentY - startY);
        if (w > 0.01 && h > 0.01) {
          manualCropRect = { x: x1, y: y1, w: w, h: h };
        }
        requestRender();
      }

      function onPointerUp() {
        if (!isDragging) return;
        isDragging = false;
        if (manualCropRect && (manualCropRect.w < 0.01 || manualCropRect.h < 0.01)) {          manualCropRect = null;
        }
        requestRender();
      }

      // 将拖拽监听绑定到 canvas（仅在已有图片时生效）
      canvas.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);
      canvas.addEventListener('touchstart', onPointerDown, { passive: false });
      window.addEventListener('touchmove', onPointerMove, { passive: false });
      window.addEventListener('touchend', onPointerUp);

      // 基础操作
      function resetFilters() {
        sliders.brightness.value = 100;
        sliders.contrast.value = 100;
        sliders.saturate.value = 100;
        sliders.blur.value = 0;
        sliders.grayscale.value = 0;
        updateSliderLabels();
      }

      function resetTransform() {
        rotationAngle = 0;
        flipH = false;
        flipV = false;
        currentCrop = 'free';
        manualCropRect = null;
        cropBtns.forEach(b => b.classList.toggle('active', b.dataset.crop === 'free'));
      }

      function fullReset() {
        resetFilters();
        resetTransform();
        requestRender();
      }

      function clearImage() {
        originalImage = null;
        currentImageLoaded = false;
        canvas.style.display = 'none';
        placeholderMsg.style.display = 'flex';
        fileNameDisplay.textContent = '未选择文件';
        downloadBtn.disabled = true;
        copyBtn.disabled = true;
        manualCropRect = null;
        currentFileSizeBytes = 0;
        lastCanvasDataURLSize = 0;
        sizeStatusText.textContent = '等待操作...'; // 重置为初始状态
        resetFilters();
        resetTransform();
        fileInput.value = '';
        updateSizePanelInfo();
      }

      function onImageLoad(img) {
        originalImage = img;
        currentImageLoaded = true;
        resetFilters();
        resetTransform();
        sizeStatusText.textContent = '等待操作...'; // 新图片重置状态
        requestRender();
      }

      function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) {
          alert('请选择有效的图片文件');
          return;
        }
        fileNameDisplay.textContent = file.name.length > 32 ? file.name.slice(0, 30) + '…' : file.name;
        currentFileSizeBytes = file.size;   // 记录原始文件大小
        currentMimeType = file.type || 'image/png';
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => onImageLoad(img);
          img.onerror = () => alert('图片加载失败');
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      // 上传相关：集成在预览框的点击与拖拽
      canvasWrapper.addEventListener('click', (e) => {
        // 如果还没有图片，点击预览区可触发文件选择
        if (!currentImageLoaded) {
          fileInput.click();
        }
      });

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
      });

      canvasWrapper.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!currentImageLoaded) {
          canvasWrapper.classList.add('dragover');
        }
      });
      canvasWrapper.addEventListener('dragleave', () => canvasWrapper.classList.remove('dragover'));
      canvasWrapper.addEventListener('drop', (e) => {
        e.preventDefault();
        canvasWrapper.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
      });

      Object.values(sliders).forEach(s => {
        s.addEventListener('input', () => {
          updateSliderLabels();
          requestRender();
        });
      });

      resetBtn.addEventListener('click', fullReset);
      clearBtn.addEventListener('click', clearImage);

      // 独立窗口打开
      standaloneBtn.addEventListener('click', () => {
        window.open(window.location.href, '_blank', 'width=1400,height=900,menubar=no,toolbar=no,location=no,status=no');
      });

      // 复制图片至剪贴板
      copyBtn.addEventListener('click', async () => {
        if (!currentImageLoaded) return;
        try {
          if (navigator.clipboard && window.ClipboardItem) {
            canvas.toBlob(async (blob) => {
              try {
                const item = new ClipboardItem({ 'image/png': blob });
                await navigator.clipboard.write([item]);
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ 已复制';
                setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
              } catch (err) {
                fallbackCopyToClipboard();
              }
            }, 'image/png');
          } else {
            fallbackCopyToClipboard();
          }
        } catch (e) {
          fallbackCopyToClipboard();
        }

        function fallbackCopyToClipboard() {
          try {
            canvas.toBlob((blob) => {
              const item = new ClipboardItem({ [blob.type]: blob });
              navigator.clipboard.write([item]).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ 已复制';
                setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
              }).catch(() => {
                alert('当前浏览器不支持直接复制图片，请使用下载按钮保存。');
              });
            });
          } catch (e) {
            alert('当前浏览器不支持直接复制图片，请使用下载按钮保存。');
          }
        }
      });

      // 下载
      downloadBtn.addEventListener('click', () => {
        if (!currentImageLoaded) return;
        try {
          const dataURL = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = `processed_${Date.now()}.png`;
          link.href = dataURL;
          link.click();
        } catch (e) { alert('导出图片失败'); }
      });

      // 预设
      const presets = {
        original: { brightness: 100, contrast: 100, saturate: 100, blur: 0, grayscale: 0 },
        vintage:  { brightness: 90,  contrast: 110, saturate: 70,  blur: 0.5, grayscale: 15 },
        bright:   { brightness: 130, contrast: 105, saturate: 110, blur: 0, grayscale: 0 },
        cool:     { brightness: 105, contrast: 95,  saturate: 120, blur: 0, grayscale: 5 },
        bw:       { brightness: 100, contrast: 120, saturate: 0,   blur: 0, grayscale: 100 }
      };

      presetBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const preset = presets[btn.dataset.preset];
          if (!preset) return;
          sliders.brightness.value = preset.brightness;
          sliders.contrast.value = preset.contrast;
          sliders.saturate.value = preset.saturate;
          sliders.blur.value = preset.blur;
          sliders.grayscale.value = preset.grayscale;
          updateSliderLabels();
          requestRender();
        });
      });

      // 裁剪模式切换
      cropBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          if (!currentImageLoaded) return;
          currentCrop = btn.dataset.crop;
          cropBtns.forEach(b => b.classList.toggle('active', b === btn));
          if (currentCrop !== 'free') {
            manualCropRect = null;
          }
          requestRender();
        });
      });

      // 方向变换
      dirBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          if (!currentImageLoaded) return;
          const dir = btn.dataset.dir;
          if (dir === 'left') rotationAngle = (rotationAngle + 270) % 360;
          else if (dir === 'right') rotationAngle = (rotationAngle + 90) % 360;
          else if (dir === 'mirror-h') flipH = !flipH;
          else if (dir === 'mirror-v') flipV = !flipV;
          
          if (dir !== 'mirror-h' && dir !== 'mirror-v') {
             manualCropRect = null;
          }
          requestRender();
        });
      });

      // 折叠面板互斥
      sectionHeaders.forEach(header => {
        header.addEventListener('click', () => {
          const currentCard = header.closest('.section-card');
          const isCurrentlyCollapsed = currentCard.classList.contains('collapsed');

          if (!isCurrentlyCollapsed) {
            currentCard.classList.add('collapsed');
          } else {
            sectionCards.forEach(card => card.classList.add('collapsed'));
            currentCard.classList.remove('collapsed');
          }
        });
      });

      // =============== 减肥增重 功能实现 ===============
      // isIncrease: true 增加字节, false 减小字节
      function adjustImageSize(isIncrease) {
        if (!currentImageLoaded || canvas.width === 0) return;

        let dataURL;
        try {
          if (isIncrease) {
            // 增加字节：放大15%尺寸，使用最高质量 JPEG 导出
            const scale = 1.15;
            const newW = Math.max(1, Math.round(canvas.width * scale));
            const newH = Math.max(1, Math.round(canvas.height * scale));
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = newW;
            tempCanvas.height = newH;
            const tctx = tempCanvas.getContext('2d');
            tctx.drawImage(canvas, 0, 0, newW, newH);
            dataURL = tempCanvas.toDataURL('image/jpeg', 1.0);
          } else {
            // 减小字节：降低 JPEG 质量
            let quality = 0.7;
            dataURL = canvas.toDataURL('image/jpeg', quality);
            let size = getDataURLSize(dataURL);
            
            if (size > MIN_SIZE_BYTES * 2) {
              quality = 0.5;
              dataURL = canvas.toDataURL('image/jpeg', quality);
            }
            if (getDataURLSize(dataURL) > MIN_SIZE_BYTES * 1.5) {
              quality = 0.35;
              dataURL = canvas.toDataURL('image/jpeg', quality);
            }
          }
        } catch (e) {
          console.warn('调整大小失败', e);
          return;
        }

        const oldSize = lastCanvasDataURLSize;
        const newSize = getDataURLSize(dataURL);
        const sizeDiff = Math.abs(newSize - oldSize);
        const diffStr = formatFileSize(sizeDiff);

        const img = new Image();
        img.onload = () => {
          resetFilters();
          resetTransform();
          originalImage = img;
          currentImageLoaded = true;
          currentFileSizeBytes = newSize;
          
          requestRender();
          
          setTimeout(() => {
            refreshCanvasSizeMetric();
            updateSizePanelInfo();
            
            if (isIncrease) {
              sizeStatusText.textContent = `✅ 已增加字节，当前大小 ${formatFileSize(newSize)} (+${diffStr})`;
            } else {
              sizeStatusText.textContent = `✅ 已减小字节，当前大小 ${formatFileSize(newSize)} (-${diffStr})`;
            }
          }, 50);
        };
        img.onerror = () => alert('调整大小失败，请重试');
        img.src = dataURL;
      }

      decreaseSizeBtn.addEventListener('click', () => {
        // 如果大于 5MB，首次点击直接减小至 5MB
        if (lastCanvasDataURLSize > MAX_SIZE_BYTES) {
          let quality = 1.0;
          // 逐步降低质量直到低于 5MB
          let tempDataURL = canvas.toDataURL('image/jpeg', quality);
          while (getDataURLSize(tempDataURL) > MAX_SIZE_BYTES && quality > 0.1) {
            quality -= 0.1;
            tempDataURL = canvas.toDataURL('image/jpeg', quality);
          }
          if (getDataURLSize(tempDataURL) > MAX_SIZE_BYTES) {
            // 如果降到最低还是超过，缩放尺寸至 0.8
            const scale = 0.8;
            const newW = Math.max(1, Math.round(canvas.width * scale));
            const newH = Math.max(1, Math.round(canvas.height * scale));
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = newW;
            tempCanvas.height = newH;
            const tctx = tempCanvas.getContext('2d');
            tctx.drawImage(canvas, 0, 0, newW, newH);
            tempDataURL = tempCanvas.toDataURL('image/jpeg', 0.5);
          }
          const newSize = getDataURLSize(tempDataURL);
          const oldSize = lastCanvasDataURLSize;
          const img = new Image();
          img.onload = () => {
            resetFilters();
            resetTransform();
            originalImage = img;
            currentImageLoaded = true;
            currentFileSizeBytes = newSize;
            requestRender();
            setTimeout(() => {
              refreshCanvasSizeMetric();
              updateSizePanelInfo();
              sizeStatusText.textContent = `✅ 已减小字节，当前大小 ${formatFileSize(newSize)} (-${formatFileSize(oldSize - newSize)})`;
            }, 50);
          };
          img.src = tempDataURL;
        } else {
          adjustImageSize(false);
        }
      });

      increaseSizeBtn.addEventListener('click', () => {
        // 如果小于 50KB，首次点击直接增加至 50KB
        if (lastCanvasDataURLSize < MIN_SIZE_BYTES) {
          const target = MIN_SIZE_BYTES;
          // 先放大尺寸至合适比例
          let scale = 1.5;
          let tempCanvas = document.createElement('canvas');
          let tempDataURL = '';
          let size = 0;
          // 循环尝试直到达到目标大小
          for (let i = 0; i < 5; i++) {
            tempCanvas.width = Math.max(1, Math.round(canvas.width * scale));
            tempCanvas.height = Math.max(1, Math.round(canvas.height * scale));
            const tctx = tempCanvas.getContext('2d');
            tctx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
            tempDataURL = tempCanvas.toDataURL('image/jpeg', 1.0);
            size = getDataURLSize(tempDataURL);
            if (size >= target) break;
            scale *= 1.3;
          }
          const oldSize = lastCanvasDataURLSize;
          const img = new Image();
          img.onload = () => {
            resetFilters();
            resetTransform();
            originalImage = img;
            currentImageLoaded = true;
            currentFileSizeBytes = size;
            requestRender();
            setTimeout(() => {
              refreshCanvasSizeMetric();
              updateSizePanelInfo();
              sizeStatusText.textContent = `✅ 已增加字节，当前大小 ${formatFileSize(size)} (+${formatFileSize(size - oldSize)})`;
            }, 50);
          };
          img.src = tempDataURL;
        } else {
          adjustImageSize(true);
        }
      });

      // 初始化
      updateSliderLabels();
      canvas.style.display = 'none';
      placeholderMsg.style.display = 'flex';
      downloadBtn.disabled = true;
      copyBtn.disabled = true;
      updateSizePanelInfo();
    })();
  </script>
</body>
</html>

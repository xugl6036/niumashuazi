<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇 · 多重难度</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(145deg, #1e2b2f 0%, #0f1a1e 100%);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .game-wrapper {
      background: #1f2e33;
      padding: 24px 24px 30px;
      border-radius: 40px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.7), inset 0 1px 4px rgba(255, 255, 255, 0.08);
      border: 1px solid #2f4147;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .score-box {
      background: #0b1316;
      padding: 8px 20px;
      border-radius: 60px;
      color: #b7e4c7;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 1px;
      box-shadow: inset 0 2px 5px #00000055, 0 4px 6px #00000033;
      border: 1px solid #2a4a3a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .score-box span {
      color: #f0f7e6;
      font-size: 0.9rem;
      font-weight: 400;
      opacity: 0.8;
    }
    .difficulty-panel {
      display: flex;
      gap: 8px;
      background: #0b1316;
      padding: 6px;
      border-radius: 60px;
      box-shadow: inset 0 2px 5px #00000055;
      border: 1px solid #2d4148;
    }
    .difficulty-btn {
      background: transparent;
      border: none;
      color: #9bb8b0;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .difficulty-btn.active {
      background: #38a169;
      color: #f0f7e6;
      box-shadow: 0 4px 8px #1e3b2a, inset 0 1px 2px #b7e4c7;
      transform: scale(1.02);
    }
    .difficulty-btn:hover:not(.active) {
      background: #2a3e42;
      color: #d0e6df;
    }
    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 28px;
      background: #0e181c;
      box-shadow: inset 0 0 0 2px #253b3f, 0 18px 25px -8px black;
      width: 100%;
      height: auto;
      max-width: 500px;
      aspect-ratio: 1 / 1;
    }
    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      color: #9cb8b0;
      font-size: 0.9rem;
      padding: 0 6px;
    }
    .speed-indicator {
      background: #0b1316;
      padding: 6px 16px;
      border-radius: 60px;
      font-weight: 600;
      color: #c0dfd1;
      border: 1px solid #2a4a3a;
    }
    .action-btn {
      background: #2d4148;
      border: none;
      color: #d0e6df;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 60px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 4px 0 #0d171b, 0 6px 10px black;
      border: 1px solid #3e5a62;
      min-width: 140px;
    }
    .action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0d171b, 0 6px 10px black;
    }
    .overlay-message {
      position: absolute;
      background: #0b1316dd;
      backdrop-filter: blur(4px);
      border-radius: 30px;
      padding: 16px 32px;
      font-weight: 700;
      color: #f0e6d0;
      font-size: 1.6rem;
      letter-spacing: 1px;
      text-align: center;
      pointer-events: none;
      border: 1px solid #468a6e;
      box-shadow: 0 12px 20px black;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .canvas-container {
      position: relative;
      display: flex;
      justify-content: center;
    }
    .overlay-message.show {
      opacity: 1;
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <div class="score-box">
      <span>🍎</span> <span id="scoreDisplay">0</span>
    </div>
    <div class="difficulty-panel">
      <button class="difficulty-btn active" data-diff="easy">简单</button>
      <button class="difficulty-btn" data-diff="medium">中等</button>
      <button class="difficulty-btn" data-diff="hard">困难</button>
      <button class="difficulty-btn" data-diff="extreme">极限</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div id="overlayMsg" class="overlay-message">游戏结束</div>
  </div>

  <div class="info-bar">
    <div class="speed-indicator" id="speedDisplay">速度: 慢</div>
    <button class="action-btn" id="actionButton">▶ 开始游戏</button>
  </div>
</div>

<script>
  (function() {
    // ---------- 难度配置 (已整体降低速度) ----------
    const DIFFICULTY = {
      easy:    { label: '简单',  gridSize: 20, initialSpeed: 280, minSpeed: 200, speedStep: 4 },
      medium:  { label: '中等',  gridSize: 20, initialSpeed: 230, minSpeed: 150, speedStep: 5 },
      hard:    { label: '困难',  gridSize: 20, initialSpeed: 180, minSpeed: 110, speedStep: 6 },
      extreme: { label: '极限',  gridSize: 20, initialSpeed: 130, minSpeed: 80,  speedStep: 7 }
    };

    // ---------- DOM 元素 ----------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const overlayMsg = document.getElementById('overlayMsg');
    const difficultyButtons = document.querySelectorAll('.difficulty-btn');
    const actionButton = document.getElementById('actionButton');

    // ---------- 游戏常量 ----------
    const GRID_SIZE = 20;
    const CELL_SIZE = canvas.width / GRID_SIZE;

    // ---------- 游戏状态变量 ----------
    let snake = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 8, y: 10 };
    let score = 0;
    let gameOver = false;
    let gameRunning = false;      // 正在运行且未暂停
    let isPaused = false;         // 是否暂停
    let winFlag = false;

    // 速度控制
    let currentSpeed = 280;
    let gameInterval = null;

    // 当前难度配置
    let currentDiff = 'easy';
    let diffConfig = DIFFICULTY.easy;

    // 防止在同一个 tick 内多次转向
    let directionChangedThisTick = false;

    // ---------- 辅助函数 ----------
    // 重置游戏状态 (保留难度) —— 不自动开始, 等待用户点击“开始游戏”
    function resetGame(keepOverlay = false) {
      // 清除旧循环
      if (gameInterval) {
        clearInterval(gameInterval);
        gameInterval = null;
      }

      // 重置蛇 (长度4，水平放置)
      snake = [
        { x: 9, y: 10 },
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      directionChangedThisTick = false;

      score = 0;
      updateScore();

      // 游戏状态
      gameOver = false;
      winFlag = false;
      gameRunning = false;
      isPaused = false;

      currentSpeed = diffConfig.initialSpeed;
      updateSpeedDisplay();

      generateFood();
      draw();

      if (!keepOverlay) {
        overlayMsg.classList.remove('show');
      }

      // 按钮文字改为“开始游戏”
      actionButton.textContent = '▶ 开始游戏';
    }

    // 开始游戏 (从静止状态或重新开始)
    function startGame() {
      if (gameRunning) return;          // 已经在运行
      if (gameOver) {
        resetGame();
      }

      gameRunning = true;
      gameOver = false;
      winFlag = false;
      isPaused = false;
      overlayMsg.classList.remove('show');

      // 更新按钮文字为“暂停”
      actionButton.textContent = '⏸ 暂停';

      // 启动/重启循环
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        if (gameRunning && !gameOver && !isPaused) {
          gameTick();
        }
      }, currentSpeed);
    }

    // 暂停/继续切换
    function togglePause() {
      if (!gameRunning || gameOver) return;

      if (isPaused) {
        // 继续
        isPaused = false;
        actionButton.textContent = '⏸ 暂停';
        overlayMsg.classList.remove('show');
        // 重新设置循环
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(() => {
          if (gameRunning && !gameOver && !isPaused) {
            gameTick();
          }
        }, currentSpeed);
      } else {
        // 暂停
        isPaused = true;
        actionButton.textContent = '▶ 继续';
        // 显示暂停覆盖层
        overlayMsg.textContent = '⏸ 已暂停';
        overlayMsg.classList.add('show');
        // 清除循环
        if (gameInterval) {
          clearInterval(gameInterval);
          gameInterval = null;
        }
        draw(); // 重绘以显示覆盖层
      }
    }

    // 每次游戏逻辑更新 (一步)
    function gameTick() {
      if (gameOver || !gameRunning || isPaused) return;

      direction = { ...nextDirection };
      directionChangedThisTick = false;

      const head = snake[0];
      const newHead = {
        x: head.x + direction.x,
        y: head.y + direction.y
      };

      const isEating = (newHead.x === food.x && newHead.y === food.y);

      let newSnake;
      if (isEating) {
        newSnake = [newHead, ...snake];
      } else {
        newSnake = [newHead, ...snake.slice(0, -1)];
      }

      // 碰撞检测
      const headCollision = 
        newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE ||
        newSnake.slice(1).some(segment => segment.x === newHead.x && segment.y === newHead.y);

      if (headCollision) {
        gameOver = true;
        gameRunning = false;
        isPaused = false;
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = null;
        overlayMsg.textContent = '💀 游戏结束 💀';
        overlayMsg.classList.add('show');
        actionButton.textContent = '▶ 开始游戏';
        draw();
        return;
      }

      snake = newSnake;

      if (isEating) {
        score++;
        updateScore();

        if (currentSpeed > diffConfig.minSpeed) {
          currentSpeed = Math.max(diffConfig.minSpeed, currentSpeed - diffConfig.speedStep);
          updateSpeedDisplay();
          if (gameInterval) {
            clearInterval(gameInterval);
            gameInterval = setInterval(() => {
              if (gameRunning && !gameOver && !isPaused) gameTick();
            }, currentSpeed);
          }
        }

        if (snake.length >= GRID_SIZE * GRID_SIZE) {
          winFlag = true;
          gameRunning = false;
          gameOver = true;
          isPaused = false;
          if (gameInterval) clearInterval(gameInterval);
          gameInterval = null;
          overlayMsg.textContent = '🎉 你赢了！ 🎉';
          overlayMsg.classList.add('show');
          actionButton.textContent = '▶ 开始游戏';
          draw();
          return;
        }

        generateFood();
      }

      draw();
    }

    // 生成食物 (随机位置，且不在蛇身上)
    function generateFood() {
      const totalCells = GRID_SIZE * GRID_SIZE;
      if (snake.length >= totalCells) return;

      const snakeSet = new Set(snake.map(s => `${s.x},${s.y}`));
      let freeCells = [];
      if (totalCells - snake.length < 200) {
        for (let i = 0; i < GRID_SIZE; i++) {
          for (let j = 0; j < GRID_SIZE; j++) {
            if (!snakeSet.has(`${i},${j}`)) {
              freeCells.push({ x: i, y: j });
            }
          }
        }
        if (freeCells.length === 0) return;
        const rand = Math.floor(Math.random() * freeCells.length);
        food = freeCells[rand];
      } else {
        let attempts = 0;
        let maxAttempts = 1000;
        let found = false;
        while (attempts < maxAttempts) {
          const randX = Math.floor(Math.random() * GRID_SIZE);
          const randY = Math.floor(Math.random() * GRID_SIZE);
          if (!snakeSet.has(`${randX},${randY}`)) {
            food = { x: randX, y: randY };
            found = true;
            break;
          }
          attempts++;
        }
        if (!found) {
          for (let i = 0; i < GRID_SIZE; i++) {
            for (let j = 0; j < GRID_SIZE; j++) {
              if (!snakeSet.has(`${i},${j}`)) {
                food = { x: i, y: j };
                return;
              }
            }
          }
        }
      }
    }

    function updateScore() {
      scoreSpan.textContent = score;
    }

    function updateSpeedDisplay() {
      let speedText = '';
      if (currentSpeed >= 250) speedText = '极慢';
      else if (currentSpeed >= 200) speedText = '慢';
      else if (currentSpeed >= 160) speedText = '中';
      else if (currentSpeed >= 120) speedText = '快';
      else speedText = '极快';
      speedDisplay.textContent = `速度: ${speedText} (${currentSpeed}ms)`;
    }

    // ---------- 绘制 ----------
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 网格线
      ctx.strokeStyle = '#1e353b';
      ctx.lineWidth = 0.8;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
      }

      // 食物
      ctx.shadowColor = '#f5b042';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#f5b042';
      ctx.beginPath();
      const fx = food.x * CELL_SIZE + CELL_SIZE / 2;
      const fy = food.y * CELL_SIZE + CELL_SIZE / 2;
      ctx.arc(fx, fy, CELL_SIZE * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 6;
      ctx.fillStyle = '#ffd966';
      ctx.beginPath();
      ctx.arc(fx, fy, CELL_SIZE * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 蛇
      for (let i = 0; i < snake.length; i++) {
        const seg = snake[i];
        const x = seg.x * CELL_SIZE;
        const y = seg.y * CELL_SIZE;
        const radius = 6;

        if (i === 0) {
          ctx.fillStyle = '#78e08f';
          ctx.shadowColor = '#78e08f';
          ctx.shadowBlur = 15;
        } else {
          const ratio = i / snake.length;
          const g = Math.floor(150 + 80 * (1 - ratio));
          ctx.fillStyle = `rgb(40, ${g}, 80)`;
          ctx.shadowColor = '#3a9b5a';
          ctx.shadowBlur = 8;
        }

        ctx.beginPath();
        ctx.roundRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, radius);
        ctx.fill();

        // 眼睛
        if (i === 0) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          const eyeSize = CELL_SIZE * 0.15;
          const eyeOffset = CELL_SIZE * 0.2;
          let leftEyeX, leftEyeY, rightEyeX, rightEyeY;
          if (direction.x === 1) {
            leftEyeX = x + CELL_SIZE - eyeOffset * 1.2;
            leftEyeY = y + CELL_SIZE * 0.35;
            rightEyeX = x + CELL_SIZE - eyeOffset * 1.2;
            rightEyeY = y + CELL_SIZE * 0.65;
          } else if (direction.x === -1) {
            leftEyeX = x + eyeOffset * 1.2;
            leftEyeY = y + CELL_SIZE * 0.35;
            rightEyeX = x + eyeOffset * 1.2;
            rightEyeY = y + CELL_SIZE * 0.65;
          } else if (direction.y === -1) {
            leftEyeX = x + CELL_SIZE * 0.35;
            leftEyeY = y + eyeOffset * 1.2;
            rightEyeX = x + CELL_SIZE * 0.65;
            rightEyeY = y + eyeOffset * 1.2;
          } else {
            leftEyeX = x + CELL_SIZE * 0.35;
            leftEyeY = y + CELL_SIZE - eyeOffset * 1.2;
            rightEyeX = x + CELL_SIZE * 0.65;
            rightEyeY = y + CELL_SIZE - eyeOffset * 1.2;
          }
          ctx.beginPath();
          ctx.arc(leftEyeX, leftEyeY, eyeSize, 0, 2 * Math.PI);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(rightEyeX, rightEyeY, eyeSize, 0, 2 * Math.PI);
          ctx.fill();

          ctx.fillStyle = '#0e181c';
          const pupilSize = eyeSize * 0.6;
          ctx.beginPath();
          ctx.arc(leftEyeX, leftEyeY, pupilSize, 0, 2 * Math.PI);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(rightEyeX, rightEyeY, pupilSize, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
      ctx.shadowBlur = 0;

      // 如果游戏结束或暂停，叠加暗色
      if (gameOver || isPaused) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      return this;
    };

    // ---------- 键盘控制 ----------
    function handleKeydown(e) {
      const key = e.key;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'W', 'a', 'A', 's', 'S', 'd', 'D'].includes(key)) {
        e.preventDefault();
      }

      // 如果游戏未运行或暂停或结束，不允许改变方向
      if (!gameRunning || gameOver || isPaused) return;

      let desiredDir = null;
      if (key === 'ArrowUp' || key === 'w' || key === 'W') desiredDir = { x: 0, y: -1 };
      else if (key === 'ArrowDown' || key === 's' || key === 'S') desiredDir = { x: 0, y: 1 };
      else if (key === 'ArrowLeft' || key === 'a' || key === 'A') desiredDir = { x: -1, y: 0 };
      else if (key === 'ArrowRight' || key === 'd' || key === 'D') desiredDir = { x: 1, y: 0 };
      else return;

      if (direction.x === -desiredDir.x && direction.y === -desiredDir.y) return;
      if (directionChangedThisTick) return;

      nextDirection = desiredDir;
      directionChangedThisTick = true;
    }

    // ---------- 切换难度 ----------
    function setDifficulty(level) {
      if (!DIFFICULTY[level]) return;
      currentDiff = level;
      diffConfig = DIFFICULTY[level];

      difficultyButtons.forEach(btn => {
        if (btn.dataset.diff === level) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      resetGame();
    }

    // ---------- 事件绑定 ----------
    window.addEventListener('keydown', handleKeydown);

    difficultyButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        setDifficulty(btn.dataset.diff);
      });
    });

    // 主操作按钮: 开始 / 暂停 / 继续 / 重新开始
    actionButton.addEventListener('click', () => {
      if (gameOver) {
        // 游戏结束：重置并开始新游戏
        resetGame();
        startGame();
      } else if (gameRunning) {
        // 游戏进行中：切换暂停/继续
        togglePause();
      } else {
        // 未开始：开始游戏
        startGame();
      }
    });

    // 触摸防止缩放
    canvas.addEventListener('touchstart', (e) => e.preventDefault());

    // ---------- 初始化 ----------
    function init() {
      diffConfig = DIFFICULTY.easy;
      currentDiff = 'easy';
      difficultyButtons.forEach(btn => {
        if (btn.dataset.diff === 'easy') btn.classList.add('active');
        else btn.classList.remove('active');
      });

      resetGame();
    }

    init();

  })();
</script>
</body>
</html>

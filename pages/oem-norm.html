<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主机厂安装规范查询工具</title>
    <script src="https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f6f9;
            --card-bg: #ffffff;
            --primary-color: #3b82f6;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --soft-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            color: var(--text-main);
        }

        .main-container {
            display: flex;
            flex: 1;
            gap: 20px;
            overflow: hidden;
            min-height: 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* 左侧区域 */
        .left-panel { flex: 6; min-width: 0; }

        .left-header {
            display: flex;
            align-items: center;
            padding: 10px 20px 0;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
            gap: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 12px;
            width: 280px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
            position: relative;
        }
        .search-box:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }
        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: var(--text-main);
            background: transparent;
            padding-right: 20px;
        }
        .clear-btn {
            position: absolute;
            right: 10px;
            cursor: pointer;
            color: #9ca3af;
            display: none;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
        }
        .clear-btn:hover { color: #4b5563; }

        .nav-tabs {
            display: flex;
            flex: 1;
            margin-bottom: -1px;
            flex-wrap: wrap;
        }
        .nav-item {
            padding: 12px 16px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            user-select: none;
            white-space: nowrap;
        }
        .nav-item.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            font-weight: 500;
        }

        .notice {
            display: none;
            align-items: center;
            gap: 10px;
            margin: 12px 20px 0;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            line-height: 1.55;
            background: #f4f7fd;
            border: 1px solid #dde6f7;
            color: #31538f;
        }
        .notice.info { display: flex; }
        .notice.err { display: flex; background: #fff7ed; border-color: #fed7aa; color: #9a4b00; }
        .notice button {
            flex: 0 0 auto;
            border: 1px solid var(--border-color);
            background: #fff;
            color: var(--text-secondary);
            padding: 5px 11px;
            border-radius: 8px;
            font-size: 12.5px;
            cursor: pointer;
        }
        .notice button:hover { border-color: #c9d5e6; color: var(--text-main); }

        .left-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
            background-color: #fff;
            overflow-y: auto;
            min-height: 0;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            align-content: start;
        }
        .result-card {
            background: var(--soft-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .result-card:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .result-card.active {
            background: #eff6ff;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .result-card .card-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            word-break: break-all;
        }
        .result-card.active .card-title { color: var(--primary-color); }
        .result-card .card-sub {
            margin-top: 5px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            word-break: break-all;
        }

        .empty-tip {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 100%;
            color: var(--text-secondary);
            font-size: 15px;
            text-align: center;
            line-height: 1.6;
            padding: 20px;
        }
        .empty-tip .pick-btn {
            border: 1px solid var(--border-color);
            background: #fff;
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 9px;
            font-size: 13px;
            cursor: pointer;
        }
        .empty-tip .pick-btn:hover { background: #f0f6ff; }

        /* 右侧区域 */
        .right-panel { flex: 4; min-width: 0; }
        .right-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
        }
        .right-title { font-size: 16px; font-weight: 600; }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-btn:hover {
            background-color: #e5e7eb;
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .preview-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafbfc;
        }

        .detail-head {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .detail-name { font-size: 19px; font-weight: 650; }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            background: #eaf1fe;
            color: #1a56bd;
        }
        .badge.count { background: #f2f5f9; color: var(--text-secondary); }

        .record-block {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .block-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .block-oem { font-size: 15px; font-weight: 600; }
        .block-plat {
            font-size: 12px;
            color: var(--text-secondary);
            background: #f2f5f9;
            border-radius: 7px;
            padding: 2px 9px;
        }

        .kv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px 18px;
            margin-bottom: 12px;
        }
        .kv-item { font-size: 12.5px; }
        .kv-item b {
            display: block;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 11.5px;
            letter-spacing: .3px;
            margin-bottom: 2px;
        }
        .kv-item span { color: var(--text-main); font-weight: 500; }

        .chips-title {
            font-size: 11.5px;
            color: var(--text-secondary);
            letter-spacing: .3px;
            margin-bottom: 8px;
        }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip {
            display: inline-flex;
            align-items: center;
            background: #eaf1fe;
            color: #1a56bd;
            border-radius: 8px;
            padding: 3px 10px;
            font-size: 12px;
            font-weight: 500;
        }
        .chip.empty { background: #f2f5f9; color: var(--text-secondary); font-weight: 400; }

        mark { background: #ffe9a8; color: inherit; padding: 0 1px; border-radius: 2px; }

        @media (max-width: 900px) {
            body { padding: 12px; }
            .main-container { flex-direction: column; overflow: visible; }
            .left-panel, .right-panel { min-height: 320px; }
            .search-box { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- 左侧功能区 -->
        <div class="card left-panel">
            <div class="left-header">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="模糊搜索主机厂、平台、漏保/线缆品牌..." autocomplete="off">
                    <button class="clear-btn" id="clearSearch" title="清空">✕</button>
                </div>
                <div class="nav-tabs" id="navTabs">

            <div class="notice" id="notice">

            <div class="preview-area" id="previewArea"></div>

    </div>

                    if (!res.ok) continue;
                    const buf = await res.arrayBuffer();
                    if (!buf || buf.byteLength < 1000) continue;
                    parseWorkbook(buf, path);
                    notice.className = 'notice';
                    return;
                } catch (e) { /* 继续尝试下一个路径 */ }
            }
            if (EMBEDDED_DATA && EMBEDDED_DATA.fields && EMBEDDED_DATA.rows) {
                applyData(EMBEDDED_DATA.fields,
                    EMBEDDED_DATA.rows.map(r => Object.assign({}, r, { __brands: (r.__brands || []).slice() })),
                    "内置快照", "embedded");
                showNotice("info", "当前显示内置快照：本地双击打开或在线预览时浏览器不允许自动读取同目录文件。查看最新数据请点右侧「选择 Excel 文件」，或部署到 Pages。");
            } else {
                showNotice("err", "没能读取到 Excel 数据，请点击按钮手动选择文件。");
            }
        }

        function readFile(file) {
            const fr = new FileReader();
            fr.onload = e => {
                try {
                    parseWorkbook(e.target.result, file.name);
                    notice.className = 'notice';
                } catch (err) {
                    alert("解析失败：" + err.message);
                }
            };
            fr.readAsArrayBuffer(file);
        }

        pickBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => {
            const f = e.target.files && e.target.files[0];
            if (f) readFile(f);
        });

        /* ================= 初始化 ================= */
        document.addEventListener('DOMContentLoaded', () => {
            autoLoad().then(() => {
                restoreFromHash();
                render();
            });
        });
    </script>
</body>
</html>

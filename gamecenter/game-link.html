<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>连连看 · 连线消除</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(145deg, #2b4b3c 0%, #1f3a2e 100%);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 8px;
    }

    .game-wrapper {
      background: #3a5e4b;
      padding: min(12px, 1.5vh) min(16px, 1.5vw);
      border-radius: 32px;
      box-shadow: 0 18px 28px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.2);
      border: 1px solid #69a183;
      /* 占满可用高度和宽度 */
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .game-panel {
      background: #f3efdd;
      padding: min(10px, 1vh) min(12px, 1vw);
      border-radius: 20px;
      box-shadow: inset 0 6px 10px rgba(0, 0, 0, 0.1), 0 10px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: min(8px, 1vh);
      flex-shrink: 0;
    }
    
    .title {
      font-size: clamp(1rem, min(2.8vh, 2.8vw), 1.6rem);
      font-weight: 800;
      color: #2f4235;
      text-shadow: 1px 1px 0 #cbbf9b;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .stats {
      display: flex;
      background: #d9d0b5;
      padding: 4px 12px;
      border-radius: 100px;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.15);
      font-size: clamp(0.8rem, min(2.2vh, 2.2vw), 1.2rem);
      font-weight: 600;
      color: #2f4235;
    }
    
    .stats .value {
      background: #1e2e26;
      color: #f5eac9;
      padding: 1px 8px;
      border-radius: 20px;
      margin-left: 6px;
      box-shadow: inset 0 -2px 0 #0e1511;
    }
    
    .icon-btn {
      background: #d8c9a3;
      border: 1px solid #f7efd6;
      border-radius: 50%;
      width: clamp(28px, 4vh, 36px);
      height: clamp(28px, 4vh, 36px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.9rem, 2.2vh, 1.2rem);
      cursor: pointer;
      box-shadow: 0 4px 0 #8f7a55;
      transition: 0.05s linear;
      color: #2b3e31;
    }
    
    .icon-btn:active {
      box-shadow: 0 1px 0 #8f7a55;
      transform: translateY(3px);
    }

    /* 核心棋盘容器 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 4px;
      background: #6b8f78;
      /* 留出大内边距，作为外框连线的显示区域 */
      padding: clamp(12px, 2vh, 24px); 
      border-radius: 16px;
      box-shadow: inset 0 0 0 3px #4d6b58, inset 0 0 18px #1d2e24;
      position: relative;
      flex-grow: 1;
      width: 100%;
      height: 100%;
      /* 保持正方形，如果不允许滚屏，限制最大宽高 */
      max-width: min(100vw - 40px, 100vh - 120px);
      max-height: min(100vw - 40px, 100vh - 120px);
      aspect-ratio: 1;
      margin: 0 auto;
      /* 确保连线可以溢出边界显示 */
      overflow: visible; 
    }
    
    /* 画布覆盖整个网格容器，支持外框连线 */
    #lineCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .cell {
      background: #ebdfc1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1rem, 4vh, 2.2rem);
      box-shadow: 0 4px 0 #a28d64, 0 5px 8px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.05s ease;
      color: #3a2a1a;
      text-shadow: 1px 1px 0 white;
      font-weight: 600;
      transform: translateY(0);
    }
    
    .cell.empty {
      background: #b9ad8f;
      box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.2);
      cursor: default;
      color: transparent;
      text-shadow: none;
      transform: translateY(2px);
    }
    
    .cell.selected {
      box-shadow: 0 0 0 3px #f9e874, 0 0 0 5px #d4a024, 0 6px 10px black;
      transform: scale(1.05) translateY(-2px);
      background: #fff3d1;
      z-index: 2;
    }
    
    .message {
      text-align: center;
      font-size: clamp(0.9rem, min(2.6vh, 2.6vw), 1.2rem);
      font-weight: 600;
      color: #f1e9d0;
      text-shadow: 2px 2px 0 #1a2a20;
      min-height: 1.2em;
      margin-top: 8px;
      flex-shrink: 0;
    }

    @media (max-height: 650px) {
      .grid-container { gap: 3px; padding: 10px; }
      .cell { font-size: clamp(0.8rem, 3.5vh, 1.8rem); border-radius: 6px; }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-panel">
    <div class="header">
      <div class="title">🀄 连连看</div>
      <div class="controls">
        <div class="stats">
          剩余 <span class="value" id="remainCount">64</span>
        </div>
        <button class="icon-btn" id="resetBtn" title="重新洗牌">🔄</button>
      </div>
    </div>

    <div class="grid-container" id="grid">
      <canvas id="lineCanvas"></canvas>
    </div>

    <div class="message" id="message"></div>
  </div>
</div>

<script>
  (function(){
    const ROWS = 8;
    const COLS = 8;
    const SYMBOLS = ['🍎','🍊','🍇','🍉','🍓','🍒','🍋','🍑','🥝','🍌','🍍','🥥'];
    const PAIRS_COUNT = (ROWS * COLS) / 2;

    let grid = [];              
    let selected = null;       
    let remainingPairs = PAIRS_COUNT;
    let gameOver = false;
    
    let canvas, ctx;
    let lineTimer = null;      

    const gridContainer = document.getElementById('grid');
    const remainSpan = document.getElementById('remainCount');
    const messageDiv = document.getElementById('message');

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function createRandomBoard() {
      const pairs = [];
      for (let i = 0; i < PAIRS_COUNT; i++) {
        const sym = SYMBOLS[i % SYMBOLS.length];
        pairs.push(sym, sym);
      }
      const shuffled = shuffleArray(pairs);
      const board = [];
      let idx = 0;
      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          row.push(shuffled[idx++]);
        }
        board.push(row);
      }
      return board;
    }

    // 支持外框连线的寻路算法
    function getConnectPath(r1, c1, r2, c2) {
      if (r1 === r2 && c1 === c2) return null;
      if (grid[r1][c1] === null || grid[r2][c2] === null) return null;
      if (grid[r1][c1] !== grid[r2][c2]) return null;

      // 检查两点之间直线是否通畅 (如果在棋盘内)
      function checkHorizontalClear(row, colA, colB) {
        let minC = Math.min(colA, colB);
        let maxC = Math.max(colA, colB);
        if (maxC - minC === 1) return true;
        for (let c = minC + 1; c < maxC; c++) {
          if (grid[row][c] !== null) return false;
        }
        return true;
      }
      
      function checkVerticalClear(col, rowA, rowB) {
        let minR = Math.min(rowA, rowB);
        let maxR = Math.max(rowA, rowB);
        if (maxR - minR === 1) return true;
        for (let r = minR + 1; r < maxR; r++) {
          if (grid[r][col] !== null) return false;
        }
        return true;
      }

      // 1. 直线连通
      if (r1 === r2 && checkHorizontalClear(r1, c1, c2)) {
        return [{row:r1, col:c1}, {row:r1, col:c2}];
      }
      if (c1 === c2 && checkVerticalClear(c1, r1, r2)) {
        return [{row:r1, col:c1}, {row:r2, col:c2}];
      }

      // 2. 一次折角连通
      if (grid[r1][c2] === null && checkHorizontalClear(r1, c1, c2) && checkVerticalClear(c2, r1, r2)) {
        return [{row:r1, col:c1}, {row:r1, col:c2}, {row:r2, col:c2}];
      }
      if (grid[r2][c1] === null && checkHorizontalClear(r2, c1, c2) && checkVerticalClear(c1, r1, r2)) {
        return [{row:r1, col:c1}, {row:r2, col:c1}, {row:r2, col:c2}];
      }

      // 3. 两次折角连通（包含外框绕行）
      for (let i = 0; i <= ROWS + 1; i++) {
        let vr = (i === 0) ? -1 : (i === ROWS + 1 ? ROWS : i - 1);
        if (vr >= 0 && vr < ROWS && (vr === r1 || vr === r2)) continue;
        
        let vClear1 = true, vClear2 = true;
        let minVR = Math.min(r1, vr), maxVR = Math.max(r1, vr);
        for(let r = minVR + 1; r < maxVR; r++) {
          if (r >= 0 && r < ROWS && grid[r][c1] !== null) { vClear1 = false; break; }
        }
        let minVR2 = Math.min(r2, vr), maxVR2 = Math.max(r2, vr);
        for(let r = minVR2 + 1; r < maxVR2; r++) {
          if (r >= 0 && r < ROWS && grid[r][c2] !== null) { vClear2 = false; break; }
        }
        
        let hClear = true;
        let minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
        for(let c = minC + 1; c < maxC; c++) {
          if (vr >= 0 && vr < ROWS && grid[vr][c] !== null) { hClear = false; break; }
        }

        if (vClear1 && vClear2 && hClear) {
          return [
            {row:r1, col:c1},
            {row:vr, col:c1},
            {row:vr, col:c2},
            {row:r2, col:c2}
          ];
        }
      }

      for (let i = 0; i <= COLS + 1; i++) {
        let vc = (i === 0) ? -1 : (i === COLS + 1 ? COLS : i - 1);
        if (vc >= 0 && vc < COLS && (vc === c1 || vc === c2)) continue;

        let hClear1 = true, hClear2 = true;
        let minVC = Math.min(c1, vc), maxVC = Math.max(c1, vc);
        for(let c = minVC + 1; c < maxVC; c++) {
          if (c >= 0 && c < COLS && grid[r1][c] !== null) { hClear1 = false; break; }
        }
        let minVC2 = Math.min(c2, vc), maxVC2 = Math.max(c2, vc);
        for(let c = minVC2 + 1; c < maxVC2; c++) {
          if (c >= 0 && c < COLS && grid[r2][c] !== null) { hClear2 = false; break; }
        }

        let vClear = true;
        let minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
        for(let r = minR + 1; r < maxR; r++) {
          if (vc >= 0 && vc < COLS && grid[r][vc] !== null) { vClear = false; break; }
        }

        if (hClear1 && hClear2 && vClear) {
          return [
            {row:r1, col:c1},
            {row:r1, col:vc},
            {row:r2, col:vc},
            {row:r2, col:c2}
          ];
        }
      }

      return null;
    }

    function drawConnectionPath(path) {
      if (!canvas || !ctx) return;
      if (lineTimer) clearTimeout(lineTimer);

      const canvasRect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvasRect.width * dpr;
      canvas.height = canvasRect.height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0); 
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, canvasRect.width, canvasRect.height);

      const cell = gridContainer.querySelector('.cell');
      if (!cell) return;
      
      const cellRect = cell.getBoundingClientRect();
      const cellWidth = cellRect.width;
      const cellHeight = cellRect.height;
      
      const gridStyle = getComputedStyle(gridContainer);
      const gap = parseFloat(gridStyle.gap) || 4;
      const pLeft = parseFloat(gridStyle.paddingLeft) || 0;
      const pTop = parseFloat(gridStyle.paddingTop) || 0;

      // 核心修正：处理 border 边界外的坐标 (-1 或 ROWS/COLS)
      // 利用 cellWidth 和 gap 外推坐标，使线条正好画在边界之外。
      function getCellCenter(row, col) {
        let x = pLeft + col * (cellWidth + gap) + cellWidth / 2;
        let y = pTop + row * (cellHeight + gap) + cellHeight / 2;
        
        // 处理外边框绕行时的特殊坐标
        if (row === -1) y = pTop - gap - 4; // 上方外框
        if (row === ROWS) y = pTop + ROWS * (cellHeight + gap) - gap + 4; // 下方外框
        if (col === -1) x = pLeft - gap - 4; // 左侧外框
        if (col === COLS) x = pLeft + COLS * (cellWidth + gap) - gap + 4; // 右侧外框

        return { x, y };
      }

      const points = path.map(p => getCellCenter(p.row, p.col));

      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      
      // 外发光
      ctx.beginPath();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 8;
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 10;
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.stroke();

      // 主线条
      ctx.beginPath();
      ctx.strokeStyle = '#ffd966';
      ctx.lineWidth = 5;
      ctx.shadowColor = '#f0b400';
      ctx.shadowBlur = 12;
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.stroke();

      // 折点
      points.forEach((p, idx) => {
        if (idx !== 0 && idx !== points.length - 1) {
          ctx.beginPath();
          ctx.fillStyle = '#ffffff';
          ctx.arc(p.x, p.y, 6, 0, 2 * Math.PI);
          ctx.fill();
          ctx.fillStyle = '#f0b400';
          ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
          ctx.fill();
        }
      });
      
      // 首尾点
      [points[0], points[points.length-1]].forEach(p => {
        ctx.beginPath();
        ctx.fillStyle = '#ffe484';
        ctx.arc(p.x, p.y, 7, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#ffb800';
        ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
        ctx.fill();
      });

      ctx.shadowBlur = 0;

      lineTimer = setTimeout(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        lineTimer = null;
      }, 300);
    }

    function renderBoard() {
      const cells = gridContainer.querySelectorAll('.cell');
      cells.forEach(cell => cell.remove());

      if (!canvas) {
        canvas = document.getElementById('lineCanvas');
        ctx = canvas.getContext('2d');
      }
      if (gridContainer.lastChild !== canvas) {
        gridContainer.appendChild(canvas);
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (grid[r][c] === null) {
            cell.classList.add('empty');
            cell.textContent = '';
          } else {
            cell.textContent = grid[r][c];
          }
          if (selected && selected.row === r && selected.col === c) {
            cell.classList.add('selected');
          }
          cell.addEventListener('click', (function(row, col) {
            return function() { onCellClick(row, col); };
          })(r, c));
          gridContainer.appendChild(cell);
        }
      }

      remainSpan.textContent = remainingPairs * 2;
      if (remainingPairs === 0 && !gameOver) {
        gameOver = true;
        messageDiv.textContent = '✨ 恭喜！你赢啦！ ✨';
      } else {
        if (!gameOver) messageDiv.textContent = '';
      }
    }

    function onCellClick(row, col) {
      if (gameOver) return;
      
      if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (lineTimer) clearTimeout(lineTimer);

      if (grid[row][col] === null) {
        if (selected) {
          selected = null;
          renderBoard();
        }
        return;
      }

      if (!selected) {
        selected = { row, col };
        renderBoard();
        return;
      }

      const first = selected;
      const second = { row, col };

      if (first.row === row && first.col === col) {
        selected = null;
        renderBoard();
        return;
      }

      if (grid[first.row][first.col] !== grid[row][col]) {
        selected = { row, col };
        renderBoard();
        return;
      }

      const path = getConnectPath(first.row, first.col, row, col);
      if (path) {
        grid[first.row][first.col] = null;
        grid[row][col] = null;
        remainingPairs--;
        selected = null;
        renderBoard();
        drawConnectionPath(path); 
      } else {
        selected = { row, col };
        renderBoard();
      }
    }

    function resetGame() {
      if (lineTimer) clearTimeout(lineTimer);
      if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      grid = createRandomBoard();
      selected = null;
      remainingPairs = PAIRS_COUNT;
      gameOver = false;
      messageDiv.textContent = '';
      renderBoard();
    }

    function init() {
      grid = createRandomBoard();
      canvas = document.getElementById('lineCanvas');
      ctx = canvas.getContext('2d');
      selected = null;
      remainingPairs = PAIRS_COUNT;
      gameOver = false;
      renderBoard();

      document.getElementById('resetBtn').addEventListener('click', resetGame);
    }

    init();
  })();
</script>
</body>
</html>
